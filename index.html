<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Çocuk Oyunları</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#043d62;
  color:#fff;
}

button{
  font-family:inherit;
}

/* =========================================================
   MAIN APP
========================================================= */

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:block;
}


/* =========================================================
   GAME BACKGROUND
========================================================= */

#gameScreen{
  background:
    radial-gradient(
      circle at 50% 5%,
      rgba(255,255,255,.32),
      transparent 25%
    ),
    linear-gradient(
      180deg,
      #52d5ef 0%,
      #159dce 25%,
      #0877a5 55%,
      #034f72 100%
    );
}

.sun{
  position:absolute;
  width:95px;
  height:95px;
  border-radius:50%;
  right:7%;
  top:20px;
  background:#fff3a8;
  box-shadow:
    0 0 30px #fff,
    0 0 70px rgba(255,255,190,.7);
}

.cloud{
  position:absolute;
  width:160px;
  height:40px;
  left:5%;
  top:55px;
  background:rgba(255,255,255,.65);
  border-radius:40px;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.65);
  border-radius:50%;
}

.cloud:before{
  width:65px;
  height:65px;
  left:20px;
  top:-32px;
}

.cloud:after{
  width:75px;
  height:75px;
  left:75px;
  top:-42px;
}


/* =========================================================
   SEA
========================================================= */

#sea{
  position:absolute;
  inset:14% 0 0;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 10%,
      rgba(170,245,255,.45),
      transparent 40%
    ),
    linear-gradient(
      180deg,
      rgba(15,190,225,.9),
      rgba(2,85,121,.98)
    );
}

.lightRay{
  position:absolute;
  top:-10%;
  width:130px;
  height:115%;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.20),
    transparent
  );
  transform:rotate(14deg);
  filter:blur(5px);
  opacity:.35;
}

.ray1{
  left:18%;
}

.ray2{
  left:48%;
  transform:rotate(-10deg);
  opacity:.25;
}

.ray3{
  right:15%;
  transform:rotate(18deg);
  opacity:.20;
}

.seabed{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:28%;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      #d8c391,
      #a58c5f 45%,
      #725c3e 100%
    );

  border-radius:50% 50% 0 0 / 20% 20% 0 0;
}

.rock{
  position:absolute;
  bottom:8%;
  width:110px;
  height:65px;
  border-radius:55% 45% 40% 50%;
  background:
    radial-gradient(
      circle at 30% 25%,
      #7d8d8b,
      #3e5558 55%,
      #1f343c
    );
  box-shadow:0 12px 15px rgba(0,0,0,.3);
}

.rock1{
  left:5%;
}

.rock2{
  right:7%;
  width:140px;
}

.seaweed{
  position:absolute;
  bottom:12%;
  width:45px;
  height:150px;
  border-left:9px solid #1b8b5b;
  border-radius:50%;
  transform:rotate(-8deg);
  filter:drop-shadow(4px 4px 3px rgba(0,0,0,.25));
}

.seaweed:before,
.seaweed:after{
  content:"";
  position:absolute;
  width:25px;
  height:130px;
  border-left:7px solid #39ad67;
  border-radius:50%;
}

.seaweed:before{
  left:15px;
  transform:rotate(15deg);
}

.seaweed:after{
  left:-15px;
  transform:rotate(-18deg);
}

.weed1{
  left:14%;
}

.weed2{
  right:18%;
  transform:scale(1.2) rotate(8deg);
}

.weed3{
  right:4%;
  transform:scale(.8) rotate(-15deg);
}


/* =========================================================
   BUBBLES
========================================================= */

.bubble{
  position:absolute;
  border:2px solid rgba(255,255,255,.65);
  border-radius:50%;
  opacity:.55;
  animation:bubbleRise 10s linear infinite;
}

@keyframes bubbleRise{
  from{
    transform:translateY(0);
    opacity:.55;
  }

  to{
    transform:translateY(-110vh);
    opacity:0;
  }
}


/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;
  z-index:100;
  top:8px;
  left:50%;
  transform:translateX(-50%);

  width:min(1050px,96%);

  padding:9px 14px;

  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.97),
      rgba(220,248,255,.95)
    );

  color:#123d55;

  border:2px solid rgba(255,255,255,.9);

  box-shadow:
    0 8px 30px rgba(0,40,70,.35);
}

.hudTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:clamp(21px,3.5vw,34px);
  font-weight:1000;
  color:#0875a5;
  text-shadow:0 2px 0 white;
}

.stats{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  font-size:14px;
  font-weight:900;
}

.soundBtn{
  border:0;
  border-radius:13px;
  background:#0876a8;
  color:#fff;
  padding:9px 13px;
  font-weight:900;
  cursor:pointer;
}


/* =========================================================
   MISSION / TARGET
========================================================= */

#mission{
  position:absolute;
  z-index:95;

  top:94px;
  left:50%;
  transform:translateX(-50%);

  width:min(390px,88%);

  background:
    linear-gradient(
      180deg,
      #9a632e,
      #714319
    );

  color:#fff;

  border:4px solid #e4b66a;

  border-radius:20px;

  padding:10px 16px;

  text-align:center;

  box-shadow:
    0 7px 18px rgba(0,0,0,.35);
}

.missionTitle{
  font-size:clamp(14px,3vw,19px);
  font-weight:900;
}

#target{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  margin-left:7px;

  width:55px;
  height:55px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      #d9f4ff 25%,
      #46aee0 70%,
      #08628d
    );

  color:#083f61;

  font-size:35px;
  font-weight:1000;

  border:4px solid white;

  box-shadow:
    0 4px 10px rgba(0,0,0,.35);
}

.timerWrap{
  margin-top:7px;
}

.timerText{
  font-size:13px;
  font-weight:900;
}

.timebar{
  width:100%;
  height:9px;
  margin-top:4px;

  background:#234a5b;
  border-radius:20px;
  overflow:hidden;
}

#timebar{
  display:block;
  width:100%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #29d478,
      #a8dc38,
      #ffc32e
    );

  transition:width .1s linear;
}


/* =========================================================
   REALISTIC SVG FISH
========================================================= */

.fish{
  position:absolute;

  width:145px;
  height:105px;

  z-index:30;

  cursor:pointer;
  touch-action:manipulation;

  user-select:none;

  transition:
    left 4s linear,
    top 4s ease-in-out,
    transform .2s;

  filter:
    drop-shadow(0 9px 7px rgba(0,25,40,.45));
}

.fish svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.fishNumber{
  position:absolute;

  left:50%;
  top:51%;

  transform:translate(-50%,-50%);

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      #eef8ff 55%,
      #bdd8e8
    );

  border:3px solid white;

  color:#123d55;

  font-size:25px;
  font-weight:1000;

  text-shadow:none;

  box-shadow:
    0 3px 7px rgba(0,0,0,.4);
}

.fish:hover{
  transform:scale(1.08);
}

.fish.good{
  animation:caught .65s forwards;
}

@keyframes caught{
  0%{
    transform:scale(1);
  }

  35%{
    transform:scale(1.3) rotate(-7deg);
  }

  100%{
    transform:scale(0) rotate(25deg);
    opacity:0;
  }
}

.fish.bad{
  animation:wrongFish .4s;
}

@keyframes wrongFish{
  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-16px);
  }

  75%{
    transform:translateX(16px);
  }
}


/* =========================================================
   FISHING NET
========================================================= */

#net{
  position:absolute;
  z-index:80;

  width:150px;
  height:150px;

  pointer-events:none;

  display:none;

  transform:rotate(-20deg);

  filter:
    drop-shadow(0 9px 7px rgba(0,0,0,.55));
}

.netRim{
  position:absolute;
  inset:0;

  border:8px solid #dce8ec;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      transparent 52%,
      rgba(255,255,255,.25)
    );

  box-shadow:
    inset 0 0 0 3px #63747c,
    0 5px 10px rgba(0,0,0,.45);
}

.netMesh{
  position:absolute;
  inset:13px;

  border-radius:50%;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 10px,
      rgba(255,255,255,.7) 11px 12px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 10px,
      rgba(255,255,255,.7) 11px 12px
    );

  clip-path:circle(50%);
}

.netHandle{
  position:absolute;

  width:165px;
  height:18px;

  right:-135px;
  top:112px;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      #d69a5a,
      #7b451e 50%,
      #b87335
    );

  border:2px solid #4d2b16;

  transform:rotate(52deg);

  box-shadow:
    0 5px 7px rgba(0,0,0,.5);
}

.netGrip{
  position:absolute;

  width:43px;
  height:25px;

  right:-155px;
  top:173px;

  border-radius:9px;

  background:
    linear-gradient(
      #303e43,
      #11191c
    );

  transform:rotate(52deg);
}


/* =========================================================
   FEEDBACK
========================================================= */

#feedback{
  position:absolute;
  z-index:200;

  left:50%;
  top:53%;

  transform:
    translate(-50%,-50%)
    scale(.85);

  opacity:0;
  pointer-events:none;

  width:min(440px,88%);

  background:
    linear-gradient(
      180deg,
      white,
      #e9faff
    );

  color:#11698b;

  border-radius:25px;

  border:3px solid white;

  padding:20px;

  text-align:center;

  box-shadow:
    0 18px 50px rgba(0,30,50,.5);

  transition:.2s;
}

#feedback.show{
  opacity:1;
  transform:
    translate(-50%,-50%)
    scale(1);
}

.feedbackIcon{
  font-size:55px;
}

.feedbackTitle{
  font-size:29px;
  font-weight:1000;
}

.feedbackText{
  font-size:17px;
  margin-top:5px;
  font-weight:700;
}


/* =========================================================
   MENU / GAME SELECTOR
========================================================= */

#menuScreen{
  background:
    radial-gradient(
      circle at 50% 20%,
      #62d8f0,
      #087da8 60%,
      #034563
    );

  overflow:auto;
}

.menuBox{
  width:min(900px,94%);
  margin:40px auto;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.97),
      rgba(228,249,255,.97)
    );

  color:#123d55;

  border-radius:30px;

  padding:30px;

  text-align:center;

  box-shadow:
    0 20px 60px rgba(0,30,50,.45);
}

.menuLogo{
  font-size:45px;
  font-weight:1000;
  color:#0876a8;
}

.menuSubtitle{
  font-size:18px;
  margin-bottom:25px;
}

.gamesGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

  gap:18px;
}

.gameCard{
  border:3px solid #bdeafa;
  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      #fff,
      #eafaff
    );

  padding:20px;

  box-shadow:
    0 7px 15px rgba(0,70,100,.15);

  cursor:pointer;

  transition:.2s;
}

.gameCard:hover{
  transform:translateY(-4px);
  border-color:#3bbce5;
}

.gameCard.disabled{
  opacity:.55;
  cursor:default;
}

.gameIcon{
  font-size:58px;
}

.gameTitle{
  font-size:24px;
  font-weight:1000;
  color:#0876a8;
}

.gameDescription{
  font-size:15px;
  line-height:1.5;
  color:#527082;
}

.playGame{
  margin-top:12px;

  border:0;
  border-radius:15px;

  padding:11px 22px;

  background:
    linear-gradient(
      #ff9d52,
      #ed6331
    );

  color:white;

  font-size:17px;
  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 4px 0 #b94c1d;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  #hud{
    top:4px;
    width:98%;
    padding:6px 8px;
    border-radius:16px;
  }

  .hudTop{
    gap:5px;
  }

  .logo{
    font-size:19px;
  }

  .stats{
    gap:7px;
    font-size:10px;
  }

  .soundBtn{
    padding:7px 8px;
    font-size:11px;
  }

  /*
    IMPORTANT:
    Mission remains visible on mobile.
  */

  #mission{
    top:68px;
    width:92%;
    padding:7px 9px;
    border-width:3px;
    border-radius:15px;
  }

  .missionTitle{
    font-size:14px;
  }

  #target{
    width:45px;
    height:45px;
    font-size:29px;
  }

  .fish{
    width:105px;
    height:78px;
  }

  .fishNumber{
    width:31px;
    height:31px;
    font-size:21px;
    border-width:2px;
  }

  #net{
    width:105px;
    height:105px;
  }

  .netHandle{
    width:125px;
    right:-102px;
    top:80px;
  }

  .netGrip{
    right:-118px;
    top:125px;
  }

  #feedback{
    top:55%;
    padding:16px;
  }

  .feedbackIcon{
    font-size:42px;
  }

  .feedbackTitle{
    font-size:24px;
  }

  .feedbackText{
    font-size:15px;
  }

  .menuBox{
    margin:20px auto;
    padding:20px 14px;
  }

  .menuLogo{
    font-size:34px;
  }

  .gamesGrid{
    grid-template-columns:1fr;
  }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

  .logo{
    font-size:16px;
  }

  .stats{
    font-size:9px;
    gap:4px;
  }

  .soundBtn{
    font-size:9px;
    padding:6px;
  }

  #mission{
    top:65px;
  }

  .fish{
    width:90px;
    height:68px;
  }
}
</style>
</head>


<body>

<div id="app">


<!-- =====================================================
     GAME SELECTOR
===================================================== -->

<section id="menuScreen" class="screen active">

  <div class="menuBox">

    <div class="menuLogo">
      🎮 ÇOCUK OYUNLARI
    </div>

    <div class="menuSubtitle">
      Eğlenerek öğren!
    </div>

    <div id="gamesGrid" class="gamesGrid"></div>

  </div>

</section>


<!-- =====================================================
     GAME SCREEN
===================================================== -->

<section id="gameScreen" class="screen">

  <div class="sun"></div>
  <div class="cloud"></div>

  <div id="hud">

    <div class="hudTop">

      <div class="logo">
        🎣 SAYI AVI
      </div>

      <div class="stats">

        <span>
          ⭐ Puan:
          <b id="score">0</b>
        </span>

        <span>
          🏆 Tur:
          <b id="round">1</b>/10
        </span>

        <span>
          🔥 Seri:
          <b id="streak">0</b>
        </span>

      </div>

      <button
        id="soundBtn"
        class="soundBtn">
        🔊
      </button>

    </div>

  </div>


  <!-- QUESTION ALWAYS VISIBLE -->

  <div id="mission">

    <div class="missionTitle">
      🐟 ŞU SAYIYI YAKALA:
    </div>

    <div id="target">
      5
    </div>

    <div class="timerWrap">

      <div class="timerText">
        Kalan süre:
        <span id="timerText">20</span>
        saniye
      </div>

      <div class="timebar">
        <i id="timebar"></i>
      </div>

    </div>

  </div>


  <!-- SEA -->

  <div id="sea">

    <div class="lightRay ray1"></div>
    <div class="lightRay ray2"></div>
    <div class="lightRay ray3"></div>

    <div class="seabed"></div>

    <div class="rock rock1"></div>
    <div class="rock rock2"></div>

    <div class="seaweed weed1"></div>
    <div class="seaweed weed2"></div>
    <div class="seaweed weed3"></div>

  </div>


  <!-- FISHING NET -->

  <div id="net">

    <div class="netRim"></div>
    <div class="netMesh"></div>
    <div class="netHandle"></div>
    <div class="netGrip"></div>

  </div>


  <!-- FEEDBACK -->

  <div id="feedback">

    <div id="feedbackIcon"
         class="feedbackIcon">
      🎉
    </div>

    <div id="feedbackTitle"
         class="feedbackTitle">
      AFERİN!
    </div>

    <div id="feedbackText"
         class="feedbackText">
    </div>

  </div>

</section>

</div>


<script>

/* =========================================================
   APP ARCHITECTURE
   ---------------------------------------------
   THIS IS THE FOUNDATION FOR MANY GAMES.
   To add another game later, add a new object here.
========================================================= */

const GAME_REGISTRY = [];


function registerGame(game){

  GAME_REGISTRY.push(game);

}


/* =========================================================
   SCREEN MANAGEMENT
========================================================= */

const menuScreen =
  document.getElementById("menuScreen");

const gameScreen =
  document.getElementById("gameScreen");


function showScreen(screen){

  document
    .querySelectorAll(".screen")
    .forEach(function(s){
      s.classList.remove("active");
    });

  screen.classList.add("active");

}


/* =========================================================
   GAME MENU
========================================================= */

function renderGames(){

  const grid =
    document.getElementById("gamesGrid");

  grid.innerHTML = "";

  GAME_REGISTRY.forEach(function(game){

    const card =
      document.createElement("div");

    card.className =
      "gameCard" +
      (game.enabled === false
        ? " disabled"
        : "");

    card.innerHTML = `

      <div class="gameIcon">
        ${game.icon}
      </div>

      <div class="gameTitle">
        ${game.title}
      </div>

      <div class="gameDescription">
        ${game.description}
      </div>

      ${
        game.enabled === false
        ?
        `<div style="margin-top:12px;font-weight:900">
          🔒 Yakında
        </div>`
        :
        `<button class="playGame">
          ▶ Oyuna Başla
        </button>`
      }

    `;

    if(game.enabled !== false){

      card
        .querySelector(".playGame")
        .addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            startRegisteredGame(game.id);

          }
        );

    }

    grid.appendChild(card);

  });

}


/* =========================================================
   REGISTERED GAME STARTER
========================================================= */

function startRegisteredGame(id){

  const game =
    GAME_REGISTRY.find(
      function(g){
        return g.id === id;
      }
    );

  if(!game) return;

  showScreen(gameScreen);

  if(typeof game.start === "function"){
    game.start();
  }

}


/* =========================================================
   SAYI AVI GAME
========================================================= */

registerGame({

  id:"sayi-avi",

  title:"Sayı Avı",

  icon:"🐟🎣",

  description:
    "Doğru sayıyı taşıyan balığı bul ve ağ ile yakala.",

  enabled:true,

  start:startSayiAvi

});


/*
  FUTURE GAMES CAN BE ADDED LIKE THIS:

  registerGame({

    id:"renk-avi",

    title:"Renk Avı",

    icon:"🎨",

    description:
      "Doğru renkteki nesneyi bul.",

    enabled:true,

    start:startRenkAvi

  });

*/


/* =========================================================
   SAYI AVI VARIABLES
========================================================= */

const sea =
  document.getElementById("sea");

const net =
  document.getElementById("net");

const targetEl =
  document.getElementById("target");

const scoreEl =
  document.getElementById("score");

const roundEl =
  document.getElementById("round");

const streakEl =
  document.getElementById("streak");

const timebar =
  document.getElementById("timebar");

const timerText =
  document.getElementById("timerText");

const feedback =
  document.getElementById("feedback");

const feedbackIcon =
  document.getElementById("feedbackIcon");

const feedbackTitle =
  document.getElementById("feedbackTitle");

const feedbackText =
  document.getElementById("feedbackText");

const soundBtn =
  document.getElementById("soundBtn");


let score = 0;

let round = 1;

let streak = 0;

let target = 1;

let playing = false;

let locked = false;

let timer = null;

let timeLeft = 20;


/*
  CHANGE THIS NUMBER IF YOU WANT
  MORE OR LESS TIME.

  20 = 20 seconds
*/

const ROUND_SECONDS = 20;


/* =========================================================
   AUDIO SYSTEM
========================================================= */

let soundOn = true;

let audioUnlocked = false;

let audioContext = null;

const sounds = {};


const SOUND_FILES = {

  win:"sounds/win.wav",

  wrong:"sounds/wrong.wav",

  time:"sounds/time.wav",

  click:"sounds/click.wav",

  splash:"sounds/splash.wav",

  success:"sounds/success.wav",

  error:"sounds/error.wav",

  sea:"sounds/sea.wav"

};


/* =========================================================
   AUDIO INITIALIZATION
========================================================= */

function initAudio(){

  if(audioUnlocked) return;

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    audioUnlocked = true;

  }catch(e){

    console.log(
      "WebAudio unavailable"
    );

  }

}


/* =========================================================
   LOAD SOUND FILES
========================================================= */

function loadSounds(){

  Object.keys(SOUND_FILES)
    .forEach(function(name){

      const audio =
        new Audio(
          SOUND_FILES[name]
        );

      audio.preload = "auto";

      audio.volume =
        name === "sea"
        ? .12
        : .9;

      if(name === "sea"){
        audio.loop = true;
      }

      sounds[name] = audio;

    });

}


/* =========================================================
   FALLBACK BEEP
========================================================= */

function fallbackTone(type){

  if(!audioContext) return;

  try{

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    let frequency = 500;

    if(type === "click"){
      frequency = 600;
    }

    if(type === "success"){
      frequency = 800;
    }

    if(type === "wrong"){
      frequency = 180;
    }

    if(type === "time"){
      frequency = 120;
    }

    oscillator.frequency.value =
      frequency;

    oscillator.type =
      "sine";

    gain.gain.setValueAtTime(
      .001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .15,
      audioContext.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + .22
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + .24
    );

  }catch(e){}

}


/* =========================================================
   PLAY SOUND
========================================================= */

function playSound(name){

  if(!soundOn) return;

  initAudio();

  const audio =
    sounds[name];

  if(audio){

    try{

      audio.currentTime = 0;

      const promise =
        audio.play();

      if(promise){
        promise.catch(function(){

          fallbackTone(name);

        });
      }

      return;

    }catch(e){}

  }

  fallbackTone(name);

}


/* =========================================================
   SEA AMBIENCE
========================================================= */

function startSeaSound(){

  if(!soundOn) return;

  const seaSound =
    sounds.sea;

  if(!seaSound) return;

  seaSound.loop = true;

  seaSound.volume = .12;

  seaSound.play()
    .catch(function(){

      /* Browser may require user gesture */

    });

}


function stopSeaSound(){

  if(!sounds.sea) return;

  sounds.sea.pause();

  sounds.sea.currentTime = 0;

}


/* =========================================================
   SOUND BUTTON
========================================================= */

soundBtn.addEventListener(
  "click",
  function(){

    initAudio();

    soundOn = !soundOn;

    if(soundOn){

      soundBtn.textContent =
        "🔊";

      startSeaSound();

    }else{

      soundBtn.textContent =
        "🔇";

      stopSeaSound();

    }

  }
);


/* =========================================================
   UNLOCK AUDIO ON FIRST TOUCH
========================================================= */

document.addEventListener(
  "pointerdown",
  function(){

    initAudio();

  },
  {
    once:false,
    passive:true
  }
);

/* =========================================================
   RANDOM NUMBER
========================================================= */

function randomNumber(min,max){

  return Math.floor(
    Math.random() *
    (max-min+1)
  ) + min;

}


/* =========================================================
   CLEAR FISH
========================================================= */

function clearFish(){

  document
    .querySelectorAll(".fish")
    .forEach(function(fish){

      fish.remove();

    });

}


/* =========================================================
   CREATE FISH
========================================================= */

function createFish(){

  clearFish();

  /*
    1 - 10 always exist.
    Then 4 additional random fish.
  */

  const numbers = [];

  for(
    let i=1;
    i<=10;
    i++
  ){

    numbers.push(i);

  }

  for(
    let i=0;
    i<4;
    i++
  ){

    numbers.push(
      randomNumber(1,10)
    );

  }


  numbers.sort(
    function(){
      return Math.random()-.5;
    }
  );


  numbers.forEach(
    function(number,index){

      const fish =
        document.createElement("div");

      fish.className =
        "fish";

      const colors =
        FISH_TYPES[
          index %
          FISH_TYPES.length
        ];


      fish.innerHTML =

        createFishSVG(colors)

        +

        `
        <div class="fishNumber">
          ${number}
        </div>
        `;


      fish.dataset.number =
        number;


      /*
        Keep fish away from
        the mission box.
      */

      fish.style.left =
        randomNumber(2,82) + "%";

      fish.style.top =
        randomNumber(20,82) + "%";


      fish.addEventListener(
        "pointerdown",
        function(e){

          e.preventDefault();

          catchFish(fish);

        }
      );


      sea.appendChild(fish);


      moveFish(fish);

    }
  );

}


/* =========================================================
   FISH MOVEMENT
========================================================= */

function moveFish(fish){

  if(
    !playing ||
    !fish.parentNode
  ){
    return;
  }


  const duration =
    randomNumber(3500,6000);


  /*
    Flip direction sometimes.
  */

  const direction =
    Math.random() > .5
    ? 1
    : -1;


  fish.style.transform =
    "scaleX(" +
    direction +
    ")";


  fish.style.left =
    randomNumber(3,84) + "%";

  fish.style.top =
    randomNumber(20,84) + "%";


  setTimeout(
    function(){

      moveFish(fish);

    },
    duration
  );

}


/* =========================================================
   START ROUND
========================================================= */

function startRound(){

  locked = false;

  feedback.classList.remove(
    "show"
  );

  net.style.display =
    "none";


  target =
    randomNumber(1,10);


  targetEl.textContent =
    target;


  createFish();

  startTimer();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  clearInterval(timer);


  timeLeft =
    ROUND_SECONDS;


  timerText.textContent =
    Math.ceil(timeLeft);


  timebar.style.width =
    "100%";


  timer =
    setInterval(
      function(){

        timeLeft -= .1;


        const percent =
          Math.max(
            0,
            timeLeft /
            ROUND_SECONDS *
            100
          );


        timebar.style.width =
          percent + "%";


        timerText.textContent =
          Math.ceil(
            Math.max(
              0,
              timeLeft
            )
          );


        if(timeLeft <= 0){

          clearInterval(timer);

          if(!locked){

            timeExpired();

          }

        }

      },
      100
    );

}


/* =========================================================
   TIME EXPIRED
========================================================= */

function timeExpired(){

  locked = true;

  streak = 0;

  streakEl.textContent =
    "0";


  playSound("time");

  showFeedback(
    "⏰",
    "Süre Doldu!",
    "Tekrar deneyebilirsin."
  );


  setTimeout(
    nextRound,
    1700
  );

}


/* =========================================================
   CATCH FISH
========================================================= */

function catchFish(fish){

  if(
    !playing ||
    locked
  ){
    return;
  }


  initAudio();

  playSound("click");


  /*
    Put net over selected fish.
  */

  const rect =
    fish.getBoundingClientRect();


  net.style.display =
    "block";


  net.style.left =
    (
      rect.left +
      rect.width/2 -
      75
    ) + "px";


  net.style.top =
    (
      rect.top +
      rect.height/2 -
      75
    ) + "px";


  playSound("splash");


  const value =
    Number(
      fish.dataset.number
    );


  /* =========================================
     CORRECT
  ========================================= */

  if(value === target){

    locked = true;

    clearInterval(timer);


    const gained =
      10 +
      streak * 2;


    score += gained;

    streak++;


    scoreEl.textContent =
      score;

    streakEl.textContent =
      streak;


    fish.classList.add(
      "good"
    );


    playSound("success");


    setTimeout(
      function(){

        playSound("win");

      },
      150
    );


    showFeedback(
      "🎉",
      "AFERİN!",
      "Doğru sayıyı yakaladın! +" +
      gained +
      " puan"
    );


    setTimeout(
      nextRound,
      1500
    );


    return;

  }


  /* =========================================
     WRONG
  ========================================= */

  fish.classList.add(
    "bad"
  );


  streak = 0;


  streakEl.textContent =
    "0";


  playSound("wrong");


  setTimeout(
    function(){

      playSound("error");

    },
    100
  );


  showFeedback(
    "🐟",
    "Tekrar Dene!",
    "Bu balıkta " +
    value +
    " yazıyor."
  );


  setTimeout(
    function(){

      fish.classList.remove(
        "bad"
      );

      feedback.classList.remove(
        "show"
      );

    },
    1000
  );

}


/* =========================================================
   FEEDBACK
========================================================= */

function showFeedback(
  icon,
  title,
  text
){

  feedbackIcon.textContent =
    icon;

  feedbackTitle.textContent =
    title;

  feedbackText.textContent =
    text;

  feedback.classList.add(
    "show"
  );

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

  feedback.classList.remove(
    "show"
  );

  clearInterval(timer);

  net.style.display =
    "none";


  if(round >= 10){

    finishGame();

    return;

  }


  round++;

  roundEl.textContent =
    round;


  startRound();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

  playing = false;

  clearInterval(timer);

  clearFish();

  stopSeaSound();


  showFeedback(
    "🏆",
    "HARİKA!",
    "Oyunu " +
    score +
    " puanla tamamladın!"
  );


  setTimeout(
    function(){

      feedback.classList.remove(
        "show"
      );

      showScreen(menuScreen);

    },
    2500
  );

}


/* =========================================================
   START SAYI AVI
========================================================= */

function startSayiAvi(){

  /*
    Unlock audio after user
    clicked the game.
  */

  initAudio();


  score = 0;

  round = 1;

  streak = 0;

  playing = true;


  scoreEl.textContent =
    "0";

  roundEl.textContent =
    "1";

  streakEl.textContent =
    "0";


  startSeaSound();

  startRound();

}


/* =========================================================
   BUBBLES
========================================================= */

function createBubbles(){

  for(
    let i=0;
    i<24;
    i++
  ){

    const bubble =
      document.createElement("i");

    bubble.className =
      "bubble";


    const size =
      randomNumber(7,22);


    bubble.style.width =
      size + "px";

    bubble.style.height =
      size + "px";


    bubble.style.left =
      randomNumber(1,98) + "%";


    bubble.style.top =
      randomNumber(45,105) + "%";


    bubble.style.animationDelay =
      "-" +
      randomNumber(1,10) +
      "s";


    sea.appendChild(
      bubble
    );

  }

}


/* =========================================================
   MOVE NET WITH POINTER
========================================================= */

document.addEventListener(
  "pointermove",
  function(e){

    if(!playing) return;


    net.style.display =
      "block";


    net.style.left =
      (
        e.clientX -
        75
      ) + "px";


    net.style.top =
      (
        e.clientY -
        75
      ) + "px";

  }
);


/* =========================================================
   TOUCH
========================================================= */

document.addEventListener(
  "touchstart",
  function(){

    if(playing){

      net.style.display =
        "block";

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   INITIALIZATION
========================================================= */

loadSounds();

createBubbles();

renderGames();


/* =========================================================
   PREVENT CONTEXT MENU DURING GAME
========================================================= */

document.addEventListener(
  "contextmenu",
  function(e){

    if(playing){

      e.preventDefault();

    }

  }
);

</script>
