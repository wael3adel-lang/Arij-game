<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🎣 Sayı Avı</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{background:#76d8ff}
#app{height:100%;position:relative;background:linear-gradient(#8ee8ff 0 18%,#43c7ee 18% 48%,#087db1 48% 100%)}
.sky{position:absolute;inset:0 0 82% 0;background:linear-gradient(#b8f3ff,#83def9)}
.sun{position:absolute;width:90px;height:90px;border-radius:50%;background:#ffe38a;right:7%;top:8%;box-shadow:0 0 35px #fff6}
.cloud{position:absolute;background:#fff;border-radius:50px;width:150px;height:38px;top:13%;left:8%;opacity:.8}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55px;height:55px;left:25px;top:-25px}.cloud:after{width:70px;height:70px;left:65px;top:-34px}
.header{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);width:min(760px,94%);background:#ffffffed;border-radius:22px;padding:10px 18px;text-align:center;box-shadow:0 5px 18px #0002}
.title{font-size:clamp(24px,4vw,36px);font-weight:900;color:#0875a7;margin:0}
.instruction{font-size:clamp(17px,3vw,25px);font-weight:800;color:#173d55}.instruction b{font-size:1.35em;color:#ed6337}
.info{display:flex;justify-content:center;gap:28px;font-weight:800;margin-top:4px}.stars{color:#e9a500}
#water{position:absolute;inset:18% 0 0;overflow:hidden}
.wave{position:absolute;left:-5%;width:110%;height:55px;border-radius:50%;background:#ffffff22;top:5%}
.wave2{top:17%;opacity:.6}.wave3{top:32%;opacity:.35}
.bubble{position:absolute;border:2px solid #fff8;border-radius:50%;animation:rise linear infinite;opacity:.65}
@keyframes rise{to{transform:translateY(-120vh)}}
.fish{position:absolute;width:105px;height:72px;border-radius:55% 48% 48% 55%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;cursor:pointer;touch-action:none;user-select:none;filter:drop-shadow(0 6px 4px #004b6a55);z-index:8;transition:transform .18s}
.fish:after{content:"";position:absolute;right:-30px;border-top:24px solid transparent;border-bottom:24px solid transparent;border-left:38px solid var(--c);filter:brightness(.92)}
.eye{position:absolute;right:16px;top:13px;width:10px;height:10px;background:#17222b;border-radius:50%;z-index:3}.eye:after{content:"";position:absolute;background:#fff;width:4px;height:4px;border-radius:50%;left:2px;top:1px}
.num{z-index:4}.net{position:absolute;width:112px;height:112px;border:7px solid #f7f7f7;border-radius:50%;z-index:15;pointer-events:none;display:none;box-shadow:0 0 0 3px #075b7899,0 8px 20px #0004}
.net:after{content:"";position:absolute;inset:12px;border:3px dashed #fff;border-radius:50%}
.toast{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:#fff;padding:25px 34px;border-radius:28px;text-align:center;box-shadow:0 15px 40px #0005;opacity:0;pointer-events:none;transition:.25s;min-width:290px}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .big{font-size:52px}.toast h2{margin:4px 0;font-size:30px;color:#137aa5}.toast p{margin:6px 0 16px;font-size:18px}
button{border:0;border-radius:16px;padding:13px 25px;font-size:19px;font-weight:900;background:#ff8738;color:#fff;box-shadow:0 4px 0 #c65b1a;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c65b1a}
.start{position:absolute;z-index:40;left:50%;top:52%;transform:translate(-50%,-50%);background:#fffffff2;border-radius:30px;padding:32px;text-align:center;box-shadow:0 15px 45px #0005;width:min(390px,90%)}
.start .icon{font-size:70px}.start h1{color:#0875a7;margin:5px 0;font-size:34px}.start p{font-size:19px;line-height:1.45}
.fish.caught{animation:caught .45s ease forwards}@keyframes caught{50%{transform:scale(1.4) rotate(-12deg)}100%{transform:scale(0);opacity:0}}
#resultStars{font-size:40px}
@media(max-width:600px){.header{top:5px;padding:8px 10px}.info{gap:14px;font-size:14px}.fish{width:78px;height:55px;font-size:27px}.fish:after{right:-22px;border-top-width:18px;border-bottom-width:18px;border-left-width:28px}.net{width:92px;height:92px}.start{padding:25px}.sun{width:65px;height:65px}}
</style>
</head>
<body>
<div id="app">
<div class="sky"><div class="sun"></div><div class="cloud"></div></div>
<div class="header">
  <div class="title">🎣 SAYI AVI</div>
  <div class="instruction">Şu sayıyı yakala: <b id="target">5</b></div>
  <div class="info"><span>⭐ Puan: <span id="score">0</span></span><span>🏆 Tur: <span id="round">1</span>/10</span></div>
</div>
<div id="water"><div class="wave"></div><div class="wave wave2"></div><div class="wave wave3"></div></div>
<div id="net" class="net"></div>

<div id="start" class="start">
  <div class="icon">🎣🐟</div>
  <h1>Sayı Avı</h1>
  <p>Hedef sayıyı bul ve ağınla yakala!</p>
  <button onclick="startGame()">Oyuna Başla 🚀</button>
</div>

<div id="toast" class="toast">
  <div id="toastIcon" class="big">🎉</div><h2 id="toastTitle">AFERİN!</h2><p id="toastText"></p>
  <button id="toastBtn" onclick="next()">Sonraki Tur ➡️</button>
</div>
</div>
<script>
const water=document.getElementById('water'), net=document.getElementById('net');
let target=5,score=0,round=1,playing=false,locked=false;
const palette=['#ffd166','#ff8fab','#8ce99a','#a5d8ff','#cdb4db','#ffb86b','#f7aef8'];

function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.9;speechSynthesis.speak(u)}
function rand(a,b){return Math.random()*(b-a)+a}
function makeBubbles(){for(let i=0;i<25;i++){let b=document.createElement('i');b.className='bubble';let s=rand(7,25);b.style.width=b.style.height=s+'px';b.style.left=rand(0,100)+'%';b.style.top=rand(60,115)+'%';b.style.animationDuration=rand(7,16)+'s';b.style.animationDelay=rand(-15,0)+'s';water.appendChild(b)}}
function clear(){water.querySelectorAll('.fish').forEach(x=>x.remove())}
function createFish(){
 let nums=[target];while(nums.length<11){let n=Math.floor(rand(1,10));if(!nums.includes(n))nums.push(n)}
 nums.sort(()=>Math.random()-.5);
 nums.forEach((n,i)=>{
   let f=document.createElement('div');f.className='fish';f.style.setProperty('--c',palette[i%palette.length]);f.style.background=palette[i%palette.length];
   f.style.left=rand(2,86)+'%';f.style.top=rand(10,82)+'%';f.dataset.num=n;
   f.innerHTML='<span class="num">'+n+'</span><i class="eye"></i>';
   f.onclick=()=>catchFish(f);
   water.appendChild(f);
   swim(f);
 });
}
function swim(f){
 if(!playing||!f.isConnected)return;
 let dur=rand(3500,7500), x=rand(3,88), y=rand(8,84);
 f.style.transition='left '+dur+'ms linear, top '+rand(2500,5000)+'ms ease-in-out';
 f.style.left=x+'%';f.style.top=y+'%';
 setTimeout(()=>swim(f),dur);
}
function catchFish(f){
 if(!playing||locked)return;
 net.style.display='block';
 let r=f.getBoundingClientRect();net.style.left=(r.left+r.width/2-net.offsetWidth/2)+'px';net.style.top=(r.top+r.height/2-net.offsetHeight/2)+'px';
 let n=+f.dataset.num;
 if(n===target){
   locked=true;score++;document.getElementById('score').textContent=score;f.classList.add('caught');
   speak('Aferin! Harika bir seçim!');
   setTimeout(()=>popup(true),450);
 }else{
   f.animate([{transform:'translateX(-13px)'},{transform:'translateX(13px)'},{transform:'translateX(-9px)'},{transform:'translateX(0)'}],{duration:350});
   speak('Tekrar dene!');
   setTimeout(()=>net.style.display='none',250);
 }
}
function popup(ok){
 document.getElementById('toastIcon').textContent=ok?'🎉':'😊';
 document.getElementById('toastTitle').textContent=ok?'AFERİN!':'TEKRAR DENE!';
 document.getElementById('toastText').textContent=ok?'Doğru sayıyı yakaladın! ⭐':'Bir sonraki turda daha dikkatli ol!';
 document.getElementById('toastBtn').textContent=round>=10?'Sonucu Gör 🏆':'Sonraki Tur ➡️';
 document.getElementById('toast').classList.add('show');
}
function newRound(){
 locked=false;document.getElementById('toast').classList.remove('show');net.style.display='none';clear();
 target=Math.floor(rand(1,10));document.getElementById('target').textContent=target;createFish();
 setTimeout(()=>speak('Şu sayıyı yakala: '+target),350);
}
function startGame(){document.getElementById('start').style.display='none';score=0;round=1;playing=true;document.getElementById('score').textContent=0;document.getElementById('round').textContent=1;newRound()}
function next(){
 document.getElementById('toast').classList.remove('show');
 if(round>=10){finish();return}
 round++;document.getElementById('round').textContent=round;newRound();
}
function finish(){
 playing=false;clear();net.style.display='none';
 let stars=score>=9?'⭐⭐⭐':score>=6?'⭐⭐':'⭐';
 document.getElementById('toastIcon').textContent='🏆';document.getElementById('toastTitle').textContent='OYUN BİTTİ!';
 document.getElementById('toastText').innerHTML='<strong>'+score+'/10</strong> puan kazandın!<br><span id="resultStars">'+stars+'</span><br>'+(score>=8?'Muhteşem! 🌟':'Harika çalıştın! 👏');
 document.getElementById('toastBtn').textContent='Tekrar Oyna 🔄';
 document.getElementById('toastBtn').onclick=()=>{document.getElementById('toastBtn').onclick=next;startGame()};
 document.getElementById('toast').classList.add('show');
 speak('Oyun bitti. '+score+' puan kazandın!');
}
document.addEventListener('pointermove',e=>{if(playing){net.style.display='block';net.style.left=(e.clientX-net.offsetWidth/2)+'px';net.style.top=(e.clientY-net.offsetHeight/2)+'px'}});
makeBubbles();
</script>
</body></html>
