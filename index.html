<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🎣 Sayı Avı 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}body{background:#062544;color:#fff}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#76dcff 0 15%,#22b7e7 15% 45%,#056f9f 100%)}
.sky{position:absolute;inset:0 0 84%;overflow:hidden}.sun{position:absolute;width:90px;height:90px;border-radius:50%;right:7%;top:18px;background:#fff1a1;box-shadow:0 0 55px #fff}.cloud{position:absolute;width:150px;height:38px;border-radius:40px;background:#fff9;left:7%;top:52px}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fff9}.cloud:before{width:58px;height:58px;left:22px;top:-28px}.cloud:after{width:70px;height:70px;left:70px;top:-37px}
.hud{position:absolute;z-index:60;top:10px;left:50%;transform:translateX(-50%);width:min(900px,94%);padding:9px 15px 10px;border:2px solid #ffffffaa;border-radius:24px;background:linear-gradient(180deg,#fffffffa,#dff7ffef);color:#103650;box-shadow:0 9px 30px #003b5b55;text-align:center}.logo{font-size:clamp(23px,4vw,37px);font-weight:1000;color:#0876a8;text-shadow:0 2px 0 #fff}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.mission b{font-size:1.4em;color:#ed6337}.stats{display:flex;justify-content:center;gap:24px;font-weight:900;font-size:14px}.bar{height:7px;background:#cce8f1;border-radius:10px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#24d17e,#ffbd3b,#ff7043);transition:width .1s linear}
.sea{position:absolute;inset:15% 0 0;overflow:hidden;background:radial-gradient(circle at 50% 15%,#8beaff33,transparent 35%),linear-gradient(#13a8dc44,#00547f44)}.wave{position:absolute;width:125%;left:-12%;height:75px;border-radius:50%;background:#ffffff12;top:4%;animation:wave 5s ease-in-out infinite alternate}.wave:nth-child(2){top:30%;opacity:.5;animation-duration:7s}.wave:nth-child(3){top:57%;opacity:.3;animation-duration:9s}@keyframes wave{to{transform:translateX(35px)}}
.sunken{position:absolute;bottom:1%;left:5%;font-size:95px;opacity:.42;filter:drop-shadow(0 10px 8px #002c48)}.plant{position:absolute;bottom:-10px;font-size:78px;opacity:.72;filter:drop-shadow(0 8px 4px #00364d)}.p1{left:18%}.p2{right:18%}.p3{right:4%}.bubble{position:absolute;border:2px solid #fff8;border-radius:50%;opacity:.55;animation:rise 9s linear infinite}@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
/* 3D fish */
.fish{position:absolute;width:116px;height:76px;border-radius:58% 47% 48% 57%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:1000;color:#fff;text-shadow:0 3px 3px #0008;cursor:pointer;touch-action:manipulation;user-select:none;z-index:20;box-shadow:inset -12px -12px 22px #0003,inset 9px 8px 16px #fff5,0 12px 15px #00364f66;transition:filter .15s,transform .15s;transform:rotateY(0deg);overflow:visible}.fish:before{content:"";position:absolute;left:17px;top:18px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0005;z-index:4}.fish:after{content:"";position:absolute;right:-37px;top:15px;border-top:23px solid transparent;border-bottom:23px solid transparent;border-left:42px solid var(--c);filter:drop-shadow(3px 5px 2px #00364d66)}.fish .eye{position:absolute;left:22px;top:24px;width:8px;height:8px;border-radius:50%;background:#14212b;z-index:5}.fish .fin{position:absolute;width:30px;height:26px;background:#fff4;border-radius:70% 20%;transform:rotate(35deg);left:47px;top:-12px;clip-path:polygon(0 100%,100% 0,75% 100%)}.fish .fin2{position:absolute;width:27px;height:23px;background:#0002;border-radius:70% 20%;transform:rotate(-25deg);left:48px;bottom:-10px;clip-path:polygon(0 0,100% 100%,20% 90%)}.fish .shine{position:absolute;left:40px;top:13px;width:31px;height:7px;border-radius:50%;background:#fff6;transform:rotate(-12deg)}.fish:hover{filter:brightness(1.12);transform:scale(1.07) rotate(-2deg)}.fish.good{animation:good .55s forwards}@keyframes good{45%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(0);opacity:0}}.fish.bad{animation:bad .3s}@keyframes bad{25%{margin-left:-14px}75%{margin-left:14px}}
/* 3D fishing net */
.net{position:absolute;z-index:45;width:66px;height:66px;pointer-events:none;display:none;transform:rotate(-18deg);filter:drop-shadow(0 10px 8px #001e3388)}.net .rim{position:absolute;inset:0;border:6px solid #dce9ee;border-radius:50%;background:linear-gradient(135deg,#fff,#899da5 42%,#f8ffff 65%,#61767d);box-shadow:inset 0 0 0 3px #667b83,0 4px 8px #001c2a88}.net .mesh{position:absolute;inset:10px;border:2px dashed #e9f7fa;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 10px,#ffffff77 11px 12px),repeating-linear-gradient(90deg,transparent 0 10px,#ffffff77 11px 12px);clip-path:circle(50%);transform:perspective(120px) rotateX(18deg);opacity:.9}.net .handle{position:absolute;width:88px;height:12px;right:-70px;top:52px;border-radius:12px;background:linear-gradient(#b97b43,#6d3e1d 48%,#d29a5e);border:2px solid #542d16;transform:rotate(53deg);box-shadow:0 5px 6px #001c2a88}.net .grip{position:absolute;width:27px;height:16px;right:-89px;top:86px;border-radius:9px;background:linear-gradient(#26343a,#11191d);transform:rotate(53deg);box-shadow:0 5px 5px #001c2a88}
.center{position:absolute;z-index:90;left:50%;top:54%;transform:translate(-50%,-50%);width:min(470px,91%);background:linear-gradient(180deg,#fffffff7,#e7fafff4);color:#153b52;border:2px solid #fff;border-radius:32px;padding:28px;text-align:center;box-shadow:0 20px 60px #001e3d77}.center .emoji{font-size:72px}.center h1{margin:3px 0 8px;color:#0876a8;font-size:38px}.center p{font-size:18px;line-height:1.5}.center small{display:block;margin:10px 0;color:#527082}button{border:0;border-radius:17px;padding:14px 26px;background:linear-gradient(#ff9b4e,#ed6331);color:#fff;font-size:19px;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 #bd4c1c,0 8px 15px #70300a44;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 2px 0 #bd4c1c}.soundTest{background:linear-gradient(#3faee8,#0877ac);box-shadow:0 5px 0 #07587f;margin-left:7px}
#feedback{position:absolute;z-index:80;left:50%;top:48%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;background:linear-gradient(180deg,#fff,#e9faff);color:#126c91;padding:20px 28px;border-radius:25px;text-align:center;box-shadow:0 15px 45px #00294d66;transition:.2s;border:2px solid #fff}.show{opacity:1!important;transform:translate(-50%,-50%) scale(1)!important}.feedbackIcon{font-size:50px}.feedbackTitle{font-size:29px;font-weight:1000}.choice{display:inline-block;margin-top:5px}
.soundBadge{position:absolute;right:13px;bottom:13px;z-index:65;background:#ffffffdd;color:#17445b;border-radius:16px;padding:8px 11px;font-weight:900;box-shadow:0 4px 12px #00344d55;cursor:pointer}
@media(max-width:600px){.fish{width:82px;height:56px;font-size:25px}.fish:after{right:-27px;top:11px;border-top-width:18px;border-bottom-width:18px;border-left-width:31px}.fish:before{left:12px;top:13px;width:14px;height:14px}.fish .eye{left:17px;top:18px;width:6px;height:6px}.net{width:42px;height:42px}.net .rim{border-width:4px}.net .mesh{inset:6px}.net .handle{width:62px;right:-50px;top:33px;height:8px}.net .grip{width:18px;height:11px;right:-63px;top:58px}.hud{top:5px;padding:7px 9px}.stats{gap:11px;font-size:11px}.center{padding:22px}.center .emoji{font-size:58px}.center h1{font-size:31px}.center p{font-size:16px}}
</style>
</head>
<body>
<div id="game">
 <div class="sky"><div class="sun"></div><div class="cloud"></div></div>
 <div class="hud">
  <div class="logo">🎣 SAYI AVI 3D</div>
  <div class="mission">Şu sayıyı yakala: <b id="target">5</b> <span style="font-size:.65em;color:#527082">(<span id="timerLabel">60</span> sn)</span></div>
  <div class="stats"><span>⭐ Puan: <b id="score">0</b></span><span>🏆 Tur: <b id="round">1</b>/10</span><span>🔥 Seri: <b id="streak">0</b></span></div>
  <div class="bar"><i id="timebar"></i></div>
 </div>
 <div id="sea" class="sea"><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="sunken">⚓</div><div class="plant p1">🌿</div><div class="plant p2">🌿</div><div class="plant p3">🪸</div></div>
 <div id="net" class="net"><div class="rim"></div><div class="mesh"></div><div class="handle"></div><div class="grip"></div></div>
 <div class="soundBadge" id="soundBtn">🔊 SES AÇIK</div>
 <div id="feedback"><div id="ficon" class="feedbackIcon">🎉</div><div id="ftitle" class="feedbackTitle">AFERİN!</div><div id="ftext"></div></div>
 <div id="menu" class="center">
  <div class="emoji">🌊🐠🎣</div><h1>Sayı Avı</h1>
  <p><b>Doğru balığı yakala!</b><br>Hedef sayıyı bul, 3D ağınla yakala ve puan kazan.</p>
  <small>10 tur • Her turda 1 doğru cevap • Her tur 60 saniye • Doğru, yanlış ve tıklama sesleri</small>
  <button id="startBtn">Oyuna Başla 🚀</button>
  <button id="testBtn" class="soundTest">🔊 Sesi Test Et</button>
 </div>
</div>
<script>
(function(){
var sea=document.getElementById('sea'),menu=document.getElementById('menu'),startBtn=document.getElementById('startBtn'),testBtn=document.getElementById('testBtn');
var targetEl=document.getElementById('target'),timerLabel=document.getElementById('timerLabel'),scoreEl=document.getElementById('score'),roundEl=document.getElementById('round'),streakEl=document.getElementById('streak'),bar=document.getElementById('timebar'),net=document.getElementById('net');
var feedback=document.getElementById('feedback'),ficon=document.getElementById('ficon'),ftitle=document.getElementById('ftitle'),ftext=document.getElementById('ftext'),soundBtn=document.getElementById('soundBtn');
var score=0,round=1,streak=0,target=1,playing=false,locked=false,timer=null,timeLeft=0,soundOn=true;
var colors=['#ffca28','#ff6fae','#43d17a','#42a5f5','#9b72cf','#ff914d','#e66cff','#19c7d9','#ef5350','#ffd43b'];
var sounds={};
function loadSounds(){['correct','wrong','click'].forEach(function(n){var a=new Audio('sounds/'+n+'.wav');a.preload='auto';a.volume=.85;sounds[n]=a;});}
function play(n){if(!soundOn||!sounds[n])return;try{sounds[n].currentTime=0;var p=sounds[n].play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function startAmbient(){}
function stopAmbient(){}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clearFish(){var fs=sea.querySelectorAll('.fish');for(var i=0;i<fs.length;i++)fs[i].remove()}
function bubbles(){for(var i=0;i<20;i++){var x=document.createElement('i');x.className='bubble';var s=rand(7,23);x.style.width=s+'px';x.style.height=s+'px';x.style.left=rand(1,98)+'%';x.style.top=rand(45,105)+'%';x.style.animationDelay=(-rand(1,10))+'s';sea.appendChild(x)}}
function makeFish(){
 clearFish();var nums=[];for(var n=1;n<=10;n++)nums.push(n);for(var j=0;j<4;j++)nums.push(rand(1,10));nums.sort(function(){return Math.random()-.5});
 for(var i=0;i<nums.length;i++){
  var f=document.createElement('div'),c=colors[i%colors.length];f.className='fish';f.style.setProperty('--c',c);f.style.background='linear-gradient(145deg,#fff8 0 8%, '+c+' 25%, '+c+' 70%, #0003 100%)';f.style.left=rand(2,84)+'%';f.style.top=rand(7,87)+'%';f.dataset.num=nums[i];
  f.innerHTML='<span>'+nums[i]+'</span><i class="eye"></i><i class="fin"></i><i class="fin2"></i><i class="shine"></i>';
  f.addEventListener('click',function(){catchFish(this)});f.addEventListener('pointerdown',function(){play('click');});sea.appendChild(f);swim(f);
 }
}
function swim(f){if(!playing||!f.parentNode)return;var ms=rand(2200,4700);f.style.transition='left '+ms+'ms linear,top '+ms+'ms ease-in-out,transform .15s';f.style.left=rand(2,86)+'%';f.style.top=rand(7,87)+'%';setTimeout(function(){swim(f)},ms)}
function startRound(){locked=false;feedback.classList.remove('show');clearFish();target=rand(1,10);targetEl.textContent=target;makeFish();startTimer()}
function startTimer(){clearInterval(timer);timeLeft=60;timerLabel.textContent='60';bar.style.width='100%';timer=setInterval(function(){timeLeft-=.1;bar.style.width=Math.max(0,timeLeft/60*100)+'%';timerLabel.textContent=Math.ceil(Math.max(0,timeLeft));if(timeLeft<=0){clearInterval(timer);if(!locked)wrongTimeout()}},100)}
function wrongTimeout(){locked=true;streak=0;streakEl.textContent=0;play('wrong');showFeedback('⏰','Süre doldu!','Daha hızlı ol.');setTimeout(nextRound,1200)}
function catchFish(f){
 if(!playing||locked)return;play('click');net.style.display='block';var fr=f.getBoundingClientRect();var nw=net.getBoundingClientRect().width;var nh=net.getBoundingClientRect().height;net.style.left=(fr.left+fr.width/2-nw/2)+'px';net.style.top=(fr.top+fr.height/2-nh/2)+'px';
 if(Number(f.dataset.num)===target){
  locked=true;clearInterval(timer);var gained=10+streak*2;score+=gained;streak++;scoreEl.textContent=score;streakEl.textContent=streak;f.classList.add('good');play('correct');setTimeout(function(){play('correct')},120);showFeedback('🎉','AFERİN!','Doğru sayıyı yakaladın! +'+gained+' puan');setTimeout(nextRound,1000);
 }else{f.classList.add('bad');streak=0;streakEl.textContent=0;play('wrong');setTimeout(function(){play('wrong')},100);showFeedback('🐟','Tekrar dene!','Bu balıkta '+f.dataset.num+' yazıyor.');setTimeout(function(){f.classList.remove('bad');feedback.classList.remove('show')},900)}
}
function showFeedback(ic,ti,tx){ficon.textContent=ic;ftitle.textContent=ti;ftext.textContent=tx;feedback.classList.add('show')}
function nextRound(){feedback.classList.remove('show');clearInterval(timer);net.style.display='none';if(round>=10){finish();return}round++;roundEl.textContent=round;startRound()}
function finish(){playing=false;clearInterval(timer);clearFish();bar.style.width='0%';play('correct');setTimeout(function(){play('correct')},300);var stars=score>=100?'⭐⭐⭐':score>=70?'⭐⭐':'⭐';menu.innerHTML='<div class="emoji">🏆✨</div><h1>Oyun Bitti!</h1><p><b>'+score+' puan</b> topladın.</p><div style="font-size:32px">'+stars+'</div><p>Harika iş çıkardın! Tekrar oynayarak rekorunu kır.</p><button id="again">Tekrar Oyna 🔄</button>';menu.style.display='block';document.getElementById('again').addEventListener('click',startGame)}
function startGame(){menu.style.display='none';score=0;round=1;streak=0;playing=true;scoreEl.textContent=0;roundEl.textContent=1;streakEl.textContent=0;startRound()}
function testSound(){soundOn=true;soundBtn.textContent='🔊 SES AÇIK';play('click');setTimeout(function(){play('correct')},250)}
startBtn.addEventListener('click',startGame);testBtn.addEventListener('click',testSound);
soundBtn.addEventListener('click',function(){soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 SES AÇIK':'🔇 SES KAPALI';if(soundOn)else stopAmbient()});
document.addEventListener('pointermove',function(e){if(!playing)return;net.style.display='block';var nw=net.getBoundingClientRect().width,nh=net.getBoundingClientRect().height;net.style.left=(e.clientX-nw/2)+'px';net.style.top=(e.clientY-nh/2)+'px'});
document.addEventListener('touchstart',function(){if(playing)net.style.display='block'},{passive:true});
loadSounds();bubbles();
})();
</script>
</body>
</html>
