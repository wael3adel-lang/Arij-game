<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sayı Avı - Çocuk Oyunu</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#087ca5;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

/* =========================
   APP
========================= */

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* =========================
   GAME
========================= */

#game{
  position:absolute;
  inset:0;
  overflow:hidden;

  background:
    linear-gradient(
      #70dff5 0%,
      #21afd2 22%,
      #087fa8 55%,
      #034d6c 100%
    );
}

/* =========================
   SKY
========================= */

.sun{
  position:absolute;

  width:80px;
  height:80px;

  top:15px;
  right:7%;

  border-radius:50%;

  background:#fff4a8;

  box-shadow:
    0 0 30px #fff,
    0 0 70px #fff8;
}

.cloud{
  position:absolute;

  width:150px;
  height:38px;

  top:55px;
  left:7%;

  border-radius:40px;

  background:#ffffffaa;
}

.cloud:before,
.cloud:after{
  content:"";

  position:absolute;

  border-radius:50%;

  background:#ffffffaa;
}

.cloud:before{
  width:55px;
  height:55px;

  left:20px;
  top:-28px;
}

.cloud:after{
  width:65px;
  height:65px;

  left:72px;
  top:-36px;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;

  z-index:100;

  top:6px;
  left:50%;

  transform:translateX(-50%);

  width:min(900px,97%);

  padding:7px 10px;

  border-radius:20px;

  background:#ffffffef;

  color:#174257;

  text-align:center;

  box-shadow:
    0 8px 25px #00364d55;

  border:2px solid white;
}

.logo{
  font-size:clamp(20px,4vw,32px);
  font-weight:1000;
  color:#0876a8;
}

.question{
  margin-top:2px;

  font-size:clamp(15px,3vw,21px);

  font-weight:900;
}

#target{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  width:40px;
  height:40px;

  margin-left:5px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #b5eaf8 45%,
      #1689b7
    );

  color:#063e58;

  font-size:25px;

  border:2px solid white;

  box-shadow:
    0 3px 7px #00344d55;
}

.stats{
  display:flex;

  justify-content:center;

  gap:18px;

  margin-top:2px;

  font-size:12px;

  font-weight:900;
}

.timer{
  margin-top:2px;

  font-size:11px;

  font-weight:900;
}

.timeBackground{
  width:100%;
  height:7px;

  margin-top:3px;

  border-radius:10px;

  overflow:hidden;

  background:#c9e2e9;
}

#timeBar{
  width:100%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #24c96b,
      #f1c833,
      #ef583c
    );
}

/* =========================
   SEA
========================= */

#sea{
  position:absolute;

  inset:17% 0 0;

  overflow:hidden;
}

.wave{
  position:absolute;

  left:-20%;

  width:140%;
  height:75px;

  border-radius:50%;

  background:#ffffff12;
}

.wave1{
  top:8%;
}

.wave2{
  top:45%;
}

.wave3{
  top:72%;
}

.seabed{
  position:absolute;

  left:-5%;
  bottom:-5%;

  width:110%;
  height:18%;

  border-radius:50% 50% 0 0;

  background:
    radial-gradient(
      ellipse,
      #d9c58a,
      #80643e
    );
}

/* =========================
   PLANTS
========================= */

.plant{
  position:absolute;

  bottom:7%;

  font-size:55px;

  opacity:.75;
}

.plant1{
  left:8%;
}

.plant2{
  right:10%;
}

/* =========================
   FISH
========================= */

.fish{
  position:absolute;

  z-index:30;

  width:105px;
  height:68px;

  cursor:pointer;

  user-select:none;

  transition:
    left 4.5s linear,
    top 4.5s ease-in-out;

  filter:
    drop-shadow(
      0 8px 5px #00344f66
    );
}

.fish svg{
  width:100%;
  height:100%;
}

.fishNumber{
  position:absolute;

  left:54%;
  top:50%;

  transform:translate(-50%,-50%);

  width:30px;
  height:30px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #f1fbff 60%,
      #b9d5de
    );

  color:#123c53;

  font-size:20px;

  font-weight:1000;

  border:2px solid white;

  box-shadow:
    0 2px 5px #00364f66;

  /*
    يمنع الرقم من التفاعل مع اللمس
    ويبقيه ثابتًا داخل السمكة
  */
  pointer-events:none;
}

.fish.caught{
  animation:
    caught .55s forwards;
}

@keyframes caught{

  30%{
    transform:scale(1.2);
  }

  100%{
    transform:scale(0);
    opacity:0;
  }

}

.fish.wrong{
  animation:
    wrong .3s;
}

@keyframes wrong{

  25%{
    transform:translateX(-9px);
  }

  75%{
    transform:translateX(9px);
  }

}

/* =========================
   NET
========================= */

#net{
  position:absolute;

  z-index:80;

  display:none;

  width:42px;
  height:42px;

  pointer-events:none;

  transform:rotate(-15deg);

  filter:
    drop-shadow(
      0 5px 5px #002b4088
    );
}

.netCircle{
  position:absolute;

  inset:0;

  border-radius:50%;

  border:3px solid #e8eeee;

  background:
    radial-gradient(
      circle,
      transparent 45%,
      #ffffff18
    );

  box-shadow:
    inset 0 0 0 1px #66777d;
}

.netMesh{
  position:absolute;

  inset:6px;

  border-radius:50%;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 6px,
      #ffffff99 7px 8px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 6px,
      #ffffff99 7px 8px
    );

  clip-path:circle(50%);
}

.netHandle{
  position:absolute;

  width:55px;
  height:6px;

  top:31px;
  right:-44px;

  border-radius:8px;

  background:
    linear-gradient(
      #dba166,
      #75451f,
      #c88d53
    );

  transform:rotate(53deg);

  border:1px solid #543016;
}

/* =========================
   FEEDBACK
========================= */

#feedback{
  position:absolute;

  z-index:200;

  left:50%;
  top:55%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  opacity:0;

  pointer-events:none;

  width:min(390px,88%);

  padding:20px;

  border-radius:25px;

  background:
    linear-gradient(
      #ffffff,
      #e8faff
    );

  color:#116b8d;

  text-align:center;

  box-shadow:
    0 15px 45px #002d4d66;

  transition:.2s;
}

#feedback.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.feedbackIcon{
  font-size:48px;
}

.feedbackTitle{
  font-size:27px;
  font-weight:1000;
}

.feedbackText{
  margin-top:5px;

  font-size:15px;
  font-weight:700;
}

/* =========================
   START
========================= */

#startScreen{
  position:absolute;

  z-index:300;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#003b54aa;
}

.startBox{
  width:min(460px,94%);

  padding:25px 18px;

  border-radius:28px;

  background:
    linear-gradient(
      #ffffff,
      #e8faff
    );

  color:#163d52;

  text-align:center;

  box-shadow:
    0 20px 60px #002d4d88;

  border:2px solid white;
}

.startEmoji{
  font-size:55px;
}

.startBox h1{
  margin:4px 0 8px;

  font-size:34px;

  color:#0876a8;
}

.startBox p{
  line-height:1.5;

  font-size:16px;
}

.info{
  margin:15px 0;

  color:#607789;

  font-size:14px;
}

#startButton{
  padding:14px 27px;

  border-radius:16px;

  background:
    linear-gradient(
      #ff9e54,
      #e96131
    );

  color:white;

  font-size:19px;

  font-weight:1000;

  box-shadow:
    0 5px 0 #b94c1e;
}

#startButton:active{
  transform:translateY(3px);

  box-shadow:
    0 2px 0 #b94c1e;
}

#soundButton{
  position:absolute;

  z-index:350;

  right:9px;
  bottom:9px;

  padding:7px 10px;

  border-radius:13px;

  background:#ffffffdd;

  color:#17465b;

  font-size:11px;

  font-weight:900;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #hud{
    width:98%;

    top:3px;

    padding:5px 7px;

    border-radius:15px;
  }

  .logo{
    font-size:18px;
  }

  .question{
    font-size:14px;
  }

  #target{
    width:35px;
    height:35px;

    font-size:22px;
  }

  .stats{
    gap:8px;

    font-size:10px;
  }

  .timer{
    font-size:10px;
  }

  #sea{
    inset:19% 0 0;
  }

  .fish{
    width:82px;
    height:54px;
  }

  .fishNumber{
    width:27px;
    height:27px;

    font-size:18px;
  }

  #net{
    width:34px;
    height:34px;
  }

  .netCircle{
    border-width:3px;
  }

  .netMesh{
    inset:5px;
  }

  .netHandle{
    width:43px;
    height:5px;

    top:25px;
    right:-34px;
  }

  .startBox{
    padding:20px 14px;
  }

  .startEmoji{
    font-size:45px;
  }

  .startBox h1{
    font-size:28px;
  }

  .startBox p{
    font-size:14px;
  }

}

</style>
</head>


<body>

<div id="app">

  <main id="game">

    <div class="sun"></div>
    <div class="cloud"></div>


    <!-- ================= HUD ================= -->

    <div id="hud">

      <div class="logo">
        🎣 SAYI AVI
      </div>

      <div class="question">
        ŞU SAYIYI YAKALA:

        <span id="target">
          5
        </span>
      </div>

      <div class="stats">

        <span>
          ⭐ Puan:
          <b id="score">0</b>
        </span>

        <span>
          🏆 Tur:
          <b id="round">1</b>/10
        </span>

        <span>
          🔥 Seri:
          <b id="streak">0</b>
        </span>

      </div>

      <div class="timer">
        ⏱️ Kalan:
        <b id="timerText">60</b>
        saniye
      </div>

      <div class="timeBackground">
        <div id="timeBar"></div>
      </div>

    </div>


    <!-- ================= SEA ================= -->

    <div id="sea">

      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
      <div class="wave wave3"></div>

      <div class="seabed"></div>

      <div class="plant plant1">
        🌿
      </div>

      <div class="plant plant2">
        🪸
      </div>

    </div>


    <!-- ================= NET ================= -->

    <div id="net">

      <div class="netCircle"></div>
      <div class="netMesh"></div>
      <div class="netHandle"></div>

    </div>


    <!-- ================= FEEDBACK ================= -->

    <div id="feedback">

      <div
        id="feedbackIcon"
        class="feedbackIcon">
        🎉
      </div>

      <div
        id="feedbackTitle"
        class="feedbackTitle">
        AFERİN!
      </div>

      <div
        id="feedbackText"
        class="feedbackText">
      </div>

    </div>


    <!-- ================= SOUND ================= -->

    <button
      id="soundButton"
      type="button">
      🔊 SES AÇIK
    </button>


    <!-- ================= START ================= -->

    <div id="startScreen">

      <div class="startBox">

        <div class="startEmoji">
          🐟🎣🌊
        </div>

        <h1>
          Sayı Avı
        </h1>

        <p>
          <b>Doğru balığı yakala!</b>
          <br>
          Ekranda bulunan 5 balıktan,
          hedef sayıyı taşıyan balığı bul.
        </p>

        <div class="info">
          🎯 5 balık<br>
          ⏱️ Her tur 60 saniye<br>
          🏆 10 tur
        </div>

        <button
          id="startButton"
          type="button">
          Oyuna Başla 🚀
        </button>

      </div>

    </div>

  </main>

</div>


<script>

/* =====================================================
   GAME CONFIGURATION
===================================================== */

const GAME_CONFIG = {

  rounds:10,

  secondsPerRound:60,

  fishCount:5,

  minNumber:1,

  maxNumber:10

};


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const soundButton =
  document.getElementById("soundButton");

const sea =
  document.getElementById("sea");

const net =
  document.getElementById("net");

const targetElement =
  document.getElementById("target");

const scoreElement =
  document.getElementById("score");

const roundElement =
  document.getElementById("round");

const streakElement =
  document.getElementById("streak");

const timerText =
  document.getElementById("timerText");

const timeBar =
  document.getElementById("timeBar");

const feedback =
  document.getElementById("feedback");

const feedbackIcon =
  document.getElementById("feedbackIcon");

const feedbackTitle =
  document.getElementById("feedbackTitle");

const feedbackText =
  document.getElementById("feedbackText");


/* =====================================================
   GAME STATE
===================================================== */

let score = 0;

let round = 1;

let streak = 0;

let target = 1;

let timeLeft =
  GAME_CONFIG.secondsPerRound;

let timerId = null;

let playing = false;

let locked = false;

let soundEnabled = true;


/* =====================================================
   AUDIO
===================================================== */

const audioFiles = {

  click:
    new Audio("sounds/click.wav"),

  correct:
    new Audio("sounds/correct.wav"),

  wrong:
    new Audio("sounds/wrong.wav")

};


function playSound(name){

  if(!soundEnabled){
    return;
  }

  const audio =
    audioFiles[name];

  if(!audio){
    return;
  }

  try{

    audio.currentTime = 0;

    const result =
      audio.play();

    if(result){

      result.catch(
        function(){
          /*
            Audio file may not exist yet.
            This must NEVER stop the game.
          */
        }
      );

    }

  }catch(error){

    /*
      Audio errors are deliberately ignored.
      The game continues normally.
    */

  }

}


/* =====================================================
   SOUND BUTTON
===================================================== */

soundButton.addEventListener(
  "click",
  function(){

    soundEnabled =
      !soundEnabled;

    soundButton.textContent =
      soundEnabled
      ? "🔊 SES AÇIK"
      : "🔇 SES KAPALI";

  }
);


/* =====================================================
   RANDOM NUMBER
===================================================== */

function randomNumber(min,max){

  return Math.floor(
    Math.random() *
    (max-min+1)
  ) + min;

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );

    const temp =
      array[i];

    array[i] =
      array[j];

    array[j] =
      temp;

  }

  return array;

}


/* =====================================================
   FISH SVG
===================================================== */

const colors = [

  {
    body:"#e55b3d",
    dark:"#8d271c",
    light:"#ffad91"
  },

  {
    body:"#e6b72e",
    dark:"#896313",
    light:"#fff09c"
  },

  {
    body:"#45a8d7",
    dark:"#185d89",
    light:"#a9eaff"
  },

  {
    body:"#4d9e72",
    dark:"#1d5b43",
    light:"#92e5b9"
  },

  {
    body:"#b65b9b",
    dark:"#662c56",
    light:"#eda9d8"
  }

];


function createFishSVG(color){

  return `

  <svg
    viewBox="0 0 200 120"
    xmlns="http://www.w3.org/2000/svg">

    <defs>

      <radialGradient
        id="fishGradient"
        cx="30%"
        cy="25%">

        <stop
          offset="0"
          stop-color="${color.light}"/>

        <stop
          offset=".4"
          stop-color="${color.body}"/>

        <stop
          offset="1"
          stop-color="${color.dark}"/>

      </radialGradient>

    </defs>


    <!-- TAIL -->

    <path
      d="
        M50 60
        C28 38 12 27 5 25
        C12 47 12 73 5 95
        C27 91 44 78 55 65
        Z
      "
      fill="${color.body}"
      stroke="${color.dark}"
      stroke-width="3"
    />


    <!-- BODY -->

    <ellipse
      cx="108"
      cy="60"
      rx="76"
      ry="42"
      fill="url(#fishGradient)"
      stroke="${color.dark}"
      stroke-width="3"
    />


    <!-- TOP FIN -->

    <path
      d="
        M80 25
        C91 4 108 6 126 28
        C108 23 94 25 80 25
        Z
      "
      fill="${color.light}"
      stroke="${color.dark}"
      stroke-width="3"
    />


    <!-- BOTTOM FIN -->

    <path
      d="
        M92 94
        C100 111 115 110 126 91
        Z
      "
      fill="${color.light}"
      stroke="${color.dark}"
      stroke-width="3"
    />


    <!-- SCALES -->

    <g
      fill="none"
      stroke="#ffffff55"
      stroke-width="2">

      <path d="M65 44 Q75 54 65 64"/>
      <path d="M78 42 Q88 52 78 62"/>
      <path d="M91 40 Q101 50 91 60"/>
      <path d="M104 40 Q114 50 104 60"/>

      <path d="M72 60 Q82 70 72 80"/>
      <path d="M85 59 Q95 69 85 79"/>
      <path d="M98 59 Q108 69 98 79"/>
      <path d="M111 60 Q121 70 111 80"/>

    </g>


    <!-- EYE -->

    <circle
      cx="158"
      cy="47"
      r="13"
      fill="white"
      stroke="${color.dark}"
      stroke-width="3"
    />

    <circle
      cx="161"
      cy="48"
      r="7"
      fill="#101820"
    />

    <circle
      cx="164"
      cy="45"
      r="2.5"
      fill="white"
    />


    <!-- MOUTH -->

    <path
      d="
        M178 61
        Q189 67 179 73
      "
      fill="none"
      stroke="${color.dark}"
      stroke-width="3"
      stroke-linecap="round"
    />


    <!-- HIGHLIGHT -->

    <ellipse
      cx="83"
      cy="38"
      rx="20"
      ry="7"
      fill="#ffffff44"
      transform="rotate(-12 83 38)"
    />

  </svg>

  `;

}


/* =====================================================
   CLEAR FISH
===================================================== */

function clearFish(){

  const fishList =
    sea.querySelectorAll(".fish");

  fishList.forEach(
    function(fish){

      fish.remove();

    }
  );

}


/* =====================================================
   CREATE EXACTLY 5 FISH
===================================================== */

function createFish(){

  clearFish();


  /*
    The target is ALWAYS included.
  */

  const numbers = [target];


  /*
    Add four DIFFERENT numbers.
    No duplicate numbers.
  */

  while(
    numbers.length <
    GAME_CONFIG.fishCount
  ){

    const number =
      randomNumber(
        GAME_CONFIG.minNumber,
        GAME_CONFIG.maxNumber
      );


    if(
      numbers.indexOf(number) === -1
    ){

      numbers.push(number);

    }

  }


  /*
    Shuffle the five numbers.
  */

  shuffle(numbers);


  /*
    Create the five fish.
  */

  for(
    let i=0;
    i<numbers.length;
    i++
  ){

    const number =
      numbers[i];


    const fish =
      document.createElement("div");

    fish.className =
      "fish";


    const color =
      colors[
        i % colors.length
      ];


    fish.innerHTML =
      createFishSVG(color)
      +
      `
      <div class="fishNumber">
        ${number}
      </div>
      `;


    /*
      Store the number directly
      on the fish.
    */

    fish.dataset.number =
      String(number);


    /*
      Random starting position.
    */

    fish.style.left =
      randomNumber(5,82) + "%";

    fish.style.top =
      randomNumber(8,82) + "%";


    /*
      Clicking anywhere on the fish
      catches it.
    */

    fish.addEventListener(
      "pointerdown",
      function(event){

        event.preventDefault();

        catchFish(fish);

      }
    );


    sea.appendChild(fish);


    /*
      Start movement.
    */

    moveFish(fish);

  }

}


/* =====================================================
   MOVE FISH
===================================================== */

function moveFish(fish){

  if(
    !playing ||
    !fish.parentNode
  ){

    return;

  }


  fish.style.left =
    randomNumber(5,84) + "%";

  fish.style.top =
    randomNumber(8,82) + "%";


  setTimeout(
    function(){

      moveFish(fish);

    },
    randomNumber(4500,7000)
  );

}


/* =====================================================
   START ROUND
===================================================== */

function startRound(){

  locked = false;


  feedback.classList.remove(
    "show"
  );


  net.style.display =
    "none";


  /*
    Select target.
  */

  target =
    randomNumber(
      GAME_CONFIG.minNumber,
      GAME_CONFIG.maxNumber
    );


  targetElement.textContent =
    target;


  /*
    IMPORTANT:
    exactly five fish.
  */

  createFish();


  startTimer();

}


/* =====================================================
   START TIMER
===================================================== */

function startTimer(){

  clearInterval(timerId);


  timeLeft =
    GAME_CONFIG.secondsPerRound;


  timerText.textContent =
    "60";


  timeBar.style.width =
    "100%";


  timerId =
    setInterval(
      function(){

        timeLeft -= 0.1;


        if(timeLeft < 0){
          timeLeft = 0;
        }


        timerText.textContent =
          String(
            Math.ceil(timeLeft)
          );


        timeBar.style.width =
          (
            timeLeft /
            GAME_CONFIG.secondsPerRound *
            100
          )
          +
          "%";


        if(timeLeft <= 0){

          clearInterval(
            timerId
          );

          timeExpired();

        }

      },
      100
    );

}


/* =====================================================
   TIME EXPIRED
===================================================== */

function timeExpired(){

  if(
    locked ||
    !playing
  ){

    return;

  }


  locked = true;

  streak = 0;

  streakElement.textContent =
    "0";


  playSound("wrong");


  showFeedback(
    "⏰",
    "Süre Doldu!",
    "Tekrar deneyebilirsin."
  );


  setTimeout(
    function(){

      nextRound();

    },
    1500
  );

}


/* =====================================================
   CATCH FISH
===================================================== */

function catchFish(fish){

  if(
    !playing ||
    locked
  ){

    return;

  }


  playSound("click");


  /*
    Position the small net
    over the selected fish.
  */

  const rect =
    fish.getBoundingClientRect();


  net.style.display =
    "block";


  net.style.left =
    (
      rect.left +
      rect.width / 2 -
      net.offsetWidth / 2
    )
    +
    "px";


  net.style.top =
    (
      rect.top +
      rect.height / 2 -
      net.offsetHeight / 2
    )
    +
    "px";


  const value =
    Number(
      fish.dataset.number
    );


  /* =========================
     CORRECT
  ========================= */

  if(value === target){

    locked = true;

    clearInterval(
      timerId
    );


    const points =
      10 +
      streak * 2;


    score += points;

    streak += 1;


    scoreElement.textContent =
      score;

    streakElement.textContent =
      streak;


    fish.classList.add(
      "caught"
    );


    playSound("correct");


    showFeedback(
      "🎉",
      "AFERİN!",
      "Doğru sayıyı yakaladın! +"
      +
      points
      +
      " puan"
    );


    setTimeout(
      function(){

        nextRound();

      },
      1400
    );


    return;

  }


  /* =========================
     WRONG
  ========================= */

  fish.classList.add(
    "wrong"
  );


  streak = 0;

  streakElement.textContent =
    "0";


  playSound("wrong");


  showFeedback(
    "🐟",
    "Tekrar Dene!",
    "Bu balıkta "
    +
    value
    +
    " yazıyor."
  );


  setTimeout(
    function(){

      fish.classList.remove(
        "wrong"
      );

      feedback.classList.remove(
        "show"
      );

    },
    900
  );

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
  icon,
  title,
  text
){

  feedbackIcon.textContent =
    icon;

  feedbackTitle.textContent =
    title;

  feedbackText.textContent =
    text;

  feedback.classList.add(
    "show"
  );

}


/* =====================================================
   NEXT ROUND
===================================================== */

function nextRound(){

  feedback.classList.remove(
    "show"
  );

  net.style.display =
    "none";


  if(
    round >=
    GAME_CONFIG.rounds
  ){

    finishGame();

    return;

  }


  round += 1;


  roundElement.textContent =
    round;


  startRound();

}


/* =====================================================
   FINISH GAME
===================================================== */

function finishGame(){

  playing = false;

  clearInterval(
    timerId
  );

  clearFish();

  showFeedback(
    "🏆",
    "HARİKA!",
    "Oyunu "
    +
    score
    +
    " puanla tamamladın!"
  );


  setTimeout(
    function(){

      feedback.classList.remove(
        "show"
      );


      startScreen.style.display =
        "flex";

    },
    2500
  );

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  /*
    This is intentionally simple.
    No async code.
    No speech.
    No external dependency.
  */

  score = 0;

  round = 1;

  streak = 0;

  playing = true;

  locked = false;


  scoreElement.textContent =
    "0";

  roundElement.textContent =
    "1";

  streakElement.textContent =
    "0";


  startScreen.style.display =
    "none";


  playSound("click");


  startRound();

}


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(
  "click",
  function(event){

    event.preventDefault();

    startGame();

  }
);


/* =====================================================
   NET FOLLOWS POINTER
===================================================== */

document.addEventListener(
  "pointermove",
  function(event){

    if(!playing){
      return;
    }


    net.style.display =
      "block";


    net.style.left =
      (
        event.clientX -
        net.offsetWidth / 2
      )
      +
      "px";


    net.style.top =
      (
        event.clientY -
        net.offsetHeight / 2
      )
      +
      "px";

  }
);


/* =====================================================
   INITIAL STATE
===================================================== */

startScreen.style.display =
  "flex";

</script>

</body>
</html>
