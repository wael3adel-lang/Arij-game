<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Çocuk Oyunları - Sayı Avı</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#045579;
  color:white;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

/* =====================================================
   APP
===================================================== */

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:block;
}


/* =====================================================
   MENU
===================================================== */

#menuScreen{
  overflow:auto;

  background:
    radial-gradient(
      circle at 50% 15%,
      #75e4fa,
      #169bc5 45%,
      #034e70 100%
    );
}

.menuBox{
  width:min(900px,94%);
  margin:35px auto;
  padding:30px 22px;

  background:
    linear-gradient(
      180deg,
      #fffffffa,
      #e9fafffa
    );

  color:#143b52;

  border-radius:30px;

  box-shadow:
    0 20px 60px #002f4d66;

  text-align:center;
}

.menuLogo{
  font-size:clamp(32px,6vw,52px);
  font-weight:1000;
  color:#0876a8;
}

.menuSubtitle{
  margin:8px 0 28px;
  font-size:19px;
  color:#557082;
}

.gamesGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.gameCard{
  background:
    linear-gradient(
      180deg,
      #ffffff,
      #eafaff
    );

  border:3px solid #bdeafa;
  border-radius:22px;

  padding:22px 15px;

  box-shadow:
    0 7px 18px #00608018;

  transition:.2s;
}

.gameCard:hover{
  transform:translateY(-4px);
  border-color:#38b9df;
}

.gameIcon{
  font-size:58px;
}

.gameTitle{
  margin-top:6px;
  font-size:25px;
  font-weight:1000;
  color:#0876a8;
}

.gameDescription{
  margin-top:7px;
  min-height:45px;
  color:#597486;
  line-height:1.45;
}

.playButton{
  margin-top:14px;

  padding:13px 25px;

  border-radius:16px;

  background:
    linear-gradient(
      #ff9e53,
      #ed6330
    );

  color:white;

  font-size:18px;
  font-weight:1000;

  box-shadow:
    0 5px 0 #b94b1b;
}

.playButton:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #b94b1b;
}


/* =====================================================
   GAME
===================================================== */

#gameScreen{
  background:
    linear-gradient(
      #69ddf5 0%,
      #159fca 15%,
      #087da6 45%,
      #034f70 100%
    );
}


/* =====================================================
   SKY
===================================================== */

.sky{
  position:absolute;
  inset:0 0 85%;
}

.sun{
  position:absolute;
  width:85px;
  height:85px;

  right:7%;
  top:15px;

  border-radius:50%;

  background:#fff4a5;

  box-shadow:
    0 0 30px white,
    0 0 70px #fff9;
}

.cloud{
  position:absolute;

  left:7%;
  top:50px;

  width:145px;
  height:36px;

  border-radius:30px;

  background:#ffffffaa;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:#ffffffaa;
}

.cloud:before{
  width:55px;
  height:55px;
  left:20px;
  top:-27px;
}

.cloud:after{
  width:65px;
  height:65px;
  left:68px;
  top:-35px;
}


/* =====================================================
   HUD
===================================================== */

.hud{
  position:absolute;
  z-index:100;

  top:8px;
  left:50%;

  transform:translateX(-50%);

  width:min(920px,96%);

  padding:8px 13px;

  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      #fffffffa,
      #e5f9fffa
    );

  color:#123c53;

  border:2px solid white;

  box-shadow:
    0 8px 25px #003b5b44;

  text-align:center;
}

.logo{
  font-size:clamp(21px,4vw,34px);
  font-weight:1000;
  color:#0876a8;
}

.mission{
  margin-top:2px;
  font-size:clamp(16px,3vw,22px);
  font-weight:1000;
}

.mission b{
  display:inline-flex;

  width:44px;
  height:44px;

  align-items:center;
  justify-content:center;

  margin-left:6px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #a9e6fa 45%,
      #1889ba
    );

  color:#083e5b;

  font-size:29px;

  border:3px solid white;

  box-shadow:
    0 3px 8px #00354d55;
}

.stats{
  display:flex;
  justify-content:center;
  gap:20px;

  margin-top:3px;

  font-size:13px;
  font-weight:900;
}

.timerLine{
  margin-top:4px;

  font-size:12px;
  font-weight:900;
}

.timebar{
  height:7px;

  margin-top:3px;

  background:#c8e5ee;

  border-radius:10px;

  overflow:hidden;
}

#timebar{
  display:block;

  width:100%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #27d27b,
      #f5ca37,
      #ff7045
    );
}


/* =====================================================
   SEA
===================================================== */

#sea{
  position:absolute;
  inset:15% 0 0;

  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 8%,
      #b6f4ff44,
      transparent 38%
    ),
    linear-gradient(
      #13a9d944,
      #00577d88
    );
}

.wave{
  position:absolute;

  left:-15%;

  width:130%;
  height:70px;

  border-radius:50%;

  background:#ffffff12;

  animation:
    waveMove 6s ease-in-out infinite alternate;
}

.wave:nth-child(1){
  top:4%;
}

.wave:nth-child(2){
  top:35%;
  opacity:.5;
  animation-duration:8s;
}

.wave:nth-child(3){
  top:65%;
  opacity:.3;
  animation-duration:10s;
}

@keyframes waveMove{
  to{
    transform:translateX(40px);
  }
}

.bubble{
  position:absolute;

  border:2px solid #ffffff77;

  border-radius:50%;

  opacity:.55;

  animation:
    bubbleMove 9s linear infinite;
}

@keyframes bubbleMove{
  to{
    transform:translateY(-110vh);
    opacity:0;
  }
}

.seabed{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:17%;

  background:
    radial-gradient(
      ellipse at center,
      #d5bd82,
      #94794d
    );

  border-radius:
    50% 50% 0 0 /
    20% 20% 0 0;
}

.plant{
  position:absolute;
  bottom:7%;

  color:#35aa68;

  font-size:65px;

  opacity:.75;

  filter:
    drop-shadow(
      0 7px 4px #00364d77
    );
}

.plant1{
  left:12%;
}

.plant2{
  right:16%;
}

.plant3{
  right:3%;
}


/* =====================================================
   REALISTIC FISH
===================================================== */

.fish{
  position:absolute;

  width:120px;
  height:78px;

  z-index:30;

  cursor:pointer;

  touch-action:manipulation;
  user-select:none;

  transition:
    left 4s linear,
    top 4s ease-in-out;

  filter:
    drop-shadow(
      0 9px 6px #00364f66
    );
}

.fish svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.fishNumber{
  position:absolute;

  left:53%;
  top:52%;

  transform:translate(-50%,-50%);

  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #ffffff,
      #eefaff 60%,
      #b9d5df
    );

  color:#123d55;

  font-size:22px;
  font-weight:1000;

  border:2px solid white;

  box-shadow:
    0 3px 6px #001e2d66;
}

.fish.caught{
  animation:
    fishCaught .6s forwards;
}

@keyframes fishCaught{
  35%{
    transform:scale(1.25) rotate(-8deg);
  }

  100%{
    transform:scale(0);
    opacity:0;
  }
}

.fish.wrong{
  animation:
    fishWrong .35s;
}

@keyframes fishWrong{
  25%{
    margin-left:-13px;
  }

  75%{
    margin-left:13px;
  }
}


/* =====================================================
   FISHING NET - SMALL
===================================================== */

#net{
  position:absolute;

  z-index:80;

  width:48px;
  height:48px;

  display:none;

  pointer-events:none;

  transform:rotate(-18deg);

  filter:
    drop-shadow(
      0 6px 5px #001e3388
    );
}

.netRim{
  position:absolute;
  inset:0;

  border:4px solid #e4edf0;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      transparent 50%,
      #ffffff22
    );

  box-shadow:
    inset 0 0 0 2px #61757c,
    0 3px 6px #001c2a88;
}

.netMesh{
  position:absolute;

  inset:7px;

  border-radius:50%;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 7px,
      #ffffff99 8px 9px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 7px,
      #ffffff99 8px 9px
    );

  clip-path:circle(50%);
}

.netHandle{
  position:absolute;

  width:65px;
  height:8px;

  right:-52px;
  top:37px;

  border-radius:10px;

  background:
    linear-gradient(
      #d69a5a,
      #6e3e1c 50%,
      #c98b51
    );

  border:1px solid #542d16;

  transform:rotate(53deg);
}


/* =====================================================
   FEEDBACK
===================================================== */

#feedback{
  position:absolute;

  z-index:150;

  left:50%;
  top:53%;

  width:min(400px,88%);

  transform:
    translate(-50%,-50%)
    scale(.8);

  opacity:0;

  pointer-events:none;

  padding:20px;

  border-radius:25px;

  background:
    linear-gradient(
      #ffffff,
      #e8faff
    );

  color:#126c91;

  text-align:center;

  border:2px solid white;

  box-shadow:
    0 15px 45px #00294d66;

  transition:.2s;
}

#feedback.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.feedbackIcon{
  font-size:52px;
}

.feedbackTitle{
  font-size:28px;
  font-weight:1000;
}

.feedbackText{
  margin-top:5px;

  font-size:16px;
  font-weight:700;
}


/* =====================================================
   SOUND
===================================================== */

#soundBtn{
  position:absolute;

  right:10px;
  bottom:10px;

  z-index:110;

  padding:8px 11px;

  border-radius:14px;

  background:#ffffffdd;

  color:#16455b;

  font-size:12px;
  font-weight:1000;

  box-shadow:
    0 4px 12px #00344d44;
}


/* =====================================================
   START SCREEN
===================================================== */

#startOverlay{
  position:absolute;

  z-index:120;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.startBox{
  width:min(470px,92%);

  padding:28px 20px;

  border-radius:30px;

  background:
    linear-gradient(
      #fffffff7,
      #e7fafff5
    );

  color:#143b52;

  text-align:center;

  border:2px solid white;

  box-shadow:
    0 20px 60px #001e3d77;
}

.startEmoji{
  font-size:65px;
}

.startBox h1{
  margin:4px 0 8px;

  font-size:38px;

  color:#0876a8;
}

.startBox p{
  font-size:17px;
  line-height:1.5;
}

.startInfo{
  margin:12px 0 18px;

  font-size:14px;

  color:#587184;
}

.startBtn{
  padding:14px 25px;

  border-radius:17px;

  background:
    linear-gradient(
      #ff9d52,
      #ed6331
    );

  color:white;

  font-size:19px;
  font-weight:1000;

  box-shadow:
    0 5px 0 #bc4c1d;
}

.testSound{
  margin-left:7px;

  padding:14px 17px;

  border-radius:17px;

  background:
    linear-gradient(
      #45b9eb,
      #0877ac
    );

  color:white;

  font-weight:1000;

  box-shadow:
    0 5px 0 #07587f;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .hud{
    top:4px;
    width:98%;
    padding:5px 7px;
    border-radius:16px;
  }

  .logo{
    font-size:18px;
  }

  .mission{
    font-size:14px;
  }

  .mission b{
    width:38px;
    height:38px;
    font-size:25px;
  }

  .stats{
    gap:8px;
    font-size:10px;
  }

  .timerLine{
    font-size:10px;
  }

  #sea{
    inset:17% 0 0;
  }

  .fish{
    width:88px;
    height:58px;
  }

  .fishNumber{
    width:29px;
    height:29px;
    font-size:19px;
  }

  /*
    VERY SMALL NET ON MOBILE
  */

  #net{
    width:38px;
    height:38px;
  }

  .netRim{
    border-width:3px;
  }

  .netMesh{
    inset:5px;
  }

  .netHandle{
    width:48px;
    height:6px;
    right:-38px;
    top:30px;
  }

  #soundBtn{
    font-size:10px;
    padding:6px 8px;
  }

  .startBox{
    padding:22px 14px;
  }

  .startEmoji{
    font-size:50px;
  }

  .startBox h1{
    font-size:30px;
  }

  .startBox p{
    font-size:15px;
  }

  .testSound{
    margin-left:3px;
    padding:12px 10px;
    font-size:13px;
  }

}

@media(max-width:370px){

  .stats{
    gap:5px;
    font-size:9px;
  }

  .logo{
    font-size:16px;
  }

  .fish{
    width:78px;
    height:53px;
  }

  .fishNumber{
    width:27px;
    height:27px;
    font-size:18px;
  }

}
</style>
</head>


<body>

<div id="app">


<!-- =====================================================
     GAME MENU
===================================================== -->

<section id="menuScreen" class="screen">

  <div class="menuBox">

    <div class="menuLogo">
      🎮 ÇOCUK OYUNLARI
    </div>

    <div class="menuSubtitle">
      Eğlenerek öğren!
    </div>

    <div id="gamesGrid" class="gamesGrid"></div>

  </div>

</section>


<!-- =====================================================
     SAYI AVI
===================================================== -->

<section id="gameScreen" class="screen active">

  <div class="sky">
    <div class="sun"></div>
    <div class="cloud"></div>
  </div>


  <!-- HUD -->

  <div class="hud">

    <div class="logo">
      🎣 SAYI AVI
    </div>

    <div class="mission">
      ŞU SAYIYI YAKALA:
      <b id="target">5</b>
    </div>

    <div class="stats">

      <span>
        ⭐ Puan:
        <strong id="score">0</strong>
      </span>

      <span>
        🏆 Tur:
        <strong id="round">1</strong>/10
      </span>

      <span>
        🔥 Seri:
        <strong id="streak">0</strong>
      </span>

    </div>

    <div class="timerLine">
      ⏱️ Kalan süre:
      <strong id="timerText">60</strong>
      saniye
    </div>

    <div class="timebar">
      <i id="timebar"></i>
    </div>

  </div>


  <!-- SEA -->

  <div id="sea">

    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>

    <div class="seabed"></div>

    <div class="plant plant1">🌿</div>
    <div class="plant plant2">🌿</div>
    <div class="plant plant3">🪸</div>

  </div>


  <!-- SMALL NET -->

  <div id="net">

    <div class="netRim"></div>
    <div class="netMesh"></div>
    <div class="netHandle"></div>

  </div>


  <!-- FEEDBACK -->

  <div id="feedback">

    <div
      id="feedbackIcon"
      class="feedbackIcon">
      🎉
    </div>

    <div
      id="feedbackTitle"
      class="feedbackTitle">
      AFERİN!
    </div>

    <div
      id="feedbackText"
      class="feedbackText">
    </div>

  </div>


  <!-- SOUND BUTTON -->

  <button id="soundBtn">
    🔊 SES AÇIK
  </button>


  <!-- START -->

  <div id="startOverlay">

    <div class="startBox">

      <div class="startEmoji">
        🌊🐟🎣
      </div>

      <h1>
        Sayı Avı
      </h1>

      <p>
        <b>Doğru balığı yakala!</b>
        <br>
        Hedef sayıyı bul ve ağınla yakala.
      </p>

      <div class="startInfo">
        10 tur<br>
        Her tur için 60 saniye<br>
        Doğru ve yanlış sesleri
      </div>

      <button
        id="startBtn"
        class="startBtn">
        Oyuna Başla 🚀
      </button>

      <button
        id="testSoundBtn"
        class="testSound">
        🔊 Sesi Test Et
      </button>

    </div>

  </div>

</section>

</div>


<script>

/* =====================================================
   GAME SYSTEM
   -----------------------------------------------------
   This registry allows us to add many games later.
===================================================== */

const GAME_REGISTRY = [];


function registerGame(game){
  GAME_REGISTRY.push(game);
}


/* =====================================================
   REGISTER CURRENT GAME
===================================================== */

registerGame({

  id:"sayi-avi",

  title:"Sayı Avı",

  icon:"🐟🎣",

  description:
    "Doğru sayıyı taşıyan balığı bul ve yakala.",

  enabled:true

});


/*
  FUTURE GAME EXAMPLE:

  registerGame({
    id:"renk-avi",
    title:"Renk Avı",
    icon:"🎨",
    description:"Doğru rengi bul.",
    enabled:true
  });

*/


/* =====================================================
   ELEMENTS
===================================================== */

const gameScreen =
  document.getElementById("gameScreen");

const startOverlay =
  document.getElementById("startOverlay");

const startBtn =
  document.getElementById("startBtn");

const testSoundBtn =
  document.getElementById("testSoundBtn");

const soundBtn =
  document.getElementById("soundBtn");

const sea =
  document.getElementById("sea");

const net =
  document.getElementById("net");

const targetEl =
  document.getElementById("target");

const scoreEl =
  document.getElementById("score");

const roundEl =
  document.getElementById("round");

const streakEl =
  document.getElementById("streak");

const timerText =
  document.getElementById("timerText");

const timebar =
  document.getElementById("timebar");

const feedback =
  document.getElementById("feedback");

const feedbackIcon =
  document.getElementById("feedbackIcon");

const feedbackTitle =
  document.getElementById("feedbackTitle");

const feedbackText =
  document.getElementById("feedbackText");


/* =====================================================
   GAME VARIABLES
===================================================== */

let score = 0;

let round = 1;

let streak = 0;

let target = 1;

let playing = false;

let locked = false;

let timer = null;

let timeLeft = 60;

const ROUND_SECONDS = 60;


/* =====================================================
   AUDIO
   ONLY THREE SOUNDS
===================================================== */

let soundOn = true;

const sounds = {

  click:
    new Audio("sounds/click.wav"),

  correct:
    new Audio("sounds/correct.wav"),

  wrong:
    new Audio("sounds/wrong.wav")

};


Object.keys(sounds).forEach(
  function(name){

    sounds[name].preload = "auto";

    sounds[name].volume = .85;

  }
);


function playSound(name){

  if(!soundOn) return;

  const audio =
    sounds[name];

  if(!audio) return;

  try{

    audio.currentTime = 0;

    const promise =
      audio.play();

    if(
      promise &&
      promise.catch
    ){

      promise.catch(
        function(){}
      );

    }

  }catch(e){}

}


/* =====================================================
   SOUND TEST
===================================================== */

testSoundBtn.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    soundOn = true;

    soundBtn.textContent =
      "🔊 SES AÇIK";

    playSound("click");

    setTimeout(
      function(){

        playSound("correct");

      },
      250
    );

  }
);


/* =====================================================
   SOUND TOGGLE
===================================================== */

soundBtn.addEventListener(
  "click",
  function(){

    soundOn = !soundOn;

    soundBtn.textContent =
      soundOn
      ? "🔊 SES AÇIK"
      : "🔇 SES KAPALI";

  }
);


/* =====================================================
   RANDOM
===================================================== */

function randomNumber(min,max){

  return Math.floor(
    Math.random() *
    (max-min+1)
  ) + min;

}


/* =====================================================
   FISH SVG
===================================================== */

const FISH_COLORS = [

  ["#e85c3b","#8d251d","#ffab8b"],

  ["#e6b72f","#8b6512","#fff09b"],

  ["#4ba7d8","#175c89","#a5eaff"],

  ["#4a9c71","#175b43","#8ee2b3"],

  ["#b95b9e","#692b59","#efa9db"],

  ["#e67b32","#873b17","#ffc17c"]

];


function fishSVG(colors){

  return `

  <svg
    viewBox="0 0 200 120"
    xmlns="http://www.w3.org/2000/svg">

    <defs>

      <radialGradient
        id="fishGradient"
        cx="30%"
        cy="25%">

        <stop
          offset="0"

/* =====================================================
   CLEAR FISH
===================================================== */

function clearFish(){

  sea
    .querySelectorAll(".fish")
    .forEach(
      function(fish){

        fish.remove();

      }
    );

}


/* =====================================================
   CREATE BUBBLES
===================================================== */

function createBubbles(){

  for(
    let i=0;
    i<20;
    i++
  ){

    const bubble =
      document.createElement("i");

    bubble.className =
      "bubble";

    const size =
      randomNumber(7,21);

    bubble.style.width =
      size+"px";

    bubble.style.height =
      size+"px";

    bubble.style.left =
      randomNumber(1,98)+"%";

    bubble.style.top =
      randomNumber(40,100)+"%";

    bubble.style.animationDelay =
      "-"+randomNumber(1,9)+"s";

    sea.appendChild(
      bubble
    );

  }

}


/* =====================================================
   CREATE FISH
===================================================== */

function createFish(){

  clearFish();

  /*
    إنشاء 5 أرقام فقط:
    الرقم المطلوب + 4 أرقام عشوائية مختلفة
  */

  const numbers = [target];

  while(numbers.length < 5){

    const n = randomNumber(1,10);

    if(!numbers.includes(n)){
      numbers.push(n);
    }

  }


  /*
    خلط أماكن الأرقام
  */

  numbers.sort(
    function(){
      return Math.random() - 0.5;
    }
  );


  /*
    إنشاء 5 سمكات
  */

  numbers.forEach(
    function(number,index){

      const fish =
        document.createElement("div");

      fish.className = "fish";


      /*
        ألوان مختلفة للسمكات
      */

      const colors =
        FISH_COLORS[
          index % FISH_COLORS.length
        ];


      /*
        السمكة + الرقم
        الرقم داخل جسم السمكة وليس فوقها
      */

      fish.innerHTML =
        fishSVG(colors)
        +
        `
        <div class="fishNumber">
          ${number}
        </div>
        `;


      fish.dataset.number =
        number;


      /*
        توزيع السمكات في البحر
      */

      fish.style.left =
        randomNumber(4,84) + "%";

      fish.style.top =
        randomNumber(12,82) + "%";


      /*
        لمس / ضغط السمكة
      */

      fish.addEventListener(
        "pointerdown",
        function(e){

          e.preventDefault();

          catchFish(fish);

        }
      );


      sea.appendChild(
        fish
      );


      /*
        حركة السمكة
      */

      moveFish(fish);

    }
  );

}
  clearFish();

  const numbers = [];

  /*
    Every number from 1 to 10
    is guaranteed to exist.
  */

  for(
    let i=1;
    i<=10;
    i++
  ){

    numbers.push(i);

  }


  /*
    Add four extra fish.
  */

  for(
    let i=0;
    i<4;
    i++
  ){

    numbers.push(
      randomNumber(1,10)
    );

  }


  /*
    Shuffle.
  */

  numbers.sort(
    function(){
      return Math.random()-.5;
    }
  );


  numbers.forEach(
    function(number,index){

      const fish =
        document.createElement("div");

      fish.className =
        "fish";


      const colors =
        FISH_COLORS[
          index %
          FISH_COLORS.length
        ];


      fish.innerHTML =
        fishSVG(colors)
        +
        `
        <div class="fishNumber">
          ${number}
        </div>
        `;


      fish.dataset.number =
        number;


      fish.style.left =
        randomNumber(3,85)+"%";

      fish.style.top =
        randomNumber(8,82)+"%";


      fish.addEventListener(
        "pointerdown",
        function(e){

          e.preventDefault();

          catchFish(fish);

        }
      );


      sea.appendChild(
        fish
      );


      moveFish(fish);

    }
  );

}


/* =====================================================
   MOVE FISH
===================================================== */

function moveFish(fish){

  if(
    !playing ||
    !fish.parentNode
  ){

    return;

  }


  const duration =
    randomNumber(4500,7500);


  fish.style.left =
    randomNumber(3,86)+"%";

  fish.style.top =
    randomNumber(8,84)+"%";


  setTimeout(
    function(){

      moveFish(fish);

    },
    duration
  );

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  /*
    THIS FUNCTION IS DIRECTLY CONNECTED
    TO THE START BUTTON.
  */

  startOverlay.style.display =
    "none";


  score = 0;
  round = 1;
  streak = 0;

  playing = true;
  locked = false;


  scoreEl.textContent =
    "0";

  roundEl.textContent =
    "1";

  streakEl.textContent =
    "0";


  playSound("click");


  startRound();

}


/* =====================================================
   START ROUND
===================================================== */

function startRound(){

  locked = false;

  feedback.classList.remove(
    "show"
  );

  net.style.display =
    "none";


  target =
    randomNumber(1,10);


  targetEl.textContent =
    target;


  createFish();

  startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

  clearInterval(timer);

  timeLeft =
    ROUND_SECONDS;


  timerText.textContent =
    "60";

  timebar.style.width =
    "100%";


  timer =
    setInterval(
      function(){

        timeLeft -= .1;


        const percent =
          Math.max(
            0,
            timeLeft /
            ROUND_SECONDS *
            100
          );


        timebar.style.width =
          percent+"%";


        timerText.textContent =
          Math.ceil(
            Math.max(
              0,
              timeLeft
            )
          );


        if(timeLeft <= 0){

          clearInterval(timer);

          if(!locked){

            timeExpired();

          }

        }

      },
      100
    );

}


/* =====================================================
   TIME EXPIRED
===================================================== */

function timeExpired(){

  locked = true;

  streak = 0;

  streakEl.textContent =
    "0";


  playSound("wrong");


  showFeedback(
    "⏰",
    "Süre Doldu!",
    "Tekrar deneyebilirsin."
  );


  setTimeout(
    function(){

      nextRound();

    },
    1600
  );

}


/* =====================================================
   CATCH FISH
===================================================== */

function catchFish(fish){

  if(
    !playing ||
    locked
  ){

    return;

  }


  /*
    Click sound.
  */

  playSound("click");


  /*
    Put small net over fish.
  */

  const rect =
    fish.getBoundingClientRect();


  const netWidth =
    net.offsetWidth;

  const netHeight =
    net.offsetHeight;


  net.style.display =
    "block";


  net.style.left =
    (
      rect.left +
      rect.width/2 -
      netWidth/2
    )+"px";


  net.style.top =
    (
      rect.top +
      rect.height/2 -
      netHeight/2
    )+"px";


  const value =
    Number(
      fish.dataset.number
    );


  /* ===================================================
     CORRECT
  =================================================== */

  if(value === target){

    locked = true;

    clearInterval(timer);


    const gained =
      10 +
      streak * 2;


    score += gained;

    streak++;


    scoreEl.textContent =
      score;

    streakEl.textContent =
      streak;


    fish.classList.add(
      "caught"
    );


    playSound("correct");


    showFeedback(
      "🎉",
      "AFERİN!",
      "Doğru sayıyı yakaladın! +"+
      gained+
      " puan"
    );


    setTimeout(
      function(){

        nextRound();

      },
      1500
    );


    return;

  }


  /* ===================================================
     WRONG
  =================================================== */

  fish.classList.add(
    "wrong"
  );


  streak = 0;

  streakEl.textContent =
    "0";


  playSound("wrong");


  showFeedback(
    "🐟",
    "Tekrar Dene!",
    "Bu balıkta "+
    value+
    " yazıyor."
  );


  setTimeout(
    function(){

      fish.classList.remove(
        "wrong"
      );

      feedback.classList.remove(
        "show"
      );

    },
    1000
  );

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(
  icon,
  title,
  text
){

  feedbackIcon.textContent =
    icon;

  feedbackTitle.textContent =
    title;

  feedbackText.textContent =
    text;

  feedback.classList.add(
    "show"
  );

}


/* =====================================================
   NEXT ROUND
===================================================== */

function nextRound(){

  feedback.classList.remove(
    "show"
  );

  clearInterval(timer);

  net.style.display =
    "none";


  if(round >= 10){

    finishGame();

    return;

  }


  round++;

  roundEl.textContent =
    round;


  startRound();

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(){

  playing = false;

  clearInterval(timer);

  clearFish();


  showFeedback(
    "🏆",
    "HARİKA!",
    "Oyunu "+
    score+
    " puanla tamamladın!"
  );


  setTimeout(
    function(){

      feedback.classList.remove(
        "show"
      );

      startOverlay.style.display =
        "flex";

    },
    2500
  );

}


/* =====================================================
   START BUTTON
===================================================== */

startBtn.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    startGame();

  }
);


/* =====================================================
   INITIALIZATION
===================================================== */

createBubbles();


/* =====================================================
   MOUSE NET
===================================================== */

document.addEventListener(
  "pointermove",
  function(e){

    if(!playing){

      return;

    }


    /*
      Do not show the net until
      the child actually moves.
    */

    net.style.display =
      "block";


    const w =
      net.offsetWidth;

    const h =
      net.offsetHeight;


    net.style.left =
      (
        e.clientX -
        w/2
      )+"px";


    net.style.top =
      (
        e.clientY -
        h/2
      )+"px";

  }
);


/* =====================================================
   TOUCH SUPPORT
===================================================== */

document.addEventListener(
  "touchmove",
  function(e){

    if(!playing) return;

    const touch =
      e.touches[0];

    if(!touch) return;


    net.style.display =
      "block";


    const w =
      net.offsetWidth;

    const h =
      net.offsetHeight;


    net.style.left =
      (
        touch.clientX -
        w/2
      )+"px";


    net.style.top =
      (
        touch.clientY -
        h/2
      )+"px";

  },
  {
    passive:true
  }
);

</script>
