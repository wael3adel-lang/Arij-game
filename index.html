<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arij Oyun</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e9f8ff,#fff7e8);display:flex;align-items:center;justify-content:center;color:#243447}
.card{width:min(92%,430px);background:#fff;border-radius:28px;padding:30px;box-shadow:0 18px 50px #0001;text-align:center}
.logo{font-size:42px;font-weight:900;color:#2676d8;margin-bottom:4px}
.sub{color:#718096;margin-bottom:25px}
input{width:100%;padding:17px;border:2px solid #dbe5ef;border-radius:16px;font-size:22px;text-align:center;text-transform:uppercase;outline:none}
button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:16px;background:#2676d8;color:#fff;font-size:20px;font-weight:800;cursor:pointer}
button:active{transform:scale(.98)}
#error{color:#d64545;font-weight:700;min-height:24px;margin-top:15px}
#games{display:none}
.game{display:block;margin:12px 0;padding:17px;background:#f3f8ff;border-radius:16px;color:#2468bd;text-decoration:none;font-weight:800;font-size:19px}
.small{font-size:12px;color:#9aa7b4;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">ARİJ</div>
  <div class="sub">Eğlenceli Öğrenme Oyunları</div>

  <div id="login">
    <input id="code" maxlength="12" placeholder="Öğrenci kodu" autocomplete="off">
    <button id="start">Oyuna Başla</button>
    <div id="error"></div>
  </div>

  <div id="games">
    <div id="welcome" class="sub"></div>
    <div id="gameList"></div>
  </div>

  <div class="small">ARİJ OYUNU</div>
</div>

<script src="config.js"></script>
<script>
const codeEl=document.getElementById('code');
const errorEl=document.getElementById('error');
const login=document.getElementById('login');
const games=document.getElementById('games');

function enter(){
  const code=codeEl.value.trim().toUpperCase();
  const student=STUDENTS[code];

  if(!student){
    errorEl.textContent="Kod geçersiz. Lütfen öğretmeninizden doğru kodu alın.";
    return;
  }

  errorEl.textContent="";
  document.getElementById('welcome').textContent="Hoş geldin, "+student.name+"!";

  const list=document.getElementById('gameList');
  list.innerHTML="";

  student.games.forEach(id=>{
    const game=GAMES[id];
    if(!game)return;
    const a=document.createElement('a');
    a.className="game";
    a.href=game.path;
    a.textContent=game.title;
    list.appendChild(a);
  });

  login.style.display="none";
  games.style.display="block";
}
document.getElementById('start').addEventListener('click',enter);
codeEl.addEventListener('keydown',e=>{if(e.key==="Enter")enter();});
</script>
</body>
</html>
