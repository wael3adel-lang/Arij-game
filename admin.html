<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARİJ OYUNU — Öğretmen Paneli</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef8ff,#fff7e9);font-family:Arial,sans-serif;color:#243447}.wrap{max-width:1050px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 15px 45px #0001;margin-bottom:18px}.brand{font-size:32px;font-weight:900;color:#2676d8}.muted{color:#718096}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:750px){.grid{grid-template-columns:1fr}}input,select{width:100%;padding:13px;border:2px solid #dbe5ef;border-radius:12px;font-size:16px;margin:6px 0 12px}button{border:0;border-radius:12px;padding:12px 18px;background:#2676d8;color:white;font-weight:800;cursor:pointer;margin:4px}button.danger{background:#d64545}button.secondary{background:#6b7c93}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.games label{background:#f3f8ff;padding:10px;border-radius:10px}.student{border:1px solid #e5edf4;border-radius:16px;padding:15px;margin:10px 0}.code{font-family:monospace;font-size:22px;font-weight:900;letter-spacing:2px}.ok{color:#16834d;font-weight:800}.err{color:#c0392b;font-weight:800;min-height:22px}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.copy{font-size:13px;color:#527082}
</style></head><body><div class="wrap">
<div class="card"><div class="top"><div><div class="brand">ARİJ OYUNU</div><div class="muted">Öğretmen / Yönetici Paneli</div></div><button id="logout" class="secondary hidden">Çıkış</button></div></div>
<div id="loginCard" class="card"><h2>Öğretmen Girişi</h2><p class="muted">Supabase Auth hesabınızla giriş yapın.</p><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="loginBtn">Giriş Yap</button><div id="loginMsg" class="err"></div></div>
<div id="panel" class="hidden"><div class="grid"><div class="card"><h2>Yeni Öğrenci</h2><label>رقم الطالب</label><select id="studentNumber"></select><label>Öğrenci adı</label><input id="studentName" placeholder="Örn. Ahmet"><label>Oyunlar</label><div id="gameChecks" class="games"></div><button id="createBtn">Öğrenci Oluştur</button><div id="createMsg"></div></div><div class="card"><h2>Öğrenciler</h2><p class="muted">Her çocuk için 1–9 arasında sabit bir öğrenci numarası seçin. Çocuk girişte sadece bu numarayı yazar.</p><div id="students"></div><div id="editBox" class="card hidden" style="margin-top:12px"><h3>Öğrenci Düzenle</h3><input type="hidden" id="editId"><div id="editInfo" class="muted"></div><label>Oyunlar</label><div id="editChecks" class="games"></div><button id="saveEdit">Değişiklikleri Kaydet</button><button id="cancelEdit" class="secondary">İptal</button><div id="editMsg" class="err"></div></div></div></div></div>
</div><script>
const sb=window.supabaseClient; const $=id=>document.getElementById(id); let currentUser=null;
Object.entries(GAMES).forEach(([id,g])=>{$('gameChecks').insertAdjacentHTML('beforeend',`<label><input type="checkbox" value="${id}" checked> ${g.title}</label>`)});
async function refreshNumbers(){const {data}=await sb.from('students').select('code');const used=new Set((data||[]).map(x=>String(x.code)));$('studentNumber').innerHTML='';for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=String(i);o.textContent='Öğrenci '+i+(used.has(String(i))?' — مستخدم':'');$('studentNumber').appendChild(o)}}
async function init(){if(!sb){$('loginMsg').textContent='Önce supabase-config.js dosyasını doldurun.';return;} const {data:{session}}=await sb.auth.getSession(); if(session) await showPanel(session.user);}
async function showPanel(user){currentUser=user;$('loginCard').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');await loadStudents();await refreshNumbers();}
$('loginBtn').onclick=async()=>{const {error,data}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)await showPanel(data.user)};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function loadStudents(){const {data,error}=await sb.from('students').select('id,code,name,active,created_at').order('created_at',{ascending:false});if(error){$('students').innerHTML='<div class="err">'+error.message+'</div>';return;} $('students').innerHTML='';for(const s of data){const {data:gs}=await sb.from('student_games').select('game_id').eq('student_id',s.id);const names=(gs||[]).map(x=>GAMES[x.game_id]?.title||x.game_id).join('، ')||'لا توجد ألعاب';$('students').insertAdjacentHTML('beforeend',`<div class="student"><div><b>${escapeHtml(s.name)}</b> <span class="muted">${s.active?'نشط':'متوقف'}</span></div><div class="code">${s.code}</div><div class="copy">${escapeHtml(names)}</div><button onclick="editStudent('${s.id}', '${escapeJs(s.name)}', '${s.code}')">تعديل الألعاب</button><button onclick="toggleStudent('${s.id}',${s.active})" class="secondary">${s.active?'إيقاف':'تفعيل'}</button><button onclick="copyCode('${s.code}')">نسخ الرقم</button><button onclick="deleteStudent('${s.id}')" class="danger">حذف</button></div>`);}}
$('createBtn').onclick=async()=>{const number=$('studentNumber').value;const name=$('studentName').value.trim();const selected=[...document.querySelectorAll('#gameChecks input:checked')].map(x=>x.value);if(!name){$('createMsg').className='err';$('createMsg').textContent='اكتب اسم الطالب.';return;}if(!selected.length){$('createMsg').className='err';$('createMsg').textContent='اختر لعبة واحدة على الأقل.';return;}const {data:existing}=await sb.from('students').select('id').eq('code',number).maybeSingle();if(existing){$('createMsg').className='err';$('createMsg').textContent='هذا الرقم مستخدم بالفعل. اختر رقماً غير مستخدم أو استخدم زر «تعديل الألعاب» للطالب الموجود.';return;}let c=number;let {data:s,error}=await sb.from('students').insert({name,code:c}).select().single();if(error){$('createMsg').className='err';$('createMsg').textContent=error.message;return;}const {error:ge}=await sb.from('student_games').insert(selected.map(game_id=>({student_id:s.id,game_id})));if(ge){await sb.from('students').delete().eq('id',s.id);$('createMsg').className='err';$('createMsg').textContent=ge.message;return;}$('createMsg').className='ok';$('createMsg').textContent='تم إنشاء الطالب رقم '+c+'.';$('studentName').value='';await loadStudents();await refreshNumbers();};
window.toggleStudent=async(id,active)=>{const {error}=await sb.from('students').update({active:!active}).eq('id',id);if(error)alert(error.message);else loadStudents()};window.deleteStudent=async id=>{if(!confirm('حذف الطالب نهائياً؟'))return;const {error}=await sb.from('students').delete().eq('id',id);if(error)alert(error.message);else loadStudents()};window.copyCode=c=>navigator.clipboard?.writeText(String(c));
function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function escapeJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
window.editStudent=async(id,name,number)=>{const {data,error}=await sb.from('student_games').select('game_id').eq('student_id',id);if(error){alert(error.message);return;}$("editId").value=id;$("editInfo").textContent=name+' — Öğrenci '+number;$("editChecks").innerHTML='';const allowed=new Set((data||[]).map(x=>x.game_id));Object.entries(GAMES).forEach(([gid,g])=>{$("editChecks").insertAdjacentHTML('beforeend',`<label><input type="checkbox" value="${gid}" ${allowed.has(gid)?'checked':''}> ${g.title}</label>`)});$("editMsg").textContent='';$("editBox").classList.remove('hidden');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
$("cancelEdit").onclick=()=>$("editBox").classList.add('hidden');
$("saveEdit").onclick=async()=>{const id=$("editId").value;const selected=[...document.querySelectorAll('#editChecks input:checked')].map(x=>x.value);if(!selected.length){$("editMsg").textContent='اختر لعبة واحدة على الأقل.';return;}const {error:d}=await sb.from('student_games').delete().eq('student_id',id);if(d){$("editMsg").textContent=d.message;return;}const {error:i}=await sb.from('student_games').insert(selected.map(game_id=>({student_id:id,game_id})));if(i){$("editMsg").textContent=i.message;return;}$("editMsg").className='ok';$("editMsg").textContent='تم حفظ الألعاب المسموحة.';await loadStudents();};
init();
</script></body></html>
