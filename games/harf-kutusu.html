<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Harf Kutusu</title><link rel="stylesheet" href="_common.css"><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(135deg,#dff7ff,#fff4dc)}</style></head><body><div class="game"><div class="hud"><div class="title">📦 Harf Kutusu</div><div class="mission">Resmi incele ve doğru harfi seç.</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="pic">📦</div><div class="message" id="msg">Resimdeki kelimenin ilk harfini seç.</div><div class="choices" id="choices"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">📦</div><h1>Harf Kutusu</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const data=[[['🐱','KEDİ'],['🍎','ELMA'],['🌞','GÜNEŞ'],['🐟','BALIK'],['🚗','ARABA']],[['🐶','KÖPEK'],['🌳','AĞAÇ'],['🏠','EV'],['🍌','MUZ'],['🦋','KELEBEK']],[['🐰','TAVŞAN'],['🌹','GÜL'],['🍊','PORTAKAL'],['🚌','OTOBÜS'],['🐢','KAPLUMBAĞA']],[['🦒','ZÜRAFA'],['🍓','ÇİLEK'],['🚲','BİSİKLET'],['🐘','FİL'],['🌈','GÖKKUŞAĞI']],[['🦁','ASLAN'],['🐊','TİMSAH'],['🍉','KARPUZ'],['✈️','UÇAK'],['🐿️','SİNCAP']]];let L=0,Q=0,score=0,item;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}function render(){item=data[L][Q];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('pic').textContent=item[0];$('msg').textContent='Bu kelimenin ilk harfi hangisi?';let correct=item[1][0],pool=new Set([correct]);let all='ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ';while(pool.size<Math.min(3+L,6))pool.add(all[Math.floor(Math.random()*all.length)]);let a=[...pool].sort(()=>Math.random()-.5);$('choices').innerHTML=a.map(x=>`<button class="choice">${x}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>{if(b.textContent===correct){score+=10;Q++;$('msg').className='message success';$('msg').textContent='Aferin! '+item[1];speak(item[1]);setTimeout(()=>Q>=5?done():render(),500)}else{$('msg').className='message wrong';$('msg').textContent='Tekrar dene!'}})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
