<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Harf Kutusu | ARİJ</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e9f8ff,#fff8e9);color:#26364a;overflow-x:hidden}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94%,720px);display:flex;justify-content:space-between;align-items:center;z-index:5;font-weight:900}
.pill{background:#fff;padding:9px 14px;border-radius:14px;box-shadow:0 5px 18px #0001}
#watermark{position:fixed;top:57px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#8da1b4;opacity:.55;z-index:4}
main{width:min(94%,650px);margin:auto;padding:105px 0 25px;text-align:center}
h1{font-size:clamp(28px,7vw,45px);margin:0 0 7px;color:#e48728}
.instruction{font-size:clamp(19px,5vw,27px);font-weight:900;margin:0 0 17px}
.picture{width:min(48vw,210px);height:min(48vw,210px);margin:0 auto 17px;background:#fff;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:clamp(75px,20vw,130px);box-shadow:0 12px 35px #0001}
.word{font-size:22px;font-weight:900;margin-bottom:17px;min-height:28px}
.letters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:460px;margin:auto}
.letter{border:0;border-radius:20px;background:#fff;padding:17px 8px;font-size:clamp(27px,8vw,42px);font-weight:900;color:#2874c6;box-shadow:0 8px 22px #0001;cursor:pointer;min-height:78px}
.letter:active{transform:scale(.96)}
.letter.correct{background:#dff8e7;color:#1b9a4b}
.letter.wrong{background:#ffe0e0;color:#d84b4b}
#message{height:35px;margin-top:17px;font-size:21px;font-weight:900}
#startScreen{position:fixed;inset:0;background:linear-gradient(180deg,#e9f8ff,#fff8e9);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.startBox{width:min(92%,430px);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 55px #0002}
.startLogo{font-size:42px;font-weight:900;color:#2874c6}
.startBox h2{margin:5px 0 10px;font-size:30px;color:#e48728}
.startBox p{font-size:18px;line-height:1.5}
#startButton{border:0;border-radius:18px;background:#2874c6;color:#fff;padding:16px 30px;font-size:21px;font-weight:900;cursor:pointer}
#finish{display:none}
@media(max-width:420px){#hud{top:42px}.letters{gap:9px}.letter{min-height:70px;border-radius:16px}main{padding-top:105px}}
@media(max-height:700px){#hud{top:30px}main{padding-top:85px}.picture{width:125px;height:125px}.letters{gap:8px}.letter{min-height:58px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head>
<body>

<div id="startScreen">
  <div class="startBox">
    <div class="startLogo">ARİJ</div>
    <h2>📦 Harf Kutusu</h2>
    <p>Resme bak ve kelimenin başladığı harfi bul!</p>
    <button id="startButton">Başla</button>
  </div>
</div>

<div id="hud">
  <div class="pill">⭐ <span id="score">0</span></div>
  <div class="pill">⏱️ <span id="time">60</span></div>
  <div class="pill">🎯 <span id="round">1</span>/10</div>
</div>
<div id="watermark">ARİJ OYUNU</div>

<main>
  <h1>📦 Harf Kutusu</h1>
  <div class="instruction">Bu kelime hangi harfle başlıyor?</div>
  <div class="picture" id="picture">🐟</div>
  <div class="word" id="word">Balık</div>
  <div class="letters" id="letters"></div>
  <div id="message"></div>
</main>

<script>
const sounds={
 click:new Audio("../sounds/click.wav"),
 correct:new Audio("../sounds/correct.wav"),
 wrong:new Audio("../sounds/wrong.wav")
};
function play(name){try{sounds[name].currentTime=0;sounds[name].play().catch(()=>{});}catch(e){}}

const items=[
 {emoji:"🐟",word:"Balık",letter:"B"},
 {emoji:"🍎",word:"Elma",letter:"E"},
 {emoji:"🐱",word:"Kedi",letter:"K"},
 {emoji:"🐶",word:"Köpek",letter:"K"},
 {emoji:"🏠",word:"Ev",letter:"E"},
 {emoji:"🌞",word:"Güneş",letter:"G"},
 {emoji:"🍌",word:"Muz",letter:"M"},
 {emoji:"🚗",word:"Araba",letter:"A"},
 {emoji:"🐘",word:"Fil",letter:"F"},
 {emoji:"🦁",word:"Aslan",letter:"A"},
 {emoji:"🌸",word:"Çiçek",letter:"Ç"},
 {emoji:"🥛",word:"Süt",letter:"S"},
 {emoji:"🐝",word:"Arı",letter:"A"},
 {emoji:"🍋",word:"Limon",letter:"L"},
 {emoji:"🧸",word:"Oyuncak",letter:"O"},
 {emoji:"🐰",word:"Tavşan",letter:"T"},
 {emoji:"🐢",word:"Kaplumbağa",letter:"K"},
 {emoji:"🍓",word:"Çilek",letter:"Ç"},
 {emoji:"🚲",word:"Bisiklet",letter:"B"},
 {emoji:"⚽",word:"Top",letter:"T"}
];

const rounds=10;
let round=0,score=0,time=60,timer=null,current=null,locked=false;

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeOptions(correct){
 const all=[...new Set(items.map(x=>x.letter))].filter(x=>x!==correct);
 return shuffle([correct,...shuffle(all).slice(0,2)]);
}
function nextRound(){
 if(round>=rounds){finish();return}
 locked=false;
 current=items[Math.floor(Math.random()*items.length)];
 round++;
 document.getElementById("round").textContent=round;
 document.getElementById("picture").textContent=current.emoji;
 document.getElementById("word").textContent=current.word;
 document.getElementById("message").textContent="";
 const box=document.getElementById("letters");
 box.innerHTML="";
 makeOptions(current.letter).forEach(letter=>{
   const b=document.createElement("button");
   b.className="letter";
   b.textContent=letter;
   b.addEventListener("click",()=>choose(b,letter));
   box.appendChild(b);
 });
}
function choose(button,letter){
 if(locked)return;
 play("click");
 if(letter===current.letter){
   locked=true; score++;
   document.getElementById("score").textContent=score;
   button.classList.add("correct");
   document.getElementById("message").textContent="🎉 Harika!";
   play("correct");
   setTimeout(nextRound,650);
 }else{
   button.classList.add("wrong");
   document.getElementById("message").textContent="Tekrar dene! 💪";
   play("wrong");
 }
}
function finish(){
 clearInterval(timer);
 document.getElementById("message").textContent=`🏆 Bitti! ${score} / ${rounds}`;
 document.querySelectorAll(".letter").forEach(b=>b.disabled=true);
}
function startGame(){
 document.getElementById("startScreen").style.display="none";
 time=60;score=0;round=0;
 document.getElementById("score").textContent=0;
 document.getElementById("time").textContent=time;
 nextRound();
 timer=setInterval(()=>{
   time--;
   document.getElementById("time").textContent=time;
   if(time<=0)finish();
 },1000);
}
document.getElementById("startButton").addEventListener("click",startGame);
</script>
</body>
</html>
