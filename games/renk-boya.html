<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Renk Boya</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#14263d}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:rgba(255,255,255,.94);border-radius:24px;padding:10px 14px;text-align:center;box-shadow:0 10px 30px rgba(20,40,60,.18);border:2px solid rgba(255,255,255,.9)}.title{font-size:clamp(25px,5vw,38px);font-weight:1000}.mission{font-size:clamp(16px,3.2vw,23px);font-weight:900;margin-top:2px}.stats{font-size:clamp(13px,2.5vw,17px);font-weight:900;margin-top:5px}.btn{border:0;border-radius:18px;padding:13px 20px;background:#1677d2;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home,.restart{position:absolute;z-index:200;bottom:14px}.home{left:20px}.restart{right:20px;background:#f59b23;box-shadow:0 5px 0 #c9760e}.feedback{position:absolute;z-index:150;top:120px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff;font-size:20px;font-weight:1000;box-shadow:0 8px 24px #0002;display:none}.success{color:#0b9f6a}.error{color:#d62828}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,39,62,.38);z-index:300}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:28px;border-radius:30px;text-align:center;box-shadow:0 25px 60px #0005}.big{font-size:76px}.hidden{display:none!important}.shadow3d{filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
body{background:linear-gradient(135deg,#eaf9ff,#fff9e9)}.paintArea{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(620px,84vw);height:min(470px,50vh);background:#fff;border-radius:35px;box-shadow:0 18px 40px #0002;display:flex;align-items:center;justify-content:center}.drawing{width:75%;height:75%}.palette{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);display:flex;gap:18px;justify-content:center}.swatch{width:64px;height:64px;border-radius:50%;border:7px solid #fff;box-shadow:0 8px 18px #0003;cursor:pointer}.brush{font-size:20px;text-align:center}.painted{animation:paint .45s ease}@keyframes paint{50%{transform:scale(1.04)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎨 Renk Boya</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="paintArea"><svg id="drawing" class="drawing" viewBox="0 0 500 360"></svg></div><div class="palette" id="palette"></div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎨🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const items=[['ELMA','Kırmızı','#ef3340','apple'],['GÜNEŞ','Sarı','#ffd23f','sun'],['YAPRAK','Yeşil','#31b84a','leaf'],['PORTAKAL','Turuncu','#ff9811','orange'],['ÜZÜM','Mor','#8b5cf6','grape'],['GÖKYÜZÜ','Mavi','#269dd6','sky'],['ÇİÇEK','Pembe','#f06aa8','flower'],['MUZ','Sarı','#ffd23f','banana']];let L=0,Q=0,score=0,current;const $=id=>document.getElementById(id);function draw(type){let s='';if(type==='apple')s='<path id="shape" d="M250 90C205 40 120 60 115 145C110 245 175 305 250 320C325 305 390 245 385 145C380 60 295 40 250 90Z" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M250 90Q250 35 285 20" fill="none" stroke="#26384d" stroke-width="10" stroke-linecap="round"/><path d="M280 42Q330 15 350 55Q315 70 280 42Z" fill="#fff" stroke="#26384d" stroke-width="7"/>';if(type==='sun')s='<circle id="shape" cx="250" cy="190" r="78" fill="#fff" stroke="#26384d" stroke-width="9"/><g stroke="#26384d" stroke-width="13" stroke-linecap="round">'+[[250,45,250,80],[250,300,250,335],[105,190,140,190],[360,190,395,190],[145,85,170,110],[330,270,355,295],[355,85,330,110],[145,295,170,270]].map(a=>`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}"/>`).join('')+'</g>';if(type==='leaf')s='<path id="shape" d="M250 300C115 270 80 150 135 70C220 35 335 65 365 155C345 250 285 285 250 300Z" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M250 290Q260 170 335 105" fill="none" stroke="#26384d" stroke-width="8"/>';if(type==='orange')s='<circle id="shape" cx="250" cy="190" r="115" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M250 75Q250 35 280 20" stroke="#26384d" stroke-width="10" fill="none"/><path d="M275 35Q325 20 340 55Q300 65 275 35Z" fill="#fff" stroke="#26384d" stroke-width="7"/>';if(type==='grape')s='<g id="shape" fill="#fff" stroke="#26384d" stroke-width="8">'+[[220,120],[280,120],[190,175],[250,175],[310,175],[220,230],[280,230],[250,285]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="42"/>`).join('')+'</g>';if(type==='sky')s='<rect id="shape" x="90" y="90" width="320" height="200" rx="30" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M140 220Q185 150 235 215Q280 120 340 220" fill="none" stroke="#26384d" stroke-width="9"/>';if(type==='flower')s='<g id="shape" fill="#fff" stroke="#26384d" stroke-width="8">'+[[250,90],[315,125],[330,200],[285,250],[215,250],[170,200],[185,125]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="55"/>`).join('')+'<circle cx="250" cy="170" r="50"/></g>';if(type==='banana')s='<path id="shape" d="M120 120Q240 300 390 125Q360 300 220 305Q125 280 120 120Z" fill="#fff" stroke="#26384d" stroke-width="9"/>';$('drawing').innerHTML=s}function render(){current=items[(L*5+Q)%items.length];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('mission').textContent='Bu nesneyi '+current[1]+' renge boya!';draw(current[3]);let colors=[['#ef3340','Kırmızı'],['#ffd23f','Sarı'],['#31b84a','Yeşil'],['#ff9811','Turuncu'],['#8b5cf6','Mor'],['#269dd6','Mavi'],['#f06aa8','Pembe']].sort(()=>Math.random()-.5);$('palette').innerHTML='';colors.forEach(([c,n])=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=n;b.onclick=()=>paint(c,n,b);$('palette').appendChild(b)});$('msg').style.display='none'}function paint(c,n,b){if(n!==current[1]){$('msg').style.display='block';$('msg').className='feedback error';$('msg').textContent='❌ Bu renk değil!';return}let shape=$('shape');shape.setAttribute('fill',c);shape.classList.add('painted');score+=10;$('score').textContent=score;$('msg').style.display='block';$('msg').className='feedback success';$('msg').textContent='🎉 Harika!';speak(current[0]);setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},850)}function speak(t){try{let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}catch(e){}}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
