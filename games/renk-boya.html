<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Renk Boya</title><link rel="stylesheet" href="_common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(135deg,#dff7ff,#fff4dc)}</style></head><body><div class="game"><div class="hud"><div class="title">🎨 Renk Boya</div><div class="mission">Nesnenin doğru rengini seç.</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="obj">🎈</div><div class="message" id="msg">Doğru rengi seç.</div><div class="choices" id="choices"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎨</div><h1>Renk Boya</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const items=[[['🍎','Kırmızı',['Kırmızı','Mavi','Sarı']],['🌞','Sarı',['Sarı','Yeşil','Mavi']],['🌿','Yeşil',['Yeşil','Kırmızı','Mor']],['🌊','Mavi',['Mavi','Sarı','Turuncu']],['🍇','Mor',['Mor','Yeşil','Kırmızı']]],[['🍊','Turuncu',['Turuncu','Mavi','Pembe']],['🌸','Pembe',['Pembe','Sarı','Mor']],['☁️','Beyaz',['Beyaz','Siyah','Mavi']],['🖤','Siyah',['Siyah','Beyaz','Kırmızı']],['🟤','Kahverengi',['Kahverengi','Yeşil','Sarı']]], [['🐟','Mavi',['Mavi','Turuncu','Yeşil']],['🌹','Kırmızı',['Kırmızı','Mor','Mavi']],['🍋','Sarı',['Sarı','Pembe','Yeşil']],['🥦','Yeşil',['Yeşil','Turuncu','Mor']],['🦋','Mor',['Mor','Sarı','Mavi']]], [['🎨','Turuncu',['Turuncu','Pembe','Yeşil']],['🌈','Mavi',['Mavi','Mor','Sarı']],['🍉','Kırmızı',['Kırmızı','Yeşil','Turuncu']],['🌻','Sarı',['Sarı','Mavi','Pembe']],['🍆','Mor',['Mor','Kırmızı','Yeşil']]], [['🦄','Pembe',['Pembe','Mor','Mavi']],['🐳','Mavi',['Mavi','Yeşil','Sarı']],['🍓','Kırmızı',['Kırmızı','Pembe','Mor']],['🌳','Yeşil',['Yeşil','Kahverengi','Turuncu']],['🌅','Turuncu',['Turuncu','Sarı','Mor']]]];let L=0,Q=0,score=0,item;const $=id=>document.getElementById(id);function render(){item=items[L][Q];$('obj').textContent=item[0];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('msg').textContent='Bu nesne hangi renktir?';$('choices').innerHTML=item[2].map(x=>`<button class="choice">${x}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>{if(b.textContent===item[1]){score+=10;Q++;$('msg').className='message success';$('msg').textContent='Harika!';setTimeout(()=>Q>=5?done():render(),450)}else{$('msg').className='message wrong';$('msg').textContent='Tekrar dene!'}})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
