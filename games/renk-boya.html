<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renk Boya</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e9f8ff,#fff8e9);color:#26364a;overflow:hidden}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94%,700px);display:flex;justify-content:space-between;z-index:10;font-weight:900}.pill{background:#fff;padding:9px 14px;border-radius:14px;box-shadow:0 5px 18px #0001}
#watermark{position:fixed;top:57px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#8da1b4;opacity:.55;z-index:9}
main{width:min(94%,680px);margin:auto;padding:105px 0 25px;text-align:center}h1{font-size:clamp(28px,7vw,43px);margin:0 0 7px;color:#2874c6}.instruction{font-size:clamp(18px,5vw,25px);font-weight:900;margin-bottom:16px}#message{height:35px;margin-top:14px;font-size:21px;font-weight:900}
#startScreen{position:fixed;inset:0;background:linear-gradient(180deg,#e9f8ff,#fff8e9);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.startBox{width:min(92%,440px);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 55px #0002}.startLogo{font-size:42px;font-weight:900;color:#2874c6}.startBox h2{margin:5px 0 10px;font-size:30px;color:#e48728}.startBox p{font-size:18px;line-height:1.5}#startButton{border:0;border-radius:18px;background:#2874c6;color:#fff;padding:16px 30px;font-size:21px;font-weight:900;cursor:pointer}
@media(max-height:700px){#hud{top:30px}main{padding-top:85px}}
#canvas{width:min(80vw,360px);height:260px;background:#fff;border-radius:28px;margin:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px #0001}.object{font-size:145px;filter:grayscale(1)}.colors{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px}.color{width:58px;height:58px;border:5px solid white;border-radius:50%;box-shadow:0 5px 15px #0002;cursor:pointer}</style></head><body>
<div id="startScreen"><div class="startBox"><div class="startLogo">ARİJ</div><h2>🎨 Renk Boya</h2><p>Oku ve nesneyi istenen renge boya!</p><button id="startButton">Başla</button></div></div>
<div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">60</span></div><div class="pill">🎯 <span id="round">1</span>/10</div></div><div id="watermark">ARİJ OYUNU</div>
<main><h1>🎨 Renk Boya</h1><div class="instruction" id="inst"></div><div id="canvas"><div class="object" id="obj">🍎</div></div><div class="colors"><button class="color" data-c="kırmızı" style="background:#e53935"></button><button class="color" data-c="mavi" style="background:#3184e8"></button><button class="color" data-c="sarı" style="background:#f4c542"></button><button class="color" data-c="yeşil" style="background:#43ad5a"></button><button class="color" data-c="pembe" style="background:#ef7eb6"></button></div><div id="message"></div></main>
<script>const sounds={click:new Audio("../sounds/click.wav"),correct:new Audio("../sounds/correct.wav"),wrong:new Audio("../sounds/wrong.wav")};function play(n){try{sounds[n].currentTime=0;sounds[n].play().catch(()=>{});}catch(e){}}
const data=[["🍎","elmayı","kırmızı"],["🫐","meyveyi","mavi"],["🍌","muzu","sarı"],["🍏","elmayı","yeşil"],["🌷","çiçeği","pembe"],["🎈","balonu","kırmızı"],["🧸","oyuncağı","pembe"],["🍋","limonu","sarı"],["🥒","salatalığı","yeşil"],["🧢","şapkayı","mavi"]];
let r=0,s=0,t=60,cur,lock=false,timer;const obj=document.getElementById("obj");
function next(){if(r>=10)return finish();lock=false;cur=data[r%data.length];r++;round.textContent=r;obj.textContent=cur[0];obj.style.filter="grayscale(1)";inst.textContent=cur[2][0].toUpperCase()+cur[2].slice(1)+" "+cur[1]+" boya.";message.textContent=""}
document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{if(lock)return;play("click");if(b.dataset.c===cur[2]){lock=true;s++;score.textContent=s;obj.style.filter="none";message.textContent="🎉 Harika!";play("correct");setTimeout(next,600)}else{message.textContent="Tekrar dene!";play("wrong")}});
function finish(){clearInterval(timer);message.textContent="🏆 Bitti! "+s+" / 10"}
function start(){startScreen.style.display="none";next();timer=setInterval(()=>{t--;time.textContent=t;if(t<=0)finish()},1000)}startButton.onclick=start;
</script></body></html>
