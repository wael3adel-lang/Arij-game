<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Renk Boya</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:linear-gradient(135deg,#e8f9ff,#fff6e2)}.colorName{position:absolute;z-index:30;top:132px;left:50%;transform:translateX(-50%);font-size:clamp(28px,5vw,45px);font-weight:1000;text-shadow:0 2px 4px #0002}.content{position:absolute;inset:185px 0 68px;display:flex;flex-direction:column;align-items:center;justify-content:center}.picture{width:min(300px,62vw);height:260px;display:grid;place-items:center}.picture svg{width:100%;height:100%;filter:drop-shadow(0 12px 7px #0002)}.instruction{font-size:20px;font-weight:1000;margin:3px}.palette{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:12px}.paint{width:76px;height:76px;border-radius:50%;border:5px solid #fff;box-shadow:inset -10px -10px 16px #0002,0 7px 16px #0003;cursor:pointer;position:relative}.paint:after{content:"";position:absolute;left:17px;top:12px;width:25px;height:12px;background:#fff8;border-radius:50%;transform:rotate(-25deg)}.paint.red{background:#ef3340}.paint.blue{background:#2587e8}.paint.yellow{background:#ffd43b}.paint.green{background:#24b36b}.paint.purple{background:#8b5cf6}.paint.orange{background:#f97316}.paint.pink{background:#ec4899}.selected{outline:5px solid #18324a}.message{min-height:30px}@keyframes paintFill{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}@media(max-width:600px){.colorName{top:125px;font-size:31px}.content{inset:172px 0 70px}.picture{height:210px}.paint{width:62px;height:62px}.palette{gap:11px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎨 Renk Boya</div><div class="mission">Nesnenin doğru rengini seç.</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="colorName" id="colorName"></div><div class="content"><div class="picture" id="obj"></div><div class="instruction">Doğru boya rengini seç:</div><div class="palette" id="choices"></div><div class="message" id="msg"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎨</div><h1>Renk Boya</h1><p>Doğru boya ile resmi renklendir.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>const items=[[['apple','Kırmızı','red'],['sun','Sarı','yellow'],['leaf','Yeşil','green'],['fish','Mavi','blue'],['grape','Mor','purple']],[['orange','Turuncu','orange'],['flower','Pembe','pink'],['cloud','Beyaz','blue'],['night','Siyah','purple'],['mushroom','Kahverengi','orange']],[['boat','Mavi','blue'],['rose','Kırmızı','red'],['lemon','Sarı','yellow'],['broccoli','Yeşil','green'],['eggplant','Mor','purple']],[['carrot','Turuncu','orange'],['rainbow','Mavi','blue'],['watermelon','Kırmızı','red'],['sunflower','Sarı','yellow'],['eggplant2','Mor','purple']],[['unicorn','Pembe','pink'],['whale','Mavi','blue'],['strawberry','Kırmızı','red'],['tree','Yeşil','green'],['sunset','Turuncu','orange']]];const colors={'Kırmızı':'red','Mavi':'blue','Sarı':'yellow','Yeşil':'green','Mor':'purple','Turuncu':'orange','Pembe':'pink','Beyaz':'blue','Siyah':'purple','Kahverengi':'orange'};let L=0,Q=0,score=0,item,painted=false;const $=id=>document.getElementById(id);function svgFor(k,fill='none'){const stroke='#151515',sw=6;if(k==='apple')return `<svg viewBox="0 0 240 220"><path d="M120 54 Q125 20 153 12" stroke="#151515" stroke-width="8" fill="none"/><ellipse cx="159" cy="27" rx="30" ry="15" fill="none" stroke="#151515" stroke-width="6" transform="rotate(-25 159 27)"/><path id="paintable" d="M58 91 Q75 55 120 68 Q165 55 182 91 Q205 154 153 190 Q120 210 87 190 Q35 154 58 91Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/></svg>`;if(k==='sun')return `<svg viewBox="0 0 240 220"><circle cx="120" cy="110" r="54" fill="${fill}" stroke="#151515" stroke-width="6"/><g stroke="#151515" stroke-width="6">${Array.from({length:12},(_,i)=>{let a=i*Math.PI/6,x1=120+70*Math.cos(a),y1=110+70*Math.sin(a),x2=120+92*Math.cos(a),y2=110+92*Math.sin(a);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join('')}</g></svg>`;if(k==='leaf')return `<svg viewBox="0 0 240 220"><path d="M120 195 Q120 115 170 60" stroke="#151515" stroke-width="8" fill="none"/><path id="paintable" d="M120 165 Q55 125 70 48 Q145 42 182 88 Q178 150 120 165Z" fill="${fill}" stroke="#151515" stroke-width="6"/></svg>`;if(k==='fish')return `<svg viewBox="0 0 240 220"><ellipse cx="120" cy="110" rx="72" ry="48" fill="${fill}" stroke="#151515" stroke-width="6"/><path d="M50 110 L18 75 L24 110 L18 145Z" fill="${fill}" stroke="#151515" stroke-width="6"/><circle cx="150" cy="95" r="7"/><path d="M92 88 Q110 105 92 132" stroke="#151515" stroke-width="5" fill="none"/></svg>`;return `<svg viewBox="0 0 240 220"><circle id="paintable" cx="120" cy="110" r="70" fill="${fill}" stroke="#151515" stroke-width="6"/><circle cx="94" cy="98" r="7"/><circle cx="146" cy="98" r="7"/><path d="M92 132 Q120 150 148 132" stroke="#151515" stroke-width="5" fill="none"/></svg>`}function render(){item=items[L][Q];painted=false;$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('colorName').textContent=item[1].toUpperCase();$('colorName').style.color={Kırmızı:'#ef3340',Mavi:'#2587e8',Sarı:'#d19b00',Yeşil:'#24a55f',Mor:'#7c3aed',Turuncu:'#f97316',Pembe:'#ec4899',Beyaz:'#5b6573',Siyah:'#111827',Kahverengi:'#8a5a2b'}[item[1]]||'#18324a';$('obj').innerHTML=svgFor(item[0]);const opts=[item[2]];const all=['red','blue','yellow','green','purple','orange','pink'];while(opts.length<4){const x=all[Math.floor(Math.random()*all.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);$('choices').innerHTML=opts.map(x=>`<button class="paint ${x}" aria-label="${x}"></button>`).join('');$('msg').className='message';$('msg').textContent='اختر دائرة الطلاء الصحيحة.';[...$('choices').children].forEach(b=>b.onclick=()=>{if(painted)return;if(b.classList.contains(item[2])){painted=true;b.classList.add('selected');const svg=$('obj').querySelector('#paintable');if(svg){svg.setAttribute('fill',paintColor(item[2]));svg.style.animation='paintFill .4s'}score+=10;$('msg').className='message success';$('msg').textContent='🎨 Harika! Resim boyandı!';setTimeout(()=>{Q++;Q>=5?done():render()},700)}else{$('msg').className='message wrong';$('msg').textContent='❌ Bu boya değil. Tekrar dene.'}})}function paintColor(c){return {red:'#ef3340',blue:'#2587e8',yellow:'#ffd43b',green:'#24b36b',purple:'#8b5cf6',orange:'#f97316',pink:'#ec4899'}[c]||'#999'}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
