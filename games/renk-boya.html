<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Renk Boya</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.btn{border:0;border-radius:16px;padding:12px 20px;background:#1677d2;color:#fff;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home{position:absolute;z-index:90;bottom:12px;left:12px}.restart{position:absolute;z-index:90;bottom:12px;right:12px;background:#f39a28;box-shadow:0 5px 0 #c97713}.hud{position:absolute;z-index:70;top:8px;left:50%;transform:translateX(-50%);width:min(920px,94%);background:#fffffff2;border-radius:22px;padding:9px 14px;text-align:center;box-shadow:0 8px 25px #0002}.title{font-size:clamp(26px,4vw,36px);font-weight:1000}.mission{font-size:clamp(17px,3vw,23px);font-weight:900}.stats{font-weight:900;font-size:14px}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#173c5c99;z-index:100}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:30px;border-radius:30px;text-align:center;box-shadow:0 20px 55px #0005}.big{font-size:70px}.hidden{display:none!important}body{background:linear-gradient(135deg,#e8f9ff,#fff6df);color:#17344a}.game{height:100%;position:relative;overflow:hidden}.content{position:absolute;inset:125px 0 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.canvas{width:min(420px,72vw);height:min(300px,42vh);background:#fff;border-radius:28px;box-shadow:0 12px 30px #0002;border:5px solid #fff;display:grid;place-items:center;overflow:hidden}.art{width:90%;height:90%}.outline{fill:#fff;stroke:#25364a;stroke-width:5;stroke-linejoin:round}.painted{stroke:#25364a;stroke-width:5;stroke-linejoin:round}.palette{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.paint{width:62px;height:62px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 15px #0003;cursor:pointer;position:relative;touch-action:manipulation}.paint:after{content:'🖌️';position:absolute;right:-8px;bottom:-8px;font-size:20px}.paint.selected{transform:scale(1.1);outline:4px solid #25364a}.message{font-size:19px;font-weight:1000;min-height:26px}.success{color:#14945c}.wrong{color:#d34848}.home{position:absolute;bottom:12px;left:12px}.restart{position:absolute;bottom:12px;right:12px;background:#f39b28}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎨 Renk Boya</div><div class="mission" id="mission">Doğru rengi seç ve resmi boya!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="round">1</b>/5</div></div><div class="content"><div class="canvas" id="canvas"></div><div class="message" id="msg">Uygun rengi seç.</div><div class="palette" id="palette"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="big">🎨</div><h1>Renk Boya</h1><p>Resimdeki doğru bölümü seçtiğin renkle boya.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎨🎉</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const items=[[['🌞','Güneş','Sarı'],['🍎','Elma','Kırmızı'],['🌳','Ağaç','Yeşil'],['☁️','Bulut','Beyaz'],['🐟','Balık','Mavi']],[['🍊','Portakal','Turuncu'],['🌸','Çiçek','Pembe'],['🍇','Üzüm','Mor'],['🦓','Zebra','Siyah'],['🧸','Oyuncak','Kahverengi']],[['🍋','Limon','Sarı'],['🥦','Brokoli','Yeşil'],['🌹','Gül','Kırmızı'],['🐳','Balina','Mavi'],['🍆','Patlıcan','Mor']],[['🎈','Balon','Turuncu'],['🍉','Karpuz','Kırmızı'],['🌻','Ayçiçeği','Sarı'],['🌊','Dalga','Mavi'],['🍓','Çilek','Kırmızı']],[['🦄','Tek Boynuz','Pembe'],['🐳','Balina','Mavi'],['🌳','Ağaç','Yeşil'],['🍫','Çikolata','Kahverengi'],['🌈','Gökkuşağı','Mor']]];const colors={Kırmızı:'#ef476f',Sarı:'#ffd43b',Yeşil:'#39b878',Mavi:'#2696d2',Turuncu:'#ff9f1c',Pembe:'#f58ab2',Mor:'#8b5cf6',Beyaz:'#fff',Siyah:'#222',Kahverengi:'#9a633b'};let L=0,Q=0,score=0,item,part;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=[...speechSynthesis.getVoices()].find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function svgFor(name){let shapes={"🌞":`<circle class="outline" cx="200" cy="140" r="62" data-part="main"/><g class="outline" fill="none"><path d="M200 22v34M200 224v34M82 140H48M352 140h-34M117 57l-24-24M283 223l24 24M117 223l-24 24M283 57l24-24" stroke-width="14" stroke-linecap="round"/></g>`,"🍎":`<path class="outline" data-part="main" d="M200 70c-72-35-120 18-102 86 16 60 58 92 102 50 44 42 86 10 102-50 18-68-30-121-102-86z"/><path class="outline" d="M202 70c0-30 18-45 42-50" fill="none"/><path class="outline" d="M220 33c22-12 42-5 55 12-25 12-44 7-55-12z"/>`,"🌳":`<path class="outline" data-part="main" d="M178 170h44v85h-44z"/><circle class="outline" data-part="main" cx="200" cy="105" r="76"/><circle class="outline" data-part="main" cx="145" cy="125" r="45"/><circle class="outline" data-part="main" cx="255" cy="125" r="45"/>`,"☁️":`<path class="outline" data-part="main" d="M90 180h220a45 45 0 0 0 0-90 70 70 0 0 0-130-18A62 62 0 0 0 90 180z"/>`,"🐟":`<path class="outline" data-part="main" d="M70 145c50-75 155-75 210 0-55 75-160 75-210 0z"/><path class="outline" data-part="main" d="M280 145l70-55v110z"/><circle cx="115" cy="125" r="8" fill="#25364a"/>`};let s=shapes[name]||shapes['🌞'];return `<svg class="art" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">${s}</svg>`}function render(){item=items[L][Q];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('mission').textContent='Bu nesneyi '+item[2]+' renge boya!';$('msg').textContent='Doğru boya rengini seç.';$('msg').className='message';$('canvas').innerHTML=svgFor(item[0]);part=document.querySelector('[data-part]');let opts=[item[2],...Object.keys(colors).filter(x=>x!==item[2]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('palette').innerHTML='';opts.forEach(c=>{let b=document.createElement('button');b.className='paint';b.title=c;b.setAttribute('aria-label',c);b.style.background=colors[c];b.onclick=()=>paint(b,c);$('palette').appendChild(b)});speak('Bu nesneyi '+item[2]+' renge boya')}function paint(b,c){if(c!==item[2]){$('msg').textContent='❌ Bu renk değil, tekrar dene.';$('msg').className='message wrong';speak('Tekrar dene');return}b.classList.add('selected');part.classList.remove('outline');part.classList.add('painted');part.style.fill=colors[c];$('msg').textContent='🎉 Harika! Doğru renk!';$('msg').className='message success';score+=10;$('score').textContent=score;speak('Harika!');setTimeout(()=>{Q++;if(Q>=5){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},750)}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
