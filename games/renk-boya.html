<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Renk Boya</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:200;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:24px;padding:10px 14px;box-shadow:0 10px 30px #16425b30;text-align:center;backdrop-filter:blur(8px)}.title{font-size:clamp(25px,5vw,40px);font-weight:1000;color:#172f49}.mission{font-size:clamp(17px,3.4vw,25px);font-weight:900;margin-top:2px}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:clamp(15px,3vw,20px);flex-wrap:wrap;margin-top:6px}.btn{border:0;border-radius:22px;padding:14px 25px;color:#fff;font-size:clamp(17px,3vw,23px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #0002}.home{position:absolute;z-index:500;left:24px;bottom:14px;background:#1680d8}.restart{position:absolute;z-index:500;right:24px;bottom:14px;background:#f5a020}.feedback{position:absolute;z-index:450;left:50%;transform:translateX(-50%);top:130px;background:#fff;border-radius:24px;padding:13px 25px;font-size:clamp(18px,4vw,28px);font-weight:1000;box-shadow:0 12px 30px #0002;display:none;text-align:center}.success{color:#119a62}.error{color:#d62828}.celebrate{position:absolute;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(4px)}.panel{width:min(460px,90%);background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 70px #0005}.panel h1{margin:8px 0;font-size:38px}.panel p{font-size:20px;font-weight:800}.big{font-size:78px;filter:drop-shadow(0 12px 8px #0003)}.hidden{display:none!important}.confetti{position:absolute;width:11px;height:20px;top:42%;z-index:900;animation:conf 1s ease-out forwards;pointer-events:none}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}@media(max-width:600px){.hud{top:6px;padding:8px 10px}.home{left:20px;bottom:12px}.restart{right:20px;bottom:12px}.btn{padding:13px 19px;border-radius:20px}.feedback{top:118px;max-width:90%}}body{background:linear-gradient(135deg,#dff8ff,#fff6dd)}.paintArea{position:absolute;top:175px;left:50%;transform:translateX(-50%);width:min(620px,88%);height:56%;background:linear-gradient(145deg,#fff,#f4f9fc);border-radius:34px;box-shadow:inset 0 2px 0 #fff,0 18px 35px #0002;display:flex;align-items:center;justify-content:center}.drawing{width:86%;height:86%;filter:drop-shadow(0 15px 9px #0002)}.shape{transition:fill .35s ease;filter:drop-shadow(0 7px 3px #0002)}.colorName{position:absolute;z-index:180;top:145px;left:50%;transform:translateX(-50%);font-size:clamp(24px,5vw,34px);font-weight:1000;padding:10px 24px;border-radius:20px;background:#fff;box-shadow:0 8px 20px #0002}.palette{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);display:flex;gap:14px;justify-content:center}.swatch{width:68px;height:68px;border-radius:50%;border:7px solid #fff;box-shadow:0 8px 17px #0003,inset 0 3px 6px #fff8;cursor:pointer;touch-action:manipulation}.swatch:active{transform:scale(.94)}@media(max-width:600px){.paintArea{top:195px;height:50%}.colorName{top:150px}.swatch{width:58px;height:58px;border-width:6px}.palette{gap:9px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎨 Renk Boya</div><div class="mission">Nesneyi doğru renkle boya!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="colorName" id="colorName"></div><div class="paintArea"><svg id="drawing" class="drawing" viewBox="0 0 500 360"></svg></div><div class="palette" id="palette"></div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎨🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next" style="background:#1680d8">Sonraki Seviye ➡️</button></div></div></div><script>const items=[('ELMA', 'KIRMIZI', '#ef3340', 'apple'), ('GÜNEŞ', 'SARI', '#ffd23f', 'sun'), ('YAPRAK', 'YEŞİL', '#31b84a', 'leaf'), ('PORTAKAL', 'TURUNCU', '#ff9811', 'orange'), ('ÜZÜM', 'MOR', '#8b5cf6', 'grape'), ('GÖKYÜZÜ', 'MAVİ', '#269dd6', 'sky'), ('ÇİÇEK', 'PEMBE', '#f06aa8', 'flower'), ('MUZ', 'SARI', '#ffd23f', 'banana')];const shapes={'apple': '<path id="shape" d="M250 90C205 40 120 60 115 145C110 245 175 305 250 320C325 305 390 245 385 145C380 60 295 40 250 90Z" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M250 90Q250 35 285 20" fill="none" stroke="#26384d" stroke-width="10" stroke-linecap="round"/><path d="M280 42Q330 15 350 55Q315 70 280 42Z" fill="#fff" stroke="#26384d" stroke-width="7"/>', 'sun': '<circle id="shape" cx="250" cy="190" r="78" fill="#fff" stroke="#26384d" stroke-width="9"/><g stroke="#26384d" stroke-width="13" stroke-linecap="round"><line x1="250" y1="35" x2="250" y2="80"/><line x1="250" y1="300" x2="250" y2="345"/><line x1="90" y1="190" x2="140" y2="190"/><line x1="360" y1="190" x2="410" y2="190"/><line x1="130" y1="70" x2="165" y2="105"/><line x1="335" y1="275" x2="370" y2="310"/><line x1="370" y1="70" x2="335" y2="105"/><line x1="130" y1="310" x2="165" y2="275"/></g>', 'leaf': '<path id="shape" d="M250 310C115 270 80 150 135 70C220 35 335 65 365 155C345 250 285 285 250 310Z" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M250 300Q260 170 340 100" fill="none" stroke="#26384d" stroke-width="8"/>', 'orange': '<circle id="shape" cx="250" cy="190" r="115" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M250 75Q250 35 280 20" stroke="#26384d" stroke-width="10" fill="none"/><path d="M275 35Q325 20 340 55Q300 65 275 35Z" fill="#fff" stroke="#26384d" stroke-width="7"/>', 'grape': '<g id="shape" fill="#fff" stroke="#26384d" stroke-width="8"><circle cx="220" cy="120" r="42"/><circle cx="280" cy="120" r="42"/><circle cx="190" cy="175" r="42"/><circle cx="250" cy="175" r="42"/><circle cx="310" cy="175" r="42"/><circle cx="220" cy="230" r="42"/><circle cx="280" cy="230" r="42"/><circle cx="250" cy="285" r="42"/></g>', 'sky': '<rect id="shape" x="70" y="90" width="360" height="200" rx="30" fill="#fff" stroke="#26384d" stroke-width="9"/><path d="M120 230Q175 145 235 220Q285 120 370 230" fill="none" stroke="#26384d" stroke-width="9"/>', 'flower': '<g id="shape" fill="#fff" stroke="#26384d" stroke-width="8"><circle cx="250" cy="90" r="55"/><circle cx="315" cy="125" r="55"/><circle cx="330" cy="200" r="55"/><circle cx="285" cy="250" r="55"/><circle cx="215" cy="250" r="55"/><circle cx="170" cy="200" r="55"/><circle cx="185" cy="125" r="55"/><circle cx="250" cy="170" r="50"/></g>', 'banana': '<path id="shape" d="M120 120Q240 300 390 125Q360 300 220 305Q125 280 120 120Z" fill="#fff" stroke="#26384d" stroke-width="9"/>'};let L=0,Q=0,score=0,current;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){current=items[(L*5+Q)%items.length];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('colorName').innerHTML='Boyanacak renk: <b style="color:'+current[2]+'">'+current[1]+'</b>';$('drawing').innerHTML=shapes[current[3]];const opts=[['#ef3340','KIRMIZI'],['#ffd23f','SARI'],['#31b84a','YEŞİL'],['#ff9811','TURUNCU'],['#8b5cf6','MOR'],['#269dd6','MAVİ'],['#f06aa8','PEMBE']].sort(()=>Math.random()-.5);$('palette').innerHTML='';opts.forEach(([c,n])=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.setAttribute('aria-label',n);b.onclick=()=>paint(c,n)});$('msg').style.display='none'}function paint(c,n){if(n!==current[1]){$('msg').className='feedback error';$('msg').textContent='❌ Bu renk değil!';$('msg').style.display='block';return}const shape=$('shape');shape.setAttribute('fill',c);shape.classList.add('shape');score+=10;$('score').textContent=score;$('msg').className='feedback success';$('msg').textContent='🎉 Harika!';$('msg').style.display='block';speak(current[0]+' '+current[1]);setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},850)}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
