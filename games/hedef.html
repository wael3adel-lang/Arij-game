<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hedefi Vur</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#14263d}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:rgba(255,255,255,.94);border-radius:24px;padding:10px 14px;text-align:center;box-shadow:0 10px 30px rgba(20,40,60,.18);border:2px solid rgba(255,255,255,.9)}.title{font-size:clamp(25px,5vw,38px);font-weight:1000}.mission{font-size:clamp(16px,3.2vw,23px);font-weight:900;margin-top:2px}.stats{font-size:clamp(13px,2.5vw,17px);font-weight:900;margin-top:5px}.btn{border:0;border-radius:18px;padding:13px 20px;background:#1677d2;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home,.restart{position:absolute;z-index:200;bottom:14px}.home{left:20px}.restart{right:20px;background:#f59b23;box-shadow:0 5px 0 #c9760e}.feedback{position:absolute;z-index:150;top:120px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff;font-size:20px;font-weight:1000;box-shadow:0 8px 24px #0002;display:none}.success{color:#0b9f6a}.error{color:#d62828}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,39,62,.38);z-index:300}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:28px;border-radius:30px;text-align:center;box-shadow:0 25px 60px #0005}.big{font-size:76px}.hidden{display:none!important}.shadow3d{filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
body{background:linear-gradient(#8cddff 0 28%,#75bf68 28%)}.lanes{position:absolute;left:8%;right:8%;top:180px;bottom:84px;display:grid;grid-template-columns:repeat(3,1fr);gap:0}.lane{border:4px dashed #fff8;position:relative;display:flex;align-items:center;justify-content:center}.targetBall{width:min(120px,24vw);height:min(120px,24vw);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ff8ca5 13% 34%,#e62c62 35% 100%);border:8px solid #fff;box-shadow:0 15px 25px #0003;display:grid;place-items:center;font-size:clamp(30px,7vw,52px);font-weight:1000;color:#0876d1;cursor:pointer;touch-action:manipulation}.bow{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:95px;z-index:50;filter:drop-shadow(0 12px 6px #0005)}.arrowFly{position:absolute;z-index:60;font-size:60px;transform-origin:left center;animation:arrowGo .55s ease forwards;pointer-events:none}.hitTarget{animation:targetHit .5s ease}@keyframes arrowGo{to{transform:translate(var(--dx),var(--dy))}}@keyframes targetHit{50%{transform:scale(1.2);filter:brightness(1.5)}100%{transform:scale(.96)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🏹 Hedefi Vur</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="lanes" id="lanes"></div><div class="bow">🏹</div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🏹🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[['D','E','F'],'F'],[['A','B','C'],'B'],[['G','H','I'],'H'],[['J','K','L'],'K'],[['M','N','O'],'O'],[['P','R','S'],'R'],[['T','U','Ü'],'Ü'],[['Ç','Ş','Z'],'Ç'],[['B','D','G'],'D'],[['K','L','M'],'L'],[['A','E','İ'],'İ'],[['O','Ö','U'],'Ö'],[['C','Ç','S'],'Ç'],[['Ğ','G','H'],'Ğ'],[['I','İ','J'],'J'],[['K','N','R'],'N'],[['L','O','P'],'P'],[['M','Ş','T'],'Ş'],[['R','S','V'],'S'],[['U','Ü','Y'],'Y'],[['A','Ö','Z'],'Z'],[['B','İ','K'],'İ'],[['Ç','D','E'],'E'],[['F','Ğ','H'],'Ğ'],[['J','M','N'],'M']];let L=0,Q=0,score=0;const $=id=>document.getElementById(id);function render(){let d=qs[L*5+Q];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('mission').textContent='Doğru hedefi vur: '+d[1];$('msg').style.display='none';$('lanes').innerHTML='';d[0].forEach((x,i)=>{let lane=document.createElement('div');lane.className='lane';let b=document.createElement('button');b.className='targetBall';b.textContent=x;b.onclick=()=>shoot(b,x===d[1],i);lane.appendChild(b);$('lanes').appendChild(lane)})}function shoot(target,ok,i){let bow=document.querySelector('.bow'),r1=bow.getBoundingClientRect(),r2=target.getBoundingClientRect();let a=document.createElement('div');a.className='arrowFly';a.textContent='➶';a.style.left=r1.left+r1.width/2+'px';a.style.top=r1.top+r1.height/2+'px';a.style.setProperty('--dx',(r2.left-r1.left)+'px');a.style.setProperty('--dy',(r2.top-r1.top)+'px');document.body.appendChild(a);setTimeout(()=>{a.remove();if(ok){target.classList.add('hitTarget');score+=10;$('score').textContent=score;$('msg').style.display='block';$('msg').className='feedback success';$('msg').textContent='🎯 İsabet! Aferin!';setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},750)}else{$('msg').style.display='block';$('msg').className='feedback error';$('msg').textContent='❌ Iskaladın! Tekrar dene.'}},560)}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
