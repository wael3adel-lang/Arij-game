<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hedefi Vur</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#fff4dc);color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.target{font-size:1.5em;color:#e95c38}.stats{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:#35c98a}.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:white;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.red{background:#db5353}.content{position:absolute;inset:130px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{min-width:90px;min-height:72px;border:0;border-radius:20px;background:white;box-shadow:0 8px 18px #0002;font-size:26px;font-weight:1000;cursor:pointer;padding:12px;touch-action:manipulation}.choice:hover{transform:translateY(-2px)}.picture{font-size:110px;filter:drop-shadow(0 8px 5px #0002)}.message{min-height:35px;font-weight:1000;font-size:20px;margin:8px}.success{color:#15945d}.wrong{color:#d34848}.celebrate{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.confetti{position:absolute;width:11px;height:20px;top:-30px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}.home{position:absolute;z-index:30;left:12px;bottom:12px}.restart{position:absolute;z-index:30;right:12px;bottom:12px}.small{font-size:14px;color:#668}.hidden{display:none!important}@media(max-width:600px){.hud{top:5px}.content{inset:125px 0 60px}.choice{min-width:78px;min-height:64px;font-size:22px}.picture{font-size:82px}.panel{padding:22px}.btn{font-size:16px}}
#targetField{position:absolute;inset:145px 0 78px;display:flex;justify-content:center;gap:12px;padding:20px 7%;background:linear-gradient(#8ddcff 0 32%,#79c66b 32% 100%)}.lane{position:relative;flex:1;max-width:260px;border:5px dashed #fff9;border-radius:28px;background:#ffffff12;overflow:hidden}.lane>span{display:block;text-align:center;color:#fff;font-weight:1000;font-size:20px;padding:10px}.target{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,#ef476f 17% 32%,#fff 33% 48%,#ef476f 49% 66%,#fff 67% 100%);box-shadow:0 10px 22px #0004;cursor:pointer;touch-action:manipulation}.target:after{content:"🎈";position:absolute;font-size:42px;left:36px;top:35px}.target.hit{animation:targetHit .5s}.target.wrong{animation:shake .4s}.message{position:absolute;top:132px;left:50%;transform:translateX(-50%);z-index:30;background:#fff;padding:9px 22px;border-radius:18px;font-weight:1000}.targetField #bow{position:absolute;bottom:15px;left:50%;transform:translateX(-50%) rotate(-10deg);font-size:80px;z-index:10}.targetField #arrow{position:absolute;display:none;z-index:20;font-size:62px;transform-origin:left center;filter:drop-shadow(0 5px 3px #0005)}.success{color:#15945d}.wrong{color:#d34848}@keyframes arrowFly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}@keyframes targetHit{50%{transform:translate(-50%,-50%) scale(1.25)}to{transform:translate(-50%,-50%) scale(1)}}@keyframes shake{25%{transform:translate(-60%,-50%)}75%{transform:translate(-40%,-50%)}}@media(max-width:600px){#targetField{inset:150px 0 78px;padding:15px 3%;gap:7px}.lane>span{font-size:14px}.target{width:88px;height:88px}.target:after{font-size:32px;left:28px;top:27px}.targetField #bow{font-size:65px}.targetField #arrow{font-size:50px}.message{top:140px;font-size:16px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game" style="background:linear-gradient(#8ddcff,#79c66b)"><div class="hud"><div class="title">🏹 Hedefi Vur</div><div class="mission">Doğru hedefe dokun, ok kendisi uçsun!</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div id="targetField"><div class="lane"><span>ŞERİT 1</span><div class="target" data-lane="0"></div></div><div class="lane"><span>ŞERİT 2</span><div class="target" data-lane="1"></div></div><div class="lane"><span>ŞERİT 3</span><div class="target" data-lane="2"></div></div><div id="bow">🏹</div><div id="arrow">➶</div></div><div class="message" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🏹</div><h1>Hedefi Vur</h1><p>Hedefe dokun, ok kendisi uçsun!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const tasks=[0,2,1,0,2,1,0,2,1,0];let L=0,Q=0,score=0,targetLane=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;targetLane=tasks[(L+Q)%tasks.length];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('msg').textContent='Doğru hedefe dokun!';document.querySelectorAll('.target').forEach((t,i)=>{t.textContent='';t.className='target';t.dataset.lane=i});$('arrow').style.display='none'}function shoot(t){if(locked)return;locked=true;let r=t.getBoundingClientRect(),b=$('bow').getBoundingClientRect(),a=$('arrow');a.style.display='block';a.style.left=(b.left+b.width/2)+'px';a.style.top=(b.top+b.height/2)+'px';let dx=r.left+r.width/2-(b.left+b.width/2),dy=r.top+r.height/2-(b.top+b.height/2);let rot=Math.atan2(dy,dx)*180/Math.PI;a.style.setProperty('--dx',dx+'px');a.style.setProperty('--dy',dy+'px');a.style.setProperty('--rot',rot+'deg');a.style.animation='arrowFly .55s ease-out forwards';setTimeout(()=>{if(Number(t.dataset.lane)===targetLane){score+=10;$('msg').className='message success';$('msg').textContent='🎯 İsabet! Aferin!';t.classList.add('hit');setTimeout(()=>{Q++;Q>=5?done():render()},650)}else{$('msg').className='message wrong';$('msg').textContent='❌ Yanlış hedef! Tekrar dene.';t.classList.add('wrong');setTimeout(()=>{locked=false;a.style.display='none';a.style.animation='none';t.classList.remove('wrong')},500)}},560)}document.querySelectorAll('.target').forEach(t=>t.onclick=()=>shoot(t));function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.5)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>{L=0;Q=0;score=0;$('celebrate').style.display='none';$('start').classList.remove('hidden')};</script></body></html>
