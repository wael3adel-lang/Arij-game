<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hedefi Vur</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.btn{border:0;border-radius:16px;padding:12px 20px;background:#1677d2;color:#fff;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation}.home{position:absolute;z-index:90;bottom:12px;left:12px}.restart{position:absolute;z-index:90;bottom:12px;right:12px;background:#f39a28}.hud{position:absolute;z-index:70;top:8px;left:50%;transform:translateX(-50%);width:min(920px,94%);background:#fffffff2;border-radius:22px;padding:9px 14px;text-align:center;box-shadow:0 8px 25px #0002}.title{font-size:clamp(26px,4vw,36px);font-weight:1000}.mission{font-size:clamp(17px,3vw,23px);font-weight:900}.stats{font-weight:900;font-size:14px}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#173c5c99;z-index:100}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:30px;border-radius:30px;text-align:center;box-shadow:0 20px 55px #0005}.big{font-size:70px}.hidden{display:none!important}body{background:linear-gradient(#bde9ff,#d9f5c6)}.game{height:100%;position:relative;background:linear-gradient(#9cddff 0 28%,#78bd69 28% 100%);overflow:hidden}.arena{position:absolute;left:8%;right:8%;top:145px;bottom:60px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lane{position:relative;border-radius:24px;background:linear-gradient(#ffffff22,#00000012);border:4px dashed #ffffff99;overflow:hidden}.laneHint{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#fff;font-weight:1000}.target{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#fff;border:7px solid #ef476f;font-size:30px;font-weight:1000;box-shadow:0 10px 20px #0003;cursor:pointer;z-index:20;touch-action:manipulation}.target:after{content:'🎈';position:absolute;opacity:.35;font-size:70px}.target span{position:relative;z-index:2}.arrow{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:58px;z-index:30;transition:none}.arrow.fly{animation:fly .55s ease-in forwards}@keyframes fly{to{bottom:72%;transform:translateX(-50%) scale(1.1)}}.message{position:absolute;z-index:70;top:112px;left:50%;transform:translateX(-50%);background:#ffffffdd;border-radius:15px;padding:8px 16px;font-weight:1000;white-space:nowrap}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🏹 Hedefi Vur</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="arena" id="arena"></div><div class="message" id="msg">Doğru hedefe dokun!</div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="big">🏹🎯</div><h1>Hedefi Vur</h1><p>Üç yoldan bir hedef seç. Ok kendiliğinden uçar.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎉🎯</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[['A','B','C'],'B'],[['D','E','F'],'F'],[['G','H','I'],'G'],[['J','K','L'],'K'],[['M','N','O'],'O'],[['P','R','S'],'R'],[['T','U','Ü'],'T'],[['Ç','Ş','Z'],'Ş'],[['A','E','İ'],'E'],[['O','Ö','U'],'U'],[['B','D','G'],'D'],[['K','L','M'],'L'],[['N','R','S'],'N'],[['Ç','G','H'],'H'],[['I','İ','J'],'İ'],[['M','Ş','T'],'T'],[['R','S','V'],'V'],[['U','Ü','Y'],'Y'],[['A','Ö','Z'],'Ö'],[['B','İ','K'],'K'],[['C','Ç','S'],'S'],[['D','E','F'],'E'],[['G','H','I'],'I'],[['J','M','N'],'M'],[['O','P','R'],'P']];let L=0,Q=0,score=0,locked=false;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){locked=false;$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;let d=qs[L*5+Q];$('mission').textContent='Doğru hedefi vur: '+d[1];$('msg').textContent='Bir hedefe dokun!';speak('Doğru hedefi vur '+d[1]);let a=$('arena');a.innerHTML='';d[0].forEach((x,i)=>{let lane=document.createElement('div');lane.className='lane';lane.innerHTML='<div class="laneHint">ŞERİT '+(i+1)+'</div>';let t=document.createElement('button');t.className='target';t.innerHTML='<span>'+x+'</span>';let ar=document.createElement('div');ar.className='arrow';ar.textContent='🏹';t.onclick=()=>shoot(t,ar,x,d[1]);lane.append(t,ar);a.appendChild(lane)})}function shoot(t,ar,x,target){if(locked)return;locked=true;ar.classList.add('fly');setTimeout(()=>{if(x===target){score+=10;$('score').textContent=score;$('msg').textContent='🎯 İsabet! Aferin!';speak('İsabet! Aferin!');t.style.transform='translateX(-50%) scale(1.25)';setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},450)}else{$('msg').textContent='❌ Iskaladın!';speak('Iskaladın. Tekrar dene');ar.classList.remove('fly');locked=false}},600)}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
