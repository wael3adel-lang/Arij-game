<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hedefi Vur</title><link rel="stylesheet" href="_common.css"><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(135deg,#d9f3ff,#e8ffe0)}</style></head><body><div class="game"><div class="hud"><div class="title">🏹 Hedefi Vur</div><div class="mission">Oku sürükle, doğru hedefe nişan al ve bırak.</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="message" id="msg">Doğru hedefi seç ve oku sürükle.</div><div id="field" style="width:min(850px,95%);height:330px;position:relative;display:flex;justify-content:space-around;align-items:center"><div class="target">🎯</div><div class="target">🎯</div><div class="target">🎯</div></div><div id="arrow" style="font-size:65px;cursor:grab;touch-action:none">🏹</div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🏹</div><h1>Hedefi Vur</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const tasks=[[1,'5'],[0,'3'],[2,'7'],[1,'9'],[0,'2']];let L=0,Q=0,score=0,drag=false;const $=id=>document.getElementById(id);function render(){let t=tasks[L];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('msg').textContent=`Doğru hedef: ${t[1]}`;document.querySelectorAll('.target').forEach((x,i)=>x.textContent=i===t[0]?'🎯':'⭕');$('arrow').textContent='🏹';$('arrow').style.position='relative';$('arrow').style.left='0';$('arrow').style.top='0';$('arrow').onpointerdown=e=>{drag=true;$('arrow').setPointerCapture(e.pointerId)};$('arrow').onpointermove=e=>{if(drag){$('arrow').style.transform=`translate(${e.offsetX-30}px,${e.offsetY-30}px)`}};$('arrow').onpointerup=e=>{drag=false;let ar=$('arrow').getBoundingClientRect();let hit=[...document.querySelectorAll('.target')].findIndex(x=>{let r=x.getBoundingClientRect();return ar.left<r.right&&ar.right>r.left&&ar.top<r.bottom&&ar.bottom>r.top});if(hit===t[0]){score+=10;Q++;$('msg').className='message success';$('msg').textContent='İsabet! Aferin!';setTimeout(()=>Q>=5?done():render(),550)}else{$('msg').className='message wrong';$('msg').textContent='Hedefi tekrar dene!';$('arrow').style.transform='none'}}}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
