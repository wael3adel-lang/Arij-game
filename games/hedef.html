<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hedefi Vur</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:linear-gradient(#91ddff,#79c96e)}#field{position:absolute;inset:140px 0 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 4%;overflow:hidden}.lane{position:relative;border:5px dashed #ffffffaa;border-bottom:0;border-top:0;display:flex;align-items:flex-start;justify-content:center;padding-top:70px}.laneTitle{position:absolute;top:12px;font-size:17px;font-weight:1000;color:#fff}.target{width:min(145px,27vw);height:min(145px,27vw);border-radius:50%;background:radial-gradient(circle,#fff 0 15%,#ef476f 16% 31%,#fff 32% 47%,#ef476f 48% 65%,#fff 66% 100%);box-shadow:0 10px 24px #0004;cursor:pointer;touch-action:manipulation;position:relative;display:grid;place-items:center;color:#18324a;font-size:40px;font-weight:1000}.target:after{content:"";position:absolute;inset:12px;border-radius:50%;border:3px solid #ffffffaa}.target.hit{animation:targetHit .5s}.target.wrong{animation:shake .35s}.targetField{position:absolute;inset:0}.bow{position:absolute;z-index:25;left:50%;bottom:12px;transform:translateX(-50%);width:170px;height:170px}.bow svg{width:100%;height:100%;filter:drop-shadow(0 10px 6px #0004)}.arrow{position:absolute;z-index:30;display:none;width:110px;height:24px;transform-origin:left center;pointer-events:none;filter:drop-shadow(0 5px 3px #0005)}.arrow svg{width:100%;height:100%}.targetPrompt{position:absolute;z-index:35;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:8px 24px;box-shadow:0 8px 20px #0003;text-align:center;font-weight:1000}.targetPrompt b{display:block;font-size:52px;color:#e34c4c}.message{position:absolute;z-index:36;top:145px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 18px;white-space:nowrap}.success{color:#15945d}.wrong{color:#d34848}@keyframes arrowFly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}@keyframes targetHit{50%{transform:scale(1.22)}to{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}@media(max-width:600px){#field{inset:145px 0 78px;padding:0 2%}.target{width:90px;height:90px;font-size:30px}.bow{width:135px;height:135px;bottom:8px}.arrow{width:85px}.targetPrompt{top:8px;font-size:16px}.targetPrompt b{font-size:44px}.message{top:140px;font-size:15px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🏹 Hedefi Vur</div><div class="mission">Doğru hedefe dokun, ok kendisi uçsun!</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div id="field"><div class="lane"><span class="laneTitle">ŞERİT 1</span><div class="target" data-lane="0"></div></div><div class="lane"><span class="laneTitle">ŞERİT 2</span><div class="target" data-lane="1"></div></div><div class="lane"><span class="laneTitle">ŞERİT 3</span><div class="target" data-lane="2"></div></div><div class="targetPrompt">Vurulacak hedef<b id="targetLetter">A</b></div><div class="bow" id="bow"><svg viewBox="0 0 170 170"><path d="M92 15 Q20 85 92 155" fill="none" stroke="#6d3d1f" stroke-width="14"/><path d="M92 15 Q155 85 92 155" fill="none" stroke="#8a532a" stroke-width="6"/><path d="M92 15 L92 155" stroke="#f1d49a" stroke-width="4"/></svg></div><div class="arrow" id="arrow"><svg viewBox="0 0 110 24"><line x1="2" y1="12" x2="98" y2="12" stroke="#5b321a" stroke-width="5"/><path d="M98 2 L108 12 L98 22" fill="none" stroke="#444" stroke-width="4"/><path d="M15 4 L5 12 L15 20" fill="none" stroke="#6d3d1f" stroke-width="3"/></svg></div></div><div class="message" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🏹</div><h1>Hedefi Vur</h1><p>Doğru hedefi seç. Ok kendisi uçacak!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>const letters=['A','E','K','M','B','G','T','Ç','S','F'];let L=0,Q=0,score=0,targetLane=0,targetLetter='',locked=false;const $=id=>document.getElementById(id);function render(){locked=false;targetLane=Math.floor(Math.random()*3);targetLetter=letters[(L*2+Q)%letters.length];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('targetLetter').textContent=targetLetter;$('msg').className='message';$('msg').textContent='Doğru harfi taşıyan hedefe dokun!';const vals=[targetLetter];while(vals.length<3){const x=letters[Math.floor(Math.random()*letters.length)];if(!vals.includes(x))vals.push(x)}vals.sort(()=>Math.random()-.5);document.querySelectorAll('.target').forEach((t,i)=>{t.textContent=vals[i];t.dataset.letter=vals[i];t.dataset.lane=i;t.className='target'});$('arrow').style.display='none';$('arrow').style.animation='none'}function shoot(t){if(locked)return;locked=true;const r=t.getBoundingClientRect(),b=$('bow').getBoundingClientRect(),f=document.getElementById('field').getBoundingClientRect(),a=$('arrow'),sx=b.left+b.width/2-f.left,sy=b.top+b.height/2-f.top,tx=r.left+r.width/2-f.left,ty=r.top+r.height/2-f.top,dx=tx-sx,dy=ty-sy;a.style.left=sx+'px';a.style.top=sy+'px';a.style.setProperty('--dx',dx+'px');a.style.setProperty('--dy',dy+'px');a.style.setProperty('--rot',Math.atan2(dy,dx)*180/Math.PI+'deg');a.style.display='block';a.style.animation='arrowFly .55s ease-out forwards';setTimeout(()=>{if(t.dataset.letter===targetLetter){score+=10;t.classList.add('hit');$('msg').className='message success';$('msg').textContent='🎯 İsabet! Harika!';setTimeout(()=>{Q++;Q>=5?done():render()},650)}else{t.classList.add('wrong');$('msg').className='message wrong';$('msg').textContent='❌ Yanlış hedef! Tekrar dene.';setTimeout(()=>{locked=false;a.style.display='none';a.style.animation='none';t.classList.remove('wrong')},500)}},580)}document.querySelectorAll('.target').forEach(t=>t.addEventListener('click',()=>shoot(t)));function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
