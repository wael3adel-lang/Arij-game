<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hedefi Vur</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:200;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:24px;padding:10px 14px;box-shadow:0 10px 30px #16425b30;text-align:center;backdrop-filter:blur(8px)}.title{font-size:clamp(25px,5vw,40px);font-weight:1000;color:#172f49}.mission{font-size:clamp(17px,3.4vw,25px);font-weight:900;margin-top:2px}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:clamp(15px,3vw,20px);flex-wrap:wrap;margin-top:6px}.btn{border:0;border-radius:22px;padding:14px 25px;color:#fff;font-size:clamp(17px,3vw,23px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #0002}.home{position:absolute;z-index:500;left:24px;bottom:14px;background:#1680d8}.restart{position:absolute;z-index:500;right:24px;bottom:14px;background:#f5a020}.feedback{position:absolute;z-index:450;left:50%;transform:translateX(-50%);top:130px;background:#fff;border-radius:24px;padding:13px 25px;font-size:clamp(18px,4vw,28px);font-weight:1000;box-shadow:0 12px 30px #0002;display:none;text-align:center}.success{color:#119a62}.error{color:#d62828}.celebrate{position:absolute;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(4px)}.panel{width:min(460px,90%);background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 70px #0005}.panel h1{margin:8px 0;font-size:38px}.panel p{font-size:20px;font-weight:800}.big{font-size:78px;filter:drop-shadow(0 12px 8px #0003)}.hidden{display:none!important}.confetti{position:absolute;width:11px;height:20px;top:42%;z-index:900;animation:conf 1s ease-out forwards;pointer-events:none}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}@media(max-width:600px){.hud{top:6px;padding:8px 10px}.home{left:20px;bottom:12px}.restart{right:20px;bottom:12px}.btn{padding:13px 19px;border-radius:20px}.feedback{top:118px;max-width:90%}}body{background:#7cc8ee}.game{background:linear-gradient(#72d5f5 0 24%,#79c56d 24% 100%)}.lanes{position:absolute;top:205px;bottom:88px;left:7%;right:7%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lane{position:relative;border:5px dashed #fff9;border-radius:28px;background:linear-gradient(#ffffff12,#ffffff05);overflow:hidden}.laneLabel{position:absolute;top:12px;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:1000}.target{position:absolute;top:100px;left:50%;transform:translateX(-50%);width:clamp(95px,18vw,135px);height:clamp(95px,18vw,135px);border-radius:50%;border:8px solid #fff;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#ff8eac 9% 28%,#ef476f 29% 60%,#b91e49 61%);display:grid;place-items:center;color:#1680d8;font-size:clamp(38px,8vw,60px);font-weight:1000;cursor:pointer;box-shadow:0 14px 28px #0004,inset 0 5px 12px #fff8;touch-action:manipulation}.target:after{content:"";position:absolute;inset:22%;border:7px solid #fff8;border-radius:50%}.bow{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);font-size:90px;z-index:120;filter:drop-shadow(0 12px 8px #0006)}.arrow{position:absolute;z-index:130;font-size:66px;left:50%;bottom:105px;transform:translate(-50%,0) rotate(-20deg);opacity:0;pointer-events:none}.arrow.fly{animation:fly .6s cubic-bezier(.2,.8,.2,1) forwards}.hit{animation:hit .35s ease forwards}.@keyframes fly{0%{opacity:1;transform:translate(-50%,0) rotate(-20deg)}100%{opacity:1;transform:translate(calc(var(--dx) - 50%),var(--dy)) rotate(-20deg)}}@keyframes hit{to{transform:translateX(-50%) scale(1.3);filter:brightness(1.5)}}@media(max-width:600px){.lanes{top:205px}.bow{font-size:70px}.arrow{font-size:54px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🏹 Hedefi Vur</div><div class="mission">Bir hedef seç, ok kendi kendine uçsun!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="feedback" id="msg"></div><div class="lanes" id="lanes"></div><div class="bow">🏹</div><div class="arrow" id="arrow">➶</div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🏹🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next" style="background:#1680d8">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[['D','E','F'],'F'],[['A','B','C'],'B'],[['G','H','I'],'H'],[['J','K','L'],'K'],[['M','N','O'],'O'],[['P','R','S'],'R'],[['T','U','Ü'],'Ü'],[['Ç','Ş','Z'],'Ç'],[['B','D','G'],'D'],[['K','L','M'],'L'],[['A','E','İ'],'İ'],[['O','Ö','U'],'Ö'],[['C','Ç','S'],'Ç'],[['Ğ','G','H'],'Ğ'],[['I','İ','J'],'J'],[['K','N','R'],'N'],[['L','O','P'],'P'],[['M','Ş','T'],'Ş'],[['R','S','V'],'S'],[['U','Ü','Y'],'Y'],[['A','Ö','Z'],'Z'],[['B','İ','K'],'İ'],[['Ç','D','E'],'E'],[['F','Ğ','H'],'Ğ'],[['J','M','N'],'M']];let L=0,Q=0,score=0,locked=false;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){locked=false;const d=qs[L*5+Q];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('msg').style.display='none';$('msg').textContent='';const lanes=$('lanes');lanes.innerHTML='';d[0].sort(()=>Math.random()-.5).forEach((x,i)=>{const lane=document.createElement('div');lane.className='lane';lane.innerHTML='<div class="laneLabel">ŞERİT '+(i+1)+'</div>';const t=document.createElement('button');t.className='target';t.textContent=x;t.dataset.value=x;t.dataset.lane=i;t.onclick=()=>shoot(t,i,x);lane.appendChild(t);lanes.appendChild(lane)})}function shoot(t,i,x){if(locked)return;locked=true;const arrow=$('arrow');const dx=(i-1)*31;const dy=-Math.max(210,window.innerHeight*.28);arrow.style.setProperty('--dx',dx+'vw');arrow.style.setProperty('--dy',dy+'px');arrow.classList.remove('fly');void arrow.offsetWidth;arrow.classList.add('fly');setTimeout(()=>{if(x===qs[L*5+Q][1]){t.classList.add('hit');score+=10;$('score').textContent=score;$('msg').className='feedback success';$('msg').textContent='🎯 İsabet! Aferin!';$('msg').style.display='block';speak('Aferin! Doğru!');setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},800)}else{$('msg').className='feedback error';$('msg').textContent='❌ Yanlış hedef!';$('msg').style.display='block';speak('Yanlış.');setTimeout(()=>{arrow.classList.remove('fly');render()},800)}},580)}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
