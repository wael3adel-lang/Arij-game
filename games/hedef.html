<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hedefi Vur</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e9f8ff,#fff8e9);color:#26364a;overflow:hidden}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94%,700px);display:flex;justify-content:space-between;z-index:10;font-weight:900}.pill{background:#fff;padding:9px 14px;border-radius:14px;box-shadow:0 5px 18px #0001}
#watermark{position:fixed;top:57px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#8da1b4;opacity:.55;z-index:9}
main{width:min(94%,680px);margin:auto;padding:105px 0 25px;text-align:center}h1{font-size:clamp(28px,7vw,43px);margin:0 0 7px;color:#2874c6}.instruction{font-size:clamp(18px,5vw,25px);font-weight:900;margin-bottom:16px}#message{height:35px;margin-top:14px;font-size:21px;font-weight:900}
#startScreen{position:fixed;inset:0;background:linear-gradient(180deg,#e9f8ff,#fff8e9);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.startBox{width:min(92%,440px);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 55px #0002}.startLogo{font-size:42px;font-weight:900;color:#2874c6}.startBox h2{margin:5px 0 10px;font-size:30px;color:#e48728}.startBox p{font-size:18px;line-height:1.5}#startButton{border:0;border-radius:18px;background:#2874c6;color:#fff;padding:16px 30px;font-size:21px;font-weight:900;cursor:pointer}
@media(max-height:700px){#hud{top:30px}main{padding-top:85px}}
#field{height:min(58vh,430px);position:relative;overflow:hidden;background:#eefbff;border-radius:28px}.target{position:absolute;width:66px;height:66px;border-radius:50%;background:#fff;border:7px solid #e45757;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;cursor:pointer;box-shadow:0 6px 15px #0002}</style></head><body>
<div id="startScreen"><div class="startBox"><div class="startLogo">ARİJ</div><h2>🏹 Hedefi Vur</h2><p>Hareket eden hedeflerden doğru harfi veya sayıyı vur!</p><button id="startButton">Başla</button></div></div>
<div id="hud"><div class="pill">🎯 <span id="task">Ş</span></div><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">60</span></div></div><div id="watermark">ARİJ OYUNU</div>
<main><h1>🏹 Hedefi Vur</h1><div class="instruction">Doğru hedefi vur: <span id="taskText">Ş</span></div><div id="field"></div><div id="message"></div></main>
<script>const sounds={click:new Audio("../sounds/click.wav"),correct:new Audio("../sounds/correct.wav"),wrong:new Audio("../sounds/wrong.wav")};function play(n){try{sounds[n].currentTime=0;sounds[n].play().catch(()=>{});}catch(e){}}
const field=document.getElementById("field");let s=0,t=60,cur,timer;
function newTask(){cur=Math.random()<.55?["Ş","Ç","B","K","M","A"][Math.floor(Math.random()*6)]:String(1+Math.floor(Math.random()*9));task.textContent=cur;taskText.textContent=cur;field.innerHTML="";let a=[cur];while(a.length<6){let v=Math.random()<.5?String.fromCharCode(65+Math.floor(Math.random()*8)):String(1+Math.floor(Math.random()*9));if(!a.includes(v))a.push(v)}a.sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement("button");b.className="target";b.textContent=v;b.style.left=(2+Math.random()*88)+"%";b.style.top=(3+Math.random()*82)+"%";b.onclick=()=>hit(v);field.appendChild(b)})}
function hit(v){play("click");if(v===cur){s++;score.textContent=s;play("correct");newTask()}else{message.textContent="Yanlış hedef!";play("wrong")}}
function animate(){document.querySelectorAll(".target").forEach(b=>{b.style.left=(2+Math.random()*88)+"%";b.style.top=(3+Math.random()*82)+"%"})}
function finish(){clearInterval(timer);message.textContent="🏆 Bitti! "+s+" doğru hedef"}function start(){startScreen.style.display="none";newTask();setInterval(animate,900);timer=setInterval(()=>{t--;time.textContent=t;if(t<=0)finish()},1000)}startButton.onclick=start;
</script></body></html>
