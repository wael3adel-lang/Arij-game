<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balonları Say</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e9f8ff,#fff8e9);color:#26364a;overflow:hidden}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94%,700px);display:flex;justify-content:space-between;z-index:10;font-weight:900}.pill{background:#fff;padding:9px 14px;border-radius:14px;box-shadow:0 5px 18px #0001}
#watermark{position:fixed;top:57px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#8da1b4;opacity:.55;z-index:9}
main{width:min(94%,680px);margin:auto;padding:105px 0 25px;text-align:center}h1{font-size:clamp(28px,7vw,43px);margin:0 0 7px;color:#2874c6}.instruction{font-size:clamp(18px,5vw,25px);font-weight:900;margin-bottom:16px}#message{height:35px;margin-top:14px;font-size:21px;font-weight:900}
#startScreen{position:fixed;inset:0;background:linear-gradient(180deg,#e9f8ff,#fff8e9);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.startBox{width:min(92%,440px);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 55px #0002}.startLogo{font-size:42px;font-weight:900;color:#2874c6}.startBox h2{margin:5px 0 10px;font-size:30px;color:#e48728}.startBox p{font-size:18px;line-height:1.5}#startButton{border:0;border-radius:18px;background:#2874c6;color:#fff;padding:16px 30px;font-size:21px;font-weight:900;cursor:pointer}
@media(max-height:700px){#hud{top:30px}main{padding-top:85px}}
#area{height:min(52vh,380px);position:relative;background:#fff;border-radius:28px;overflow:hidden}.ball{position:absolute;font-size:54px;cursor:pointer}.options{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap}.num{border:0;background:#fff;border-radius:18px;padding:13px 24px;font-size:27px;font-weight:900;color:#2874c6;box-shadow:0 6px 18px #0001;cursor:pointer}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body>
<div id="startScreen"><div class="startBox"><div class="startLogo">ARİJ</div><h2>🎈 Balonları Say</h2><p>Balonları say ve doğru sayıyı seç!</p><button id="startButton">Başla</button></div></div>
<div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">60</span></div><div class="pill">🎯 <span id="round">1</span>/10</div></div><div id="watermark">ARİJ OYUNU</div>
<main><h1>🎈 Balonları Say</h1><div class="instruction">Kaç balon var?</div><div id="area"></div><div class="options" id="options"></div><div id="message"></div></main>
<script>const sounds={click:new Audio("../sounds/click.wav"),correct:new Audio("../sounds/correct.wav"),wrong:new Audio("../sounds/wrong.wav")};function play(n){try{sounds[n].currentTime=0;sounds[n].play().catch(()=>{});}catch(e){}}
let n,r=0,s=0,t=60,timer,lock=false;
function next(){if(r>=10)return finish();lock=false;r++;round.textContent=r;area.innerHTML="";n=2+Math.floor(Math.random()*7);for(let i=0;i<n;i++){let b=document.createElement("div");b.className="ball";b.textContent="🎈";b.style.left=(4+Math.random()*88)+"%";b.style.top=(4+Math.random()*78)+"%";b.onclick=()=>{b.remove();play("click")};area.appendChild(b)}options.innerHTML="";let a=[n];while(a.length<3){let v=Math.max(1,n+Math.floor(Math.random()*5)-2);if(!a.includes(v))a.push(v)}a.sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement("button");b.className="num";b.textContent=v;b.onclick=()=>choose(v);options.appendChild(b)})}
function choose(v){if(lock)return;play("click");if(v===n){lock=true;s++;score.textContent=s;message.textContent="🎉 Doğru!";play("correct");setTimeout(next,600)}else{message.textContent="Tekrar say!";play("wrong")}}
function finish(){clearInterval(timer);message.textContent="🏆 Bitti! "+s+" / 10"}function start(){startScreen.style.display="none";next();timer=setInterval(()=>{t--;time.textContent=t;if(t<=0)finish()},1000)}startButton.onclick=start;
</script></body></html>
