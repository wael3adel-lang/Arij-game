<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonları Say</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:linear-gradient(#a8e9ff,#e7faff)}#play{position:absolute;inset:130px 0 70px;overflow:hidden}.missionBig{position:absolute;z-index:35;top:8px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:7px 25px;text-align:center;box-shadow:0 8px 20px #0003;font-size:20px;font-weight:1000}.missionBig b{font-size:52px;color:#e95c38;display:block;line-height:1}.balloon{position:absolute;width:82px;height:102px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;color:#fff;font-size:29px;font-weight:1000;text-shadow:0 2px 4px #0005;box-shadow:inset -12px -14px 18px #0002,0 8px 16px #0002;cursor:pointer;animation:float 3.8s ease-in-out infinite;touch-action:manipulation}.balloon:before{content:"";position:absolute;top:13px;left:18px;width:28px;height:14px;background:#fff8;border-radius:50%;transform:rotate(-20deg)}.balloon:after{content:"";position:absolute;bottom:-35px;width:2px;height:36px;background:#777}.balloon.popped{animation:popBall .3s forwards}.counter{position:absolute;z-index:40;left:50%;transform:translateX(-50%);bottom:10px;background:#fff;border-radius:18px;padding:8px 22px;font-size:20px;font-weight:1000;box-shadow:0 6px 14px #0002}.finish{position:absolute;z-index:50;left:50%;transform:translateX(-50%);bottom:67px;min-width:145px}.message{position:absolute;z-index:45;top:142px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 18px;white-space:nowrap}.success{color:#15945d}.wrong{color:#d34848}@keyframes float{0%,100%{transform:translateY(-8px) rotate(-1deg)}50%{transform:translateY(8px) rotate(1deg)}}@keyframes popBall{30%{transform:scale(1.18)}100%{transform:scale(0);opacity:0}}@media(max-width:600px){#play{inset:122px 0 70px}.missionBig{font-size:17px;padding:6px 20px}.missionBig b{font-size:47px}.balloon{width:70px;height:88px;font-size:26px}.counter{font-size:17px}.finish{bottom:66px}.message{top:138px;font-size:14px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonları Say</div><div class="mission">Doğru sayıda balon patlat.</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div id="play"><div class="missionBig">Kaç balon patlat?<b id="need">1</b></div><div id="balloons"></div><div class="counter" id="counter">Patlatılan: 0 / 1</div><div class="message" id="msg"></div></div><button class="btn green finish" id="finish">✅ Bitti</button><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎈</div><h1>Balonları Say</h1><p>İstenen sayı kadar balon patlat, sonra Bitti’ye bas.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>let L=0,Q=0,score=0,need=1,total=3,popped=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;popped=0;need=1+L+Q;total=need+2+Math.floor(Math.random()*2);$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('need').textContent=need;$('counter').textContent='Patlatılan: 0 / '+need;$('msg').className='message';$('msg').textContent='Tam '+need+' balon patlat ve Bitti’ye bas.';$('balloons').innerHTML='';const cols=['#ef476f','#f8961e','#06d6a0','#118ab2','#8a5cf6','#e76f51','#f9c74f','#ec4899'];const spots=[];for(let i=0;i<total;i++){let x,y,ok;do{x=7+Math.random()*84;y=18+Math.random()*65;ok=spots.every(p=>Math.hypot(p.x-x,p.y-y)>14)}while(!ok);spots.push({x,y});const b=document.createElement('button');b.className='balloon';b.style.left=x+'%';b.style.top=y+'%';b.style.background=cols[i%cols.length];b.style.animationDelay=(-Math.random()*2)+'s';b.onclick=()=>{if(locked||b.classList.contains('popped'))return;if(popped<need){b.classList.add('popped');popped++;$('counter').textContent='Patlatılan: '+popped+' / '+need}else{$('msg').className='message wrong';$('msg').textContent='❌ العدد المطلوب اكتمل. اضغط Bitti.'}};$('balloons').appendChild(b)}}$('finish').onclick=()=>{if(locked)return;if(popped===need){locked=true;score+=10;$('msg').className='message success';$('msg').textContent='🎉 Doğru! Harika!';setTimeout(()=>{Q++;Q>=5?done():render()},600)}else{$('msg').className='message wrong';$('msg').textContent='❌ Önce tam '+need+' balon patlat.'}};function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
