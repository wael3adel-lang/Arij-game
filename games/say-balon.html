<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonları Say</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#14263d}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:rgba(255,255,255,.94);border-radius:24px;padding:10px 14px;text-align:center;box-shadow:0 10px 30px rgba(20,40,60,.18);border:2px solid rgba(255,255,255,.9)}.title{font-size:clamp(25px,5vw,38px);font-weight:1000}.mission{font-size:clamp(16px,3.2vw,23px);font-weight:900;margin-top:2px}.stats{font-size:clamp(13px,2.5vw,17px);font-weight:900;margin-top:5px}.btn{border:0;border-radius:18px;padding:13px 20px;background:#1677d2;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home,.restart{position:absolute;z-index:200;bottom:14px}.home{left:20px}.restart{right:20px;background:#f59b23;box-shadow:0 5px 0 #c9760e}.feedback{position:absolute;z-index:150;top:120px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff;font-size:20px;font-weight:1000;box-shadow:0 8px 24px #0002;display:none}.success{color:#0b9f6a}.error{color:#d62828}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,39,62,.38);z-index:300}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:28px;border-radius:30px;text-align:center;box-shadow:0 25px 60px #0005}.big{font-size:76px}.hidden{display:none!important}.shadow3d{filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
body{background:linear-gradient(#9ce7ff,#dff8ff)}.field{position:absolute;inset:120px 0 96px}.balloon{position:absolute;width:90px;height:115px;border-radius:50% 50% 48% 48%;border:6px solid #fff;box-shadow:0 12px 22px #0002;cursor:pointer;touch-action:manipulation}.balloon:after{content:'';position:absolute;left:50%;bottom:-55px;width:2px;height:55px;background:#6b6b6b}.balloon:before{content:'';position:absolute;inset:10px 18px auto 18px;height:24px;border-radius:50%;background:#fff6}.popped{animation:pop .35s ease forwards}@keyframes pop{to{transform:scale(1.5);opacity:0}}.doneBtn{position:absolute;z-index:220;bottom:16px;left:50%;transform:translateX(-50%);background:#20b86a;box-shadow:0 5px 0 #0f8d50}@media(max-width:600px){.balloon{width:76px;height:98px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonları Say</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="field" id="field"></div><div class="feedback" id="msg"></div><div id="counter" style="position:absolute;bottom:92px;left:50%;transform:translateX(-50%);z-index:210;background:#fff;border-radius:20px;padding:10px 22px;font-size:20px;font-weight:1000;box-shadow:0 8px 20px #0002"></div><button class="btn doneBtn" id="doneBtn">✅ Bitti</button><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎈🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const levels=[1,2,3,4,5],colors=['#ef476f','#ff9f1c','#06d6a0','#118ab2','#8b5cf6','#f06aa8'];let L=0,Q=0,score=0,target=1,popped=0;const $=id=>document.getElementById(id);function render(){target=levels[L]+Q;let total=target+2+Math.floor(Math.random()*2);popped=0;$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('mission').textContent=target+' balon patlat!';$('counter').textContent='Patlatılan: 0 / '+target;$('msg').style.display='none';let f=$('field');f.innerHTML='';let spots=[];for(let i=0;i<total;i++){let tries=0,x,y,ok=false;while(tries++<100&&!ok){x=6+Math.random()*82;y=5+Math.random()*76;ok=spots.every(p=>Math.hypot((x-p.x)*1.2,y-p.y)>15)}spots.push({x,y});let b=document.createElement('button');b.className='balloon';b.style.left=x+'%';b.style.top=y+'%';b.style.background=colors[Math.floor(Math.random()*colors.length)];b.onclick=()=>{if(b.classList.contains('popped'))return;b.classList.add('popped');popped++;$('counter').textContent='Patlatılan: '+popped+' / '+target};f.appendChild(b)}}function finish(){if(popped===target){score+=20;$('score').textContent=score;$('msg').style.display='block';$('msg').className='feedback success';$('msg').textContent='✅ Doğru! Aferin!';setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},850)}else{$('msg').style.display='block';$('msg').className='feedback error';$('msg').textContent='❌ Henüz doğru değil. Gerekli sayıyı patlat.'}}$('doneBtn').onclick=finish;$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
