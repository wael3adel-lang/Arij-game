<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonları Say</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:200;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:24px;padding:10px 14px;box-shadow:0 10px 30px #16425b30;text-align:center;backdrop-filter:blur(8px)}.title{font-size:clamp(25px,5vw,40px);font-weight:1000;color:#172f49}.mission{font-size:clamp(17px,3.4vw,25px);font-weight:900;margin-top:2px}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:clamp(15px,3vw,20px);flex-wrap:wrap;margin-top:6px}.btn{border:0;border-radius:22px;padding:14px 25px;color:#fff;font-size:clamp(17px,3vw,23px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #0002}.home{position:absolute;z-index:500;left:24px;bottom:14px;background:#1680d8}.restart{position:absolute;z-index:500;right:24px;bottom:14px;background:#f5a020}.feedback{position:absolute;z-index:450;left:50%;transform:translateX(-50%);top:130px;background:#fff;border-radius:24px;padding:13px 25px;font-size:clamp(18px,4vw,28px);font-weight:1000;box-shadow:0 12px 30px #0002;display:none;text-align:center}.success{color:#119a62}.error{color:#d62828}.celebrate{position:absolute;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(4px)}.panel{width:min(460px,90%);background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 70px #0005}.panel h1{margin:8px 0;font-size:38px}.panel p{font-size:20px;font-weight:800}.big{font-size:78px;filter:drop-shadow(0 12px 8px #0003)}.hidden{display:none!important}.confetti{position:absolute;width:11px;height:20px;top:42%;z-index:900;animation:conf 1s ease-out forwards;pointer-events:none}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}@media(max-width:600px){.hud{top:6px;padding:8px 10px}.home{left:20px;bottom:12px}.restart{right:20px;bottom:12px}.btn{padding:13px 19px;border-radius:20px}.feedback{top:118px;max-width:90%}}body{background:#c5f3ff}.game{background:linear-gradient(#7adbf8,#d8f7ff)}.question{position:absolute;z-index:210;top:155px;left:50%;transform:translateX(-50%);background:#fff;border-radius:25px;padding:12px 28px;font-size:clamp(23px,5vw,34px);font-weight:1000;box-shadow:0 10px 25px #0002;white-space:nowrap}.question b{color:#e43c67;font-size:1.25em}.field{position:absolute;inset:235px 0 98px;overflow:hidden}.balloon{position:absolute;width:clamp(76px,15vw,110px);height:clamp(98px,19vw,138px);border-radius:52%;border:7px solid #fff;box-shadow:inset 8px 8px 15px #fff5,inset -9px -10px 16px #0002,0 14px 24px #0003;cursor:pointer;touch-action:manipulation}.balloon:before{content:"";position:absolute;left:18%;top:10%;width:30%;height:24%;border-radius:50%;background:#fff8}.balloon:after{content:"";position:absolute;left:50%;bottom:-55px;width:3px;height:55px;background:#777}.popped{animation:pop .32s ease forwards}.counter{position:absolute;z-index:230;bottom:92px;left:50%;transform:translateX(-50%);background:#fff;border-radius:20px;padding:10px 22px;font-size:clamp(18px,4vw,24px);font-weight:1000;box-shadow:0 8px 18px #0002}.doneBtn{position:absolute;z-index:520;bottom:92px;left:50%;transform:translateX(-50%);background:#1ebc69}.wrongFlash{animation:shake .3s ease}@keyframes pop{to{transform:scale(1.4);opacity:0}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:600px){.question{top:145px}.field{inset:220px 0 105px}.doneBtn{bottom:92px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonları Say</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="question" id="question"></div><div class="field" id="field"></div><div class="counter" id="counter"></div><div class="feedback" id="msg"></div><button class="btn doneBtn" id="doneBtn">✅ Bitti</button><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎈🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next" style="background:#1680d8">Sonraki Seviye ➡️</button></div></div></div><script>const colors=['#ef476f','#ff9f1c','#06d6a0','#118ab2','#8b5cf6','#f06aa8'];let L=0,Q=0,score=0,target=1,popped=0,checked=false;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){checked=false;popped=0;target=L+1;const total=target+2+(Q%2);$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('mission').textContent='Sadece sayıları öğrenelim';$('question').innerHTML='Kaç balon patlatmalısın? <b>'+target+'</b>';$('counter').textContent='Patlatılan: 0 / '+target;$('msg').style.display='none';const f=$('field');f.innerHTML='';const spots=[];for(let i=0;i<total;i++){let x,y,tries=0;do{x=5+Math.random()*85;y=5+Math.random()*78;tries++}while(spots.some(p=>Math.hypot((x-p.x)*1.15,y-p.y)<17)&&tries<100);spots.push({x,y});const b=document.createElement('button');b.className='balloon';b.style.left=x+'%';b.style.top=y+'%';b.style.background=colors[(i+Q+L)%colors.length];b.onclick=()=>{if(checked||b.classList.contains('popped'))return;b.classList.add('popped');popped++;$('counter').textContent='Patlatılan: '+popped+' / '+target};f.appendChild(b)}}function finish(){if(checked)return;if(popped===target){checked=true;score+=20;$('score').textContent=score;$('msg').className='feedback success';$('msg').textContent='✅ Doğru! Aferin!';$('msg').style.display='block';speak('Doğru! Aferin!');setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},850)}else{$('msg').className='feedback error';$('msg').textContent='❌ Sayıyı kontrol et ve Bittiye bas.';$('msg').style.display='block'}}$('doneBtn').onclick=finish;$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
