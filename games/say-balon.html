<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonları Say</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#fff4dc);color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.target{font-size:1.5em;color:#e95c38}.stats{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:#35c98a}.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:white;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.red{background:#db5353}.content{position:absolute;inset:130px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{min-width:90px;min-height:72px;border:0;border-radius:20px;background:white;box-shadow:0 8px 18px #0002;font-size:26px;font-weight:1000;cursor:pointer;padding:12px;touch-action:manipulation}.choice:hover{transform:translateY(-2px)}.picture{font-size:110px;filter:drop-shadow(0 8px 5px #0002)}.message{min-height:35px;font-weight:1000;font-size:20px;margin:8px}.success{color:#15945d}.wrong{color:#d34848}.celebrate{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.confetti{position:absolute;width:11px;height:20px;top:-30px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}.home{position:absolute;z-index:30;left:12px;bottom:12px}.restart{position:absolute;z-index:30;right:12px;bottom:12px}.small{font-size:14px;color:#668}.hidden{display:none!important}@media(max-width:600px){.hud{top:5px}.content{inset:125px 0 60px}.choice{min-width:78px;min-height:64px;font-size:22px}.picture{font-size:82px}.panel{padding:22px}.btn{font-size:16px}}
#play{position:absolute;inset:125px 0 65px;overflow:hidden}.balloon{position:absolute;width:88px;height:108px;border-radius:50% 50% 48% 48%;background:#ef476f;box-shadow:inset -12px -14px 20px #0002,0 8px 18px #0002;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;color:transparent}.balloon:before{content:"";position:absolute;top:14px;left:18px;width:30px;height:15px;background:#fff6;border-radius:50%;transform:rotate(-18deg)}.balloon:after{content:"";position:absolute;bottom:-42px;width:2px;height:43px;background:#777}.balloon.popped{animation:pop .25s forwards}.counter{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;padding:10px 28px;border-radius:22px;font-size:24px;font-weight:1000;z-index:20}.finish{position:absolute;z-index:40;bottom:70px;left:50%;transform:translateX(-50%);width:auto;min-width:130px;margin:0}.game>.message{position:absolute;top:180px;left:50%;transform:translateX(-50%);z-index:30;background:#fff;padding:8px 18px;border-radius:18px;white-space:nowrap}.success{color:#15945d}.wrong{color:#d34848}@keyframes pop{to{transform:scale(1.35);opacity:0}}@media(max-width:600px){.balloon{width:76px;height:94px}.counter{font-size:20px}.finish{bottom:68px}.game>.message{top:172px;font-size:16px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game" style="background:linear-gradient(#a9eaff,#dff8ff)"><div class="hud"><div class="title">🎈 Balonları Say</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div id="play"><div id="balloons"></div><div class="counter" id="counter">Patlatılan: 0</div><div class="message" id="msg"></div></div><button class="btn green finish" id="finish">✅ Bitti</button><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎈</div><h1>Balonları Say</h1><p>İstenen sayıda balon patlat.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>let L=0,Q=0,score=0,need=1,total=5,popped=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;popped=0;need=1+L;total=need+2+Math.floor(Math.random()*3);$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('mission').innerHTML='<b>'+need+'</b> balon patlat!';$('msg').textContent='Tam '+need+' balon seç ve sonra Bitti’ye bas.';$('counter').textContent='Patlatılan: 0 / '+need;$('balloons').innerHTML='';let positions=[];for(let i=0;i<total;i++){let b=document.createElement('button');b.className='balloon';let x,y,tries=0;do{x=8+Math.random()*84;y=12+Math.random()*72;tries++}while(positions.some(p=>Math.hypot(p.x-x,p.y-y)<15)&&tries<40);positions.push({x,y});b.style.left=x+'%';b.style.top=y+'%';b.onclick=()=>{if(locked||b.classList.contains('popped'))return;if(popped>=need){$('msg').className='message wrong';$('msg').textContent='❌ Yeter! Bitti’ye bas.';return}b.classList.add('popped');popped++;$('counter').textContent='Patlatılan: '+popped+' / '+need};$('balloons').appendChild(b)}}$('finish').onclick=()=>{if(locked)return;if(popped===need){locked=true;score+=10;$('msg').className='message success';$('msg').textContent='🎉 إجابة صحيحة!';Q++;setTimeout(()=>Q>=5?done():render(),550)}else{$('msg').className='message wrong';$('msg').textContent='❌ Tam '+need+' balon seçmelisin.'}};function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.5)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>{L=0;Q=0;score=0;$('celebrate').style.display='none';$('start').classList.remove('hidden')};</script></body></html>
