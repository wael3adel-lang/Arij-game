<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonları Patlat</title><link rel="stylesheet" href="_common.css"><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(#aee9ff,#f7d9ff)}</style></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonları Patlat</div><div class="mission">İstenen sayıda balonu patlat.</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="message" id="msg">Gerekli sayıda balonu patlat.</div><div class="choices" id="balloons"></div><button class="btn green" id="finish">Bitti ✓</button></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎈</div><h1>Balonları Patlat</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const nums=[[1,3],[2,5],[3,7],[4,9],[5,10]];let L=0,Q=0,score=0,popped=0;const $=id=>document.getElementById(id);function render(){let [need,total]=nums[L];popped=0;$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('msg').innerHTML=`<b style="font-size:34px">${need}</b> balon patlat!`;$('balloons').innerHTML='';for(let i=0;i<total;i++){let b=document.createElement('button');b.className='choice';b.style.cssText='border-radius:50%;width:85px;height:100px;background:hsl('+(i*36+10)+' 80% 65%)';b.textContent='🎈';b.onclick=()=>{if(b.dataset.popped)return;b.dataset.popped='1';b.textContent='💥';popped++;if(popped>need){$('msg').className='message wrong';$('msg').textContent='Fazla balon patlattın! Yeniden dene.'}};$('balloons').append(b)}}$('finish').onclick=()=>{let need=nums[L][0];if(popped===need){score+=10;Q++;$('msg').className='message success';$('msg').textContent='Harika!';setTimeout(()=>Q>=5?done():render(),450)}else{$('msg').className='message wrong';$('msg').textContent=`Tam ${need} balon patlatmalısın.`}};function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
