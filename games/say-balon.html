<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonları Say</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.btn{border:0;border-radius:16px;padding:12px 20px;background:#1677d2;color:#fff;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home{position:absolute;z-index:90;bottom:12px;left:12px}.restart{position:absolute;z-index:90;bottom:12px;right:12px;background:#f39a28;box-shadow:0 5px 0 #c97713}.hud{position:absolute;z-index:70;top:8px;left:50%;transform:translateX(-50%);width:min(920px,94%);background:#fffffff2;border-radius:22px;padding:9px 14px;text-align:center;box-shadow:0 8px 25px #0002}.title{font-size:clamp(26px,4vw,36px);font-weight:1000}.mission{font-size:clamp(17px,3vw,23px);font-weight:900}.stats{font-weight:900;font-size:14px}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#173c5c99;z-index:100}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:30px;border-radius:30px;text-align:center;box-shadow:0 20px 55px #0005}.big{font-size:70px}.hidden{display:none!important}body{background:linear-gradient(#c5f4ff,#fff0d5)}.game{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,#fff 0,#dff8ff 48%,#b8e7ff 100%)}.field{position:absolute;inset:120px 0 105px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:18px;padding:28px}.balloon{width:94px;height:116px;border-radius:50% 50% 46% 46%;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:1000;border:5px solid #fff;box-shadow:0 10px 18px #0002;cursor:pointer;position:relative;transition:.2s;touch-action:manipulation}.balloon:after{content:"";position:absolute;bottom:-39px;width:2px;height:39px;background:#777}.balloon.popped{animation:pop .3s ease forwards}.balloon.wrong{animation:shake .25s ease}.counter{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:10px 18px;font-weight:1000;box-shadow:0 5px 18px #0002}.message{position:absolute;z-index:60;top:112px;left:50%;transform:translateX(-50%);background:#ffffffdd;border-radius:15px;padding:8px 16px;font-weight:1000;white-space:nowrap}.doneBtn{position:absolute;z-index:95;left:50%;bottom:12px;transform:translateX(-50%);background:#2bb673;box-shadow:0 5px 0 #168353}@keyframes pop{50%{transform:scale(1.35) rotate(8deg);opacity:.7}100%{transform:scale(0);opacity:0}}@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonları Say</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="field" id="field"></div><div class="counter" id="counter"></div><div class="message" id="msg"></div><button class="btn doneBtn" id="doneBtn">✅ Bitti</button><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="big">🎈🔢</div><h1>Balonları Say</h1><p>İstenen sayı kadar doğru renkte balonu patlat.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎉🏆</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const levels=[1,2,3,4,5],palette=[['#ef476f','Kırmızı'],['#ff9f1c','Turuncu'],['#06d6a0','Yeşil'],['#118ab2','Mavi'],['#8b5cf6','Mor'],['#e85d75','Pembe']];let L=0,Q=0,score=0,need=1,popped=0,locked=false,currentColor='',currentColorName='';const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=[...speechSynthesis.getVoices()].find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){locked=false;need=levels[L];popped=0;let colorIndex=(Q+L*2)%palette.length;currentColor=palette[colorIndex][0];currentColorName=palette[colorIndex][1];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('mission').textContent=need+' '+currentColorName.toLowerCase()+' balon patlat!';$('counter').textContent='Patlatılan: 0 / '+need;$('msg').textContent='Doğru renkteki balonları seç.';let f=$('field');f.innerHTML='';let total=need+4+(Q%3);let arr=[];for(let i=0;i<total;i++)arr.push(i<need?'target':'other');arr.sort(()=>Math.random()-.5);arr.forEach((type,i)=>{let b=document.createElement('div');b.className='balloon';let p=type==='target'?palette[colorIndex]:palette[(colorIndex+1+i)%palette.length];b.style.background=p[0];b.dataset.correct=type==='target'?'1':'0';b.textContent='🎈';b.setAttribute('aria-label',p[1]+' balon');b.onclick=()=>pop(b);f.appendChild(b)});speak(need+' '+currentColorName.toLowerCase()+' balon patlat')}function pop(b){if(locked||b.classList.contains('popped'))return;if(b.dataset.correct!=='1'){b.classList.add('wrong');$('msg').textContent='❌ Bu renkte değil!';speak('Yanlış renk');setTimeout(()=>b.classList.remove('wrong'),280);return}popped++;b.classList.add('popped');$('counter').textContent='Patlatılan: '+popped+' / '+need;speak('Pop');if(popped===need){locked=true;score+=10;$('score').textContent=score;$('msg').textContent='🎉 Harika!';speak('Harika!');setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı: '+need+' balon!';$('celebrate').style.display='flex'}else render()},550)}}$('doneBtn').onclick=()=>{if(locked)return;if(popped<need){$('msg').textContent='Önce '+need+' balon patlat!';speak('Önce görevi tamamla');return}locked=true;Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()};$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
