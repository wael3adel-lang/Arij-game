<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hece Oyunu</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:linear-gradient(135deg,#e8f9ff,#fff6e2)}.content{position:absolute;inset:132px 0 65px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}.picture{width:min(220px,48vw);height:145px;display:grid;place-items:center}.picture svg{width:100%;height:100%;filter:drop-shadow(0 12px 7px #0002)}.wordTitle{font-size:21px;font-weight:1000}.listen{border:0;border-radius:50%;width:58px;height:58px;background:#23a86b;color:#fff;font-size:27px;box-shadow:0 7px 15px #0003;cursor:pointer;margin:5px}.slots{min-height:76px;width:min(680px,90%);display:flex;gap:8px;justify-content:center;align-items:center;background:#fff;border-radius:22px;box-shadow:0 8px 20px #0002;padding:10px;flex-wrap:wrap}.slot{min-width:76px;padding:10px 14px;border-radius:15px;background:#eef6fb;color:#0876a8;font-size:25px;font-weight:1000}.slot.done{background:#d7f7e7;color:#15945d}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:720px;margin-top:12px}.choice{min-width:82px;height:62px;border:0;border-radius:18px;background:#fff;box-shadow:0 8px 18px #0002;font-size:24px;font-weight:1000;color:#0876d1;cursor:pointer}.choice.used{opacity:.35;pointer-events:none}.actions{display:flex;align-items:center;gap:10px}.clear{border:0;border-radius:15px;padding:10px 18px;background:#eef6fb;color:#0876a8;font-weight:1000;font-size:16px;cursor:pointer}@media(max-width:600px){.content{inset:125px 0 70px}.picture{height:112px}.slots{min-height:64px}.slot{min-width:60px;font-size:20px;padding:8px}.choice{min-width:68px;height:54px;font-size:21px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🔤 Hece Oyunu</div><div class="mission">Heceleri doğru sırayla seç.</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="pic"></div><div class="wordTitle" id="wordTitle"></div><div class="actions"><button class="listen" id="listen">🔊</button><button class="clear" id="clear">Temizle</button></div><div class="slots" id="slots"></div><div class="choices" id="choices"></div><div class="message" id="msg"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🔤</div><h1>Hece Oyunu</h1><p>Kelimeyi hecelerine ayır.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>const words=[[['cat','KEDİ',['KE','Dİ']],['table','MASA',['MA','SA']],['door','KAPI',['KA','PI']],['apple','ELMA',['EL','MA']],['fish','BALIK',['BA','LIK']]],[['rabbit','TAVŞAN',['TAV','ŞAN']],['cherry','ÇİLEK',['Çİ','LEK']],['bus','OTOBÜS',['O','TO','BÜS']],['flower','ÇİÇEK',['Çİ','ÇEK']],['house','EVLER',['EV','LER']]],[['lion','ASLANLAR',['AS','LAN','LAR']],['watermelon','KARPUZ',['KAR','PUZ']],['bicycle','BİSİKLET',['Bİ','SİK','LET']],['giraffe','ZÜRAFA',['ZÜ','RA','FA']],['elephant','FİLLER',['FİL','LER']]],[['crocodile','TİMSAHLAR',['TİM','SAH','LAR']],['squirrel','SİNCAPLAR',['SİN','CAP','LAR']],['giraffe2','ZÜRAFALAR',['ZÜ','RA','FA','LAR']],['watermelon2','KARPUZLAR',['KAR','PUZ','LAR']],['sunflower','AYÇİÇEĞİ',['AY','Çİ','ÇE','Ğİ']]],[['airplane','UÇAKLAR',['U','ÇAK','LAR']],['butterfly','KELEBEKLER',['KE','LE','BEK','LER']],['strawberry','ÇİLEKLER',['Çİ','LEK','LER']],['book','KİTAPLAR',['Kİ','TAP','LAR']],['school','OKULLAR',['O','KUL','LAR']]]];let L=0,Q=0,score=0,item,step=0,locked=false;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';const v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function svgFor(){return `<svg viewBox="0 0 220 150"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d9e7f0"/></linearGradient></defs><circle cx="110" cy="75" r="58" fill="url(#h)" stroke="#247da2" stroke-width="4"/><circle cx="87" cy="66" r="7" fill="#18324a"/><circle cx="133" cy="66" r="7" fill="#18324a"/><path d="M82 94 Q110 112 138 94" fill="none" stroke="#247da2" stroke-width="5"/></svg>`}function render(){item=words[L][Q];step=0;locked=false;$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('pic').innerHTML=svgFor();$('wordTitle').textContent='Kelime: '+item[1];$('slots').innerHTML=item[2].map((_,i)=>`<span class="slot" id="slot${i}">?</span>`).join('');const pool=[...item[2]];while(pool.length<Math.min(item[2].length+2,7)){const x=['BA','RA','KE','LE','TA','MA','LIK','ŞAN','PEK','GÜ','LÜM','SAH','Bİ','SİK','LET','LER'][Math.floor(Math.random()*16)];if(!pool.includes(x))pool.push(x)}pool.sort(()=>Math.random()-.5);$('choices').innerHTML=pool.map(x=>`<button class="choice">${x}</button>`).join('');$('msg').className='message';$('msg').textContent='İlk heceyi seç.';[...$('choices').children].forEach(b=>b.onclick=()=>{if(locked||b.classList.contains('used'))return;const x=b.textContent,correct=item[2][step];if(x===correct){b.classList.add('used');$('slot'+step).textContent=x;$('slot'+step).classList.add('done');step++;$('msg').className='message success';$('msg').textContent=step<item[2].length?'✓ Doğru! Şimdi sonraki hece.':'🎉 Kelime tamamlandı!';if(step===item[2].length){locked=true;score+=10;speak(item[1]);setTimeout(()=>{Q++;Q>=5?done():render()},700)}}else{$('msg').className='message wrong';$('msg').textContent='❌ Sıradaki hece değil. Dinle وحاول مرة أخرى.'}})}$('listen').onclick=()=>speak(item[1]);$('clear').onclick=()=>{if(locked)return;step=0;document.querySelectorAll('.slot').forEach(s=>{s.textContent='?';s.classList.remove('done')});document.querySelectorAll('.choice').forEach(b=>b.classList.remove('used'));$('msg').textContent='İlk heceyi seç.'};function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render();setTimeout(()=>speak(item[1]),250)};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render();setTimeout(()=>speak(item[1]),250)}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
