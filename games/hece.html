<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hece Oyunu</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:200;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:24px;padding:10px 14px;box-shadow:0 10px 30px #16425b30;text-align:center;backdrop-filter:blur(8px)}.title{font-size:clamp(25px,5vw,40px);font-weight:1000;color:#172f49}.mission{font-size:clamp(17px,3.4vw,25px);font-weight:900;margin-top:2px}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:clamp(15px,3vw,20px);flex-wrap:wrap;margin-top:6px}.btn{border:0;border-radius:22px;padding:14px 25px;color:#fff;font-size:clamp(17px,3vw,23px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #0002}.home{position:absolute;z-index:500;left:24px;bottom:14px;background:#1680d8}.restart{position:absolute;z-index:500;right:24px;bottom:14px;background:#f5a020}.feedback{position:absolute;z-index:450;left:50%;transform:translateX(-50%);top:130px;background:#fff;border-radius:24px;padding:13px 25px;font-size:clamp(18px,4vw,28px);font-weight:1000;box-shadow:0 12px 30px #0002;display:none;text-align:center}.success{color:#119a62}.error{color:#d62828}.celebrate{position:absolute;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(4px)}.panel{width:min(460px,90%);background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 70px #0005}.panel h1{margin:8px 0;font-size:38px}.panel p{font-size:20px;font-weight:800}.big{font-size:78px;filter:drop-shadow(0 12px 8px #0003)}.hidden{display:none!important}.confetti{position:absolute;width:11px;height:20px;top:42%;z-index:900;animation:conf 1s ease-out forwards;pointer-events:none}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}@media(max-width:600px){.hud{top:6px;padding:8px 10px}.home{left:20px;bottom:12px}.restart{right:20px;bottom:12px}.btn{padding:13px 19px;border-radius:20px}.feedback{top:118px;max-width:90%}}body{background:linear-gradient(135deg,#eef0ff,#dff7ff)}.content{position:absolute;inset:150px 0 82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.art{font-size:118px;filter:drop-shadow(0 18px 9px #0003)}.word{font-size:clamp(20px,4vw,28px);font-weight:1000;color:#7251a4}.build{min-height:100px;width:min(650px,88%);background:#fff;border:5px dashed #a277dc;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:12px;padding:15px;box-shadow:0 14px 30px #0002}.slot{width:clamp(90px,18vw,135px);height:70px;border:4px solid #d7c7ef;border-radius:20px;display:grid;place-items:center;font-size:clamp(25px,5vw,38px);font-weight:1000;color:#203b55;background:#fbfaff}.tiles{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}.tile{min-width:105px;min-height:76px;border:0;border-radius:22px;background:#fff;box-shadow:0 12px 22px #0002;font-size:28px;font-weight:1000;color:#087ed3;cursor:pointer;touch-action:manipulation}.complete{border-color:#21b873;background:#f0fff8}.hint{font-size:20px;font-weight:1000}@media(max-width:600px){.content{inset:135px 0 80px}.art{font-size:90px}.build{min-height:88px}.tile{min-width:88px;min-height:66px;font-size:23px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🔤 Hece Oyunu</div><div class="mission">Kelimeyi hecelerine ayır!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="content"><div class="art" id="art"></div><div class="word" id="word"></div><div class="build" id="build"></div><div class="tiles" id="tiles"></div><div class="hint" id="hint">Heceleri sırayla seç!</div></div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🔤🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next" style="background:#1680d8">Sonraki Seviye ➡️</button></div></div></div><script>const data=[('DOMATES', ['DO', 'MA', 'TES'], '🍅'), ('MIKROFON', ['MİK', 'RO', 'FON'], '🎤'), ('KAMERA', ['KA', 'ME', 'RA'], '📷'), ('ELMA', ['EL', 'MA'], '🍎'), ('KEDİ', ['KE', 'Dİ'], '🐱'), ('KİTAP', ['Kİ', 'TAP'], '📚'), ('ARABA', ['A', 'RA', 'BA'], '🚗'), ('BALIK', ['BA', 'LIK'], '🐟'), ('MUZ', ['MUZ'], '🍌'), ('ÇİÇEK', ['Çİ', 'ÇEK'], '🌸'), ('PENCERE', ['PEN', 'CE', 'RE'], '🪟'), ('BEBEK', ['BE', 'BEK'], '👶'), ('TELEFON', ['TE', 'LE', 'FON'], '📱'), ('DOMUZ', ['DO', 'MUZ'], '🐷'), ('OKUL', ['O', 'KUL'], '🏫')];let L=0,Q=0,score=0,pick=[];const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){pick=[];const d=data[(L*5+Q)%data.length];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('art').textContent=d[2];$('word').textContent=d[0];$('build').innerHTML=d[1].map(()=>'<div class="slot">?</div>').join('');$('tiles').innerHTML='';[...d[1]].sort(()=>Math.random()-.5).forEach(x=>{const b=document.createElement('button');b.className='tile';b.textContent=x;b.onclick=()=>choose(x,b,d)});$('msg').style.display='none'}function choose(x,b,d){if(x!==d[1][pick.length]){$('msg').className='feedback error';$('msg').textContent='❌ Sıradaki hece bu değil!';$('msg').style.display='block';b.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],300);return}pick.push(x);document.querySelectorAll('.slot')[pick.length-1].textContent=x;b.disabled=true;b.style.opacity='.45';if(pick.length===d[1].length){score+=10;$('score').textContent=score;$('build').classList.add('complete');$('hint').textContent='🎉 '+d[0];$('msg').className='feedback success';$('msg').textContent='✅ Harika! Kelime tamamlandı!';$('msg').style.display='block';speak(d[0]);setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},950)}}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
