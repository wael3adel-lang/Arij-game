<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hece Oyunu</title><link rel="stylesheet" href="_common.css"><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(135deg,#dff7ff,#fff4dc)}</style></head><body><div class="game"><div class="hud"><div class="title">🔤 Hece Oyunu</div><div class="mission">Dinle ve heceleri doğru sırayla seç.</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="pic">🐰</div><button class="btn" id="listen">🔊 Dinle</button><div class="message" id="msg">Möchten Sie die Silben wählen.</div><div id="answer" class="choice" style="min-width:300px">—</div><div class="choices" id="choices"></div><button class="btn secondary" id="clear">Temizle</button></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🔤</div><h1>Hece Oyunu</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const words=[[['🐰','TAVŞAN',['TAV','ŞAN']],['🐱','KEDİ',['KE','Dİ']],['🐟','BALIK',['BA','LIK']],['🚗','ARABA',['A','RA','BA']],['🍌','MUZ',['MUZ']]], [['🦋','KELEBEK',['KE','LE','BEK']],['🐶','KÖPEK',['KÖ','PEK']],['🌳','AĞAÇ',['A','ĞAÇ']],['🍓','ÇİLEK',['Çİ','LEK']],['🚌','OTOBÜS',['O','TO','BÜS']]], [['🐢','KAPLUMBAĞA',['KAP','LUM','BA','ĞA']],['🌹','GÜLÜMSE',['GÜ','LÜM','SE']],['🚲','BİSİKLET',['Bİ','SİK','LET']],['🦒','ZÜRAFA',['ZÜ','RA','FA']],['🍊','PORTAKAL',['POR','TA','KAL']]], [['🌈','GÖKKUŞAĞI',['GÖK','KU','ŞA','ĞI']],['🦁','ASLANLAR',['AS','LAN','LAR']],['🐘','FİLLER',['FİL','LER']],['🍉','KARPUZLAR',['KAR','PUZ','LAR']],['✈️','UÇAKLAR',['U','ÇAK','LAR']]], [['🐊','TİMSAHLAR',['TİM','SAH','LAR']],['🐿️','SİNCAPLAR',['SİN','CAP','LAR']],['🦒','ZÜRAFALAR',['ZÜ','RA','FA','LAR']],['🍉','KARPUZLAR',['KAR','PUZ','LAR']],['🌻','AYÇİÇEĞİ',['AY','Çİ','ÇE','Ğİ']]]];let L=0,Q=0,score=0,answer='',item;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}catch(e){}}function render(){item=words[L][Q];answer='';$('answer').textContent='—';$('pic').textContent=item[0];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('msg').textContent='Kelimeyi hecelere ayır: '+item[1];let correct=item[2];let pool=[...correct];while(pool.length<Math.min(correct.length+2,6)){let x=['BA','RA','KE','LE','TA','MA','LIK','ŞAN','PEK','GÜ','LÜM','SAH'][Math.floor(Math.random()*12)];if(!pool.includes(x))pool.push(x)}pool.sort(()=>Math.random()-.5);$('choices').innerHTML=pool.map(x=>`<button class="choice">🔊 ${x}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>{let x=b.textContent.replace('🔊 ','');speak(x);if(answer.length<correct.length){answer+=x;$('answer').textContent=answer;if(answer===correct.join('')){score+=10;Q++;$('msg').className='message success';$('msg').textContent='Aferin! '+item[1];speak(item[1]);setTimeout(()=>Q>=5?done():render(),550)}else if(!correct.join('').startsWith(answer)){$('msg').className='message wrong';$('msg').textContent='Tekrar dene!';answer='';$('answer').textContent='—'}}})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<70;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('listen').onclick=()=>speak(item[1]);$('clear').onclick=()=>{answer='';$('answer').textContent='—'};$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
