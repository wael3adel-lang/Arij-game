<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hece Oyunu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;background:linear-gradient(135deg,#ffe8f2,#e6f7ff)}.game{height:100%;position:relative}.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(900px,94%);background:#ffffffee;border-radius:22px;padding:10px;text-align:center;z-index:20;box-shadow:0 8px 25px #0002}.title{font-size:34px;font-weight:1000;color:#7a4bd1}.mission{font-size:20px;font-weight:900}.stats{font-weight:900}.content{position:absolute;inset:145px 0 70px;display:flex;flex-direction:column;align-items:center;justify-content:center}.picture{font-size:90px}.word{font-size:44px;font-weight:1000;letter-spacing:5px;margin:10px}.syllables{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.syllable{border:0;border-radius:22px;background:white;padding:20px 26px;font-size:30px;font-weight:1000;box-shadow:0 10px 22px #0002;cursor:pointer}.syllable.done{background:#4bcf91;color:white}.message{font-size:20px;font-weight:900;min-height:30px}.success{color:#14945c}.btn{border:0;border-radius:15px;padding:12px 20px;background:#0876d1;color:white;font-size:17px;font-weight:900}.home{position:absolute;bottom:12px;left:12px}.restart{position:absolute;bottom:12px;right:12px;background:#f39b28}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#173c5c99;z-index:50}.celebrate{display:none}.panel{background:white;width:min(460px,90%);padding:28px;border-radius:28px;text-align:center}.big{font-size:65px}.hidden{display:none!important}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head>
<body><div class="game"><div class="hud"><div class="title">🔤 Hece Oyunu</div><div class="mission">Kelimeyi hecelerine ayır!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div>
<div class="content"><div class="picture" id="pic">🍅</div><div class="word" id="word">DOMATES</div><div class="syllables" id="syllables"></div><div class="message" id="msg">Heceleri sırayla seç!</div></div>
<button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button>
<div class="screen" id="start"><div class="panel"><div class="big">🔤</div><h1>Hece Oyunu</h1><p>Heceleri sırayla seçerek kelimeyi tamamla.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div>
<div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎉🏆</div><h1>Aferin!</h1><p id="doneText"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div>
<script>
const sets=[
[['DOMATES',['DO','MA','TES'],'🍅'],['KALem',['KA','LEM'],'✏️'],['KİTAP',['Kİ','TAP'],'📕'],['BABA',['BA','BA'],'👨'],['ELMA',['EL','MA'],'🍎']],
[['ARABA',['A','RA','BA'],'🚗'],['ÇİÇEK',['Çİ','ÇEK'],'🌸'],['KEDİ',['KE','Dİ'],'🐱'],['BALIK',['BA','LIK'],'🐟'],['KAPI',['KA','PI'],'🚪']],
[['TELEFON',['TE','LE','FON'],'📱'],['MİKROFON',['MİK','RO','FON'],'🎤'],['BİSİKLET',['Bİ','SİK','LET'],'🚲'],['PORTAKAL',['POR','TA','KAL'],'🍊'],['PATATES',['PA','TA','TES'],'🥔']],
[['ÖĞRETMEN',['ÖĞ','RET','MEN'],'👩‍🏫'],['ÖĞRENCİ',['ÖĞ','REN','Cİ'],'🧑‍🎓'],['HAYVAN',['HAY','VAN'],'🐶'],['KARDEŞ',['KAR','DEŞ'],'👧'],['OYUNCAK',['O','YUN','CAK'],'🧸']],
[['KÜTÜPHANE',['KÜ','TÜP','HA','NE'],'📚'],['BİLGİSAYAR',['BİL','Gİ','SA','YAR'],'💻'],['DİŞÇİ',['DİŞ','Çİ'],'🦷'],['HASTANE',['HAS','TA','NE'],'🏥'],['ÇİKOLATA',['Çİ','KO','LA','TA'],'🍫']]
];
let L=0,Q=0,idx=0,score=0;
const $=id=>document.getElementById(id);
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function render(){let d=sets[L][Q];idx=0;$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('pic').textContent=d[2];$('word').textContent=d[0];$('msg').textContent='Heceleri sırayla seç!';$('msg').className='message';let arr=[...d[1]].sort(()=>Math.random()-.5);$('syllables').innerHTML='';arr.forEach(s=>{let b=document.createElement('button');b.className='syllable';b.textContent=s;b.onclick=()=>choose(b,s,d[1]);$('syllables').appendChild(b)})}
function choose(b,s,correct){if(s!==correct[idx]){$('msg').textContent='Tekrar dene!';$('msg').className='message';speak('Tekrar dene');return}b.classList.add('done');b.disabled=true;idx++;score+=2;speak(s);if(idx===correct.length){$('msg').textContent='Harika! Kelime tamamlandı!';$('msg').className='message success';speak('Harika! '+$('word').textContent);setTimeout(()=>{Q++;if(Q>=5){$('doneText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},700)}}
$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();
</script></body></html>
