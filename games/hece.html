<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hece Oyunu</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#14263d}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:rgba(255,255,255,.94);border-radius:24px;padding:10px 14px;text-align:center;box-shadow:0 10px 30px rgba(20,40,60,.18);border:2px solid rgba(255,255,255,.9)}.title{font-size:clamp(25px,5vw,38px);font-weight:1000}.mission{font-size:clamp(16px,3.2vw,23px);font-weight:900;margin-top:2px}.stats{font-size:clamp(13px,2.5vw,17px);font-weight:900;margin-top:5px}.btn{border:0;border-radius:18px;padding:13px 20px;background:#1677d2;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home,.restart{position:absolute;z-index:200;bottom:14px}.home{left:20px}.restart{right:20px;background:#f59b23;box-shadow:0 5px 0 #c9760e}.feedback{position:absolute;z-index:150;top:120px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff;font-size:20px;font-weight:1000;box-shadow:0 8px 24px #0002;display:none}.success{color:#0b9f6a}.error{color:#d62828}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,39,62,.38);z-index:300}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:28px;border-radius:30px;text-align:center;box-shadow:0 25px 60px #0005}.big{font-size:76px}.hidden{display:none!important}.shadow3d{filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
body{background:linear-gradient(135deg,#f4efff,#eaf8ff)}.content{position:absolute;inset:105px 0 82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.wordArt{width:min(220px,42vw);height:min(180px,28vh)}.word{font-size:clamp(34px,8vw,58px);font-weight:1000;letter-spacing:7px}.build{width:min(680px,88%);min-height:105px;border:4px dashed #9b6bd3;border-radius:28px;background:#ffffffdd;display:flex;justify-content:center;align-items:center;gap:12px;padding:14px;box-shadow:0 12px 25px #0001}.slot{width:clamp(82px,18vw,120px);height:70px;border:4px solid #d9c9f2;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:clamp(23px,5vw,34px);font-weight:1000}.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.tile{border:0;border-radius:20px;background:#fff;padding:18px 25px;font-size:clamp(22px,5vw,34px);font-weight:1000;box-shadow:0 10px 20px #0002;touch-action:manipulation}.complete{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.12)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🔤 Hece Oyunu</div><div class="mission">Kelimeyi hecelerine ayır!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="content"><div id="art" class="wordArt"></div><div id="word" class="word"></div><div class="build" id="build"></div><div class="tiles" id="tiles"></div><div id="hint" style="font-weight:900;font-size:18px">Heceleri sırayla seç!</div></div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const data=[['DOMATES',['DO','MA','TES'],'🍅'],['MIKROFON',['MİK','RO','FON'],'🎤'],['KAMERA',['KA','ME','RA'],'📷'],['ELMA',['EL','MA'],'🍎'],['KEDİ',['KE','Dİ'],'🐱'],['KİTAP',['Kİ','TAP'],'📚'],['ARABA',['A','RA','BA'],'🚗'],['BALIK',['BA','LIK'],'🐟'],['MUZ',['MUZ'],'🍌'],['ÇİÇEK',['Çİ','ÇEK'],'🌸']];let L=0,Q=0,score=0,pick=[];const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function art(e){return '<div style="font-size:120px;filter:drop-shadow(0 15px 8px #0003)">'+e+'</div>'}function render(){pick=[];let d=data[(L*2+Q)%data.length];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('art').innerHTML=art(d[2]);$('word').textContent=d[0];$('build').innerHTML=d[1].map(()=>'<div class="slot">?</div>').join('');$('tiles').innerHTML='';let shuffled=[...d[1]].sort(()=>Math.random()-.5);shuffled.forEach((x,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=x;b.onclick=()=>choose(x,b);$('tiles').appendChild(b)});$('hint').textContent='Heceleri sırayla seç!';$('msg').style.display='none'}function choose(x,b){let d=data[(L*2+Q)%data.length];if(x!==d[1][pick.length]){b.animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],300);$('msg').style.display='block';$('msg').className='feedback error';$('msg').textContent='❌ Bu sırada değil!';return}pick.push(x);let slots=[...document.querySelectorAll('.slot')];slots[pick.length-1].textContent=x;b.disabled=true;b.style.opacity=.45;if(pick.length===d[1].length){score+=10;$('score').textContent=score;$('build').classList.add('complete');$('hint').textContent='🎉 '+d[0];$('msg').style.display='block';$('msg').className='feedback success';$('msg').textContent='✅ Harika!';speak(d[0]);setTimeout(()=>{Q++;if(Q>=2){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},1000)}}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
