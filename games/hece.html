<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hece Oyunu</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.btn{border:0;border-radius:16px;padding:12px 20px;background:#1677d2;color:#fff;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home{position:absolute;z-index:90;bottom:12px;left:12px}.restart{position:absolute;z-index:90;bottom:12px;right:12px;background:#f39a28;box-shadow:0 5px 0 #c97713}.hud{position:absolute;z-index:70;top:8px;left:50%;transform:translateX(-50%);width:min(920px,94%);background:#fffffff2;border-radius:22px;padding:9px 14px;text-align:center;box-shadow:0 8px 25px #0002}.title{font-size:clamp(26px,4vw,36px);font-weight:1000}.mission{font-size:clamp(17px,3vw,23px);font-weight:900}.stats{font-weight:900;font-size:14px}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#173c5c99;z-index:100}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:30px;border-radius:30px;text-align:center;box-shadow:0 20px 55px #0005}.big{font-size:70px}.hidden{display:none!important}body{background:linear-gradient(135deg,#f6f0ff,#e8faff)}.game{height:100%;position:relative}.content{position:absolute;inset:135px 0 72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:15px}.picture{font-size:74px;filter:drop-shadow(0 7px 4px #0002)}.hintWord{font-size:18px;color:#7253a8;font-weight:900}.build{width:min(760px,92%);min-height:92px;background:#ffffffcc;border:4px dashed #9b7bdb;border-radius:24px;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;box-shadow:0 10px 25px #0001}.slot{min-width:86px;min-height:58px;padding:10px 16px;border-radius:17px;background:#fff;border:3px solid #d6c9f1;font-size:27px;font-weight:1000;display:flex;align-items:center;justify-content:center}.slot.filled{background:#5ccf96;color:#fff;border-color:#35ad73;animation:place .25s ease}.syllables{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.syllable{border:0;border-radius:20px;background:white;padding:17px 23px;font-size:28px;font-weight:1000;box-shadow:0 8px 18px #0002;cursor:pointer;touch-action:manipulation}.syllable:disabled{opacity:.35}.message{font-size:19px;font-weight:900;min-height:28px}.success{color:#15945d}.final{font-size:46px;font-weight:1000;letter-spacing:3px;color:#6439b7;min-height:55px}.home{position:absolute;bottom:12px;left:12px}.restart{position:absolute;bottom:12px;right:12px;background:#f39b28}@keyframes place{from{transform:scale(.75)}to{transform:scale(1)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🔤 Hece Oyunu</div><div class="mission">Kelimeyi hecelerine ayır!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="content"><div class="picture" id="pic">🍅</div><div class="hintWord">Heceleri sırayla yerleştir:</div><div class="build" id="build"></div><div class="final" id="final"></div><div class="syllables" id="syllables"></div><div class="message" id="msg">Heceleri sırayla seç!</div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="big">🔤</div><h1>Hece Oyunu</h1><p>Doğru heceyi seç ve yukarıdaki kutulara sırayla yerleştir.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎉🏆</div><h1>Aferin!</h1><p id="doneText"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const sets=[[['DOMATES',['DO','MA','TES'],'🍅'],['KALEM',['KA','LEM'],'✏️'],['KİTAP',['Kİ','TAP'],'📕'],['BABA',['BA','BA'],'👨'],['ELMA',['EL','MA'],'🍎']],[['ARABA',['A','RA','BA'],'🚗'],['ÇİÇEK',['Çİ','ÇEK'],'🌸'],['KEDİ',['KE','Dİ'],'🐱'],['BALIK',['BA','LIK'],'🐟'],['KAPI',['KA','PI'],'🚪']],[['TELEFON',['TE','LE','FON'],'📱'],['MİKROFON',['MİK','RO','FON'],'🎤'],['BİSİKLET',['Bİ','SİK','LET'],'🚲'],['PORTAKAL',['POR','TA','KAL'],'🍊'],['PATATES',['PA','TA','TES'],'🥔']],[['ÖĞRETMEN',['ÖĞ','RET','MEN'],'👩‍🏫'],['ÖĞRENCİ',['ÖĞ','REN','Cİ'],'🧑‍🎓'],['HAYVAN',['HAY','VAN'],'🐶'],['KARDEŞ',['KAR','DEŞ'],'👧'],['OYUNCAK',['O','YUN','CAK'],'🧸']],[['KÜTÜPHANE',['KÜ','TÜP','HA','NE'],'📚'],['BİLGİSAYAR',['BİL','Gİ','SA','YAR'],'💻'],['DİŞÇİ',['DİŞ','Çİ'],'🦷'],['HASTANE',['HAS','TA','NE'],'🏥'],['ÇİKOLATA',['Çİ','KO','LA','TA'],'🍫']]];let L=0,Q=0,idx=0,score=0;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=[...speechSynthesis.getVoices()].find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){let d=sets[L][Q];idx=0;$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('pic').textContent=d[2];$('final').textContent='';$('msg').textContent='Heceleri sırayla seç!';$('msg').className='message';let build=$('build');build.innerHTML=d[1].map((_,i)=>`<div class="slot" id="slot${i}">?</div>`).join('');let arr=[...d[1]].sort(()=>Math.random()-.5);$('syllables').innerHTML='';arr.forEach(s=>{let b=document.createElement('button');b.className='syllable';b.textContent=s;b.onclick=()=>choose(b,s,d[1]);$('syllables').appendChild(b)})}function choose(b,s,correct){if(s!==correct[idx]){$('msg').textContent='❌ Bu değil! İlk olarak '+correct[idx]+' seç.';speak('Tekrar dene');return}b.disabled=true;let slot=$('slot'+idx);slot.textContent=s;slot.classList.add('filled');score+=2;$('score').textContent=score;speak(s);idx++;if(idx===correct.length){$('final').textContent=correct.join('');$('msg').textContent='🎉 Harika! Kelime tamamlandı!';$('msg').className='message success';speak('Harika! '+correct.join(''));setTimeout(()=>{Q++;if(Q>=5){$('doneText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},900)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
