<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonla Uçuş</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:#bdeeff}.sky{position:absolute;inset:128px 0 68px;overflow:hidden;background:linear-gradient(#65d1f2 0 62%,#c8f3ff 62% 100%)}.cloud{position:absolute;width:130px;height:55px;background:#fff;border-radius:50px;filter:drop-shadow(0 7px 5px #0001);opacity:.9}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:65px;height:65px;left:25px;top:-25px}.cloud:after{width:55px;height:55px;left:68px;top:-18px}.missionBox{position:absolute;z-index:25;top:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:8px 24px;text-align:center;box-shadow:0 8px 22px #0003;min-width:210px}.missionBox .big{font-size:56px;line-height:1;color:#e95c38;font-weight:1000}.balloon{position:absolute;width:88px;height:108px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:1000;text-shadow:0 2px 4px #0005;box-shadow:inset -13px -15px 20px #0002,0 9px 18px #0002;cursor:pointer;touch-action:manipulation;animation:floatUp linear infinite}.balloon:before{content:"";position:absolute;top:15px;left:20px;width:30px;height:15px;background:#fff8;border-radius:50%;transform:rotate(-20deg)}.balloon:after{content:"";position:absolute;bottom:-42px;width:2px;height:43px;background:#777}.balloon.pop{animation:balloonPop .35s forwards!important}.message{position:absolute;z-index:30;top:155px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 18px;border-radius:18px;white-space:nowrap}.success{color:#15945d}.wrong{color:#d34848}@keyframes floatUp{from{transform:translateY(105vh)}to{transform:translateY(-130vh)}}@keyframes balloonPop{30%{transform:scale(1.18)}100%{transform:scale(0);opacity:0}}@media(max-width:600px){.sky{inset:122px 0 70px}.missionBox{top:10px;min-width:185px;font-size:16px}.missionBox .big{font-size:50px}.balloon{width:76px;height:94px;font-size:27px}.message{top:148px;font-size:15px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonla Uçuş</div><div class="mission">Doğru balonu patlat!</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="sky" id="sky"><div class="cloud" style="left:8%;top:20%"></div><div class="cloud" style="right:12%;top:27%;transform:scale(.8)"></div><div class="missionBox">Patlatılacak sayı<div class="big" id="target">1</div></div><div id="choices"></div></div><div class="message" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎈</div><h1>Balonla Uçuş</h1><p>Doğru sayılı balonu patlat.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>let L=0,Q=0,score=0,target=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;target=1+L+Math.floor(Math.random()*4);$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('target').textContent=target;$('msg').className='message';$('msg').textContent='Doğru numaralı balona dokun!';$('choices').innerHTML='';let vals=[target];while(vals.length<4+Math.min(L,2)){let n=1+Math.floor(Math.random()*9);if(!vals.includes(n))vals.push(n)}vals.sort(()=>Math.random()-.5);const spots=[[8,58],[30,72],[53,55],[75,70],[18,34],[62,28],[82,42]];vals.forEach((n,i)=>{const b=document.createElement('button');b.className='balloon';b.textContent=n;b.style.left=spots[i][0]+'%';b.style.top=spots[i][1]+'%';b.style.background=['#ef476f','#f8961e','#06d6a0','#118ab2','#8a5cf6','#e76f51','#f9c74f'][i%7];b.style.animationDuration=(7-L*.6+Math.random()*1.5)+'s';b.style.animationDelay=(-Math.random()*6)+'s';b.onclick=()=>{if(locked)return;if(n===target){locked=true;b.classList.add('pop');score+=10;$('msg').className='message success';$('msg').textContent='🎉 أحسنت!';setTimeout(()=>{Q++;Q>=5?done():render()},450)}else{$('msg').className='message wrong';$('msg').textContent='❌ ليس هذا الرقم، حاول مرة أخرى.';b.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],220)}};$('choices').appendChild(b)})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
