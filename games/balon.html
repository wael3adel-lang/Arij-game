<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonla Uçuş</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.btn{border:0;border-radius:16px;padding:12px 20px;background:#1677d2;color:#fff;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation}.home{position:absolute;z-index:90;bottom:12px;left:12px}.restart{position:absolute;z-index:90;bottom:12px;right:12px;background:#f39a28}.hud{position:absolute;z-index:70;top:8px;left:50%;transform:translateX(-50%);width:min(920px,94%);background:#fffffff2;border-radius:22px;padding:9px 14px;text-align:center;box-shadow:0 8px 25px #0002}.title{font-size:clamp(26px,4vw,36px);font-weight:1000}.mission{font-size:clamp(17px,3vw,23px);font-weight:900}.stats{font-weight:900;font-size:14px}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#173c5c99;z-index:100}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:30px;border-radius:30px;text-align:center;box-shadow:0 20px 55px #0005}.big{font-size:70px}.hidden{display:none!important}body{background:linear-gradient(#9de6ff,#fff0ca)}.game{height:100%;position:relative;overflow:hidden;background:linear-gradient(#8edfff 0 28%,#c9f3ff 28% 100%)}.sky{position:absolute;inset:105px 0 0;overflow:hidden}.cloud{position:absolute;font-size:62px;opacity:.7}.balloon{position:absolute;width:86px;height:104px;border-radius:50% 50% 46% 46%;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:1000;border:5px solid #fff;box-shadow:0 10px 18px #0003;cursor:pointer;touch-action:manipulation;z-index:20}.balloon:after{content:"";position:absolute;bottom:-42px;width:2px;height:42px;background:#777}.balloon.pop{animation:pop .34s ease forwards!important}.message{position:absolute;z-index:75;top:112px;left:50%;transform:translateX(-50%);background:#ffffffdd;border-radius:15px;padding:8px 16px;font-weight:1000}@keyframes rise{from{transform:translateY(110vh) rotate(-4deg)}to{transform:translateY(-180px) rotate(4deg)}}@keyframes pop{50%{transform:scale(1.35);opacity:.8}100%{transform:scale(0);opacity:0}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonla Uçuş</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="sky" id="sky"><div class="cloud" style="left:8%;top:8%">☁️</div><div class="cloud" style="left:72%;top:17%">☁️</div></div><div class="message" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="big">🎈</div><h1>Balonla Uçuş</h1><p>Doğru balonu patlat ve puan kazan!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎉🎈</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[[1,2,3],2],[[3,5,7],5],[[2,4,6,8],8],[[1,4,6,9],4],[[2,5,7,10],7],[[1,3,5,7],7],[[2,4,6,8],4],[[3,6,9,12],9],[[1,5,9,13],5],[[2,6,10,14],14],[[3,7,11,15,19],11],[[4,8,12,16,20],16],[[2,7,12,17,22],22],[[5,9,13,17,21],9],[[6,10,14,18,22],14],[[4,9,14,19,24],19],[[3,8,13,18,23],8],[[5,11,17,23,29],23],[[6,13,20,27,34],20],[[8,14,20,26,32],32],[[7,12,17,22,27],27],[[4,10,16,22,28],10],[[5,11,17,23,29],29],[[6,12,18,24,30],18],[[8,15,22,29,36],36]];let L=0,Q=0,score=0,locked=false;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){locked=false;$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;let d=qs[L*5+Q],a=[...d[0]].sort(()=>Math.random()-.5);$('mission').textContent=d[1]+' numaralı balonu patlat!';$('msg').textContent='';speak(d[1]+' numaralı balonu patlat');document.querySelectorAll('.balloon').forEach(x=>x.remove());a.forEach((n,i)=>{let b=document.createElement('div');b.className='balloon';b.textContent=n;b.style.left=(5+Math.random()*88)+'%';b.style.background=['#ef476f','#ff9f1c','#06d6a0','#118ab2','#8b5cf6'][i%5];b.style.bottom='-130px';b.style.animation=`rise ${4.5+Math.random()*2-L*.25}s linear forwards`;b.onclick=()=>pop(b,n,d[1]);$('sky').appendChild(b)})}function pop(b,n,t){if(locked)return;if(n!==t){b.animate([{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],{duration:250});$('msg').textContent='❌ Yanlış balon!';speak('Tekrar dene');return}locked=true;b.classList.add('pop');score+=10;$('score').textContent=score;$('msg').textContent='🎉 Aferin!';speak('Aferin! Doğru!');setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},400)}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
