<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonla Uçuş</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#fff4dc);color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.target{font-size:1.5em;color:#e95c38}.stats{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:#35c98a}.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:white;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.red{background:#db5353}.content{position:absolute;inset:130px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{min-width:90px;min-height:72px;border:0;border-radius:20px;background:white;box-shadow:0 8px 18px #0002;font-size:26px;font-weight:1000;cursor:pointer;padding:12px;touch-action:manipulation}.choice:hover{transform:translateY(-2px)}.picture{font-size:110px;filter:drop-shadow(0 8px 5px #0002)}.message{min-height:35px;font-weight:1000;font-size:20px;margin:8px}.success{color:#15945d}.wrong{color:#d34848}.celebrate{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.confetti{position:absolute;width:11px;height:20px;top:-30px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}.home{position:absolute;z-index:30;left:12px;bottom:12px}.restart{position:absolute;z-index:30;right:12px;bottom:12px}.small{font-size:14px;color:#668}.hidden{display:none!important}@media(max-width:600px){.hud{top:5px}.content{inset:125px 0 60px}.choice{min-width:78px;min-height:64px;font-size:22px}.picture{font-size:82px}.panel{padding:22px}.btn{font-size:16px}}
#sky{position:absolute;inset:120px 0 58px;overflow:hidden;pointer-events:auto}.cloud{position:absolute;font-size:70px;opacity:.65}.missionBox{position:absolute;z-index:10;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:10px 28px;text-align:center;box-shadow:0 8px 22px #0002;min-width:220px}.targetPrompt{font-size:21px;font-weight:900}.targetBig{font-size:62px;font-weight:1000;color:#e55a36;line-height:1}.ball{position:absolute;width:104px;height:128px;border-radius:50% 50% 46% 46%;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;touch-action:manipulation;box-shadow:inset -14px -18px 20px #0002,0 9px 20px #0003;animation:rise linear infinite;z-index:5}.ball:before{content:"";position:absolute;top:13px;left:22px;width:34px;height:16px;border-radius:50%;background:#fff7;transform:rotate(-18deg)}.ball:after{content:"";position:absolute;bottom:-43px;left:50%;width:2px;height:45px;background:#777}.ball span{font-size:30px;font-weight:1000;color:#fff;text-shadow:0 2px 4px #0007}.pop{animation:ballPop .25s ease forwards!important}.content{inset:auto}.game>.message{position:absolute;z-index:25;top:175px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 18px;border-radius:18px;box-shadow:0 6px 18px #0002}.success{color:#15945d}.wrong{color:#d34848}@keyframes rise{from{transform:translateY(115vh) rotate(-5deg)}to{transform:translateY(-190px) rotate(5deg)}}@keyframes ballPop{to{transform:scale(1.6);opacity:0}}@media(max-width:600px){.missionBox{top:4px}.targetBig{font-size:56px}.ball{width:92px;height:116px}.game>.message{top:168px;font-size:16px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game" style="background:linear-gradient(#72d9ff 0 45%,#c6f3ff 45% 100%)"><div class="hud"><div class="title">🎈 Balonla Uçuş</div><div class="mission">Doğru balonu patlat!</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div id="sky"><div class="cloud" style="left:8%;top:30px">☁️</div><div class="cloud" style="right:10%;top:95px">☁️</div><div class="missionBox" id="mission"></div><div id="choices"></div></div><div class="message" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎈</div><h1>Balonla Uçuş</h1><p>Balonu doğru zamanda patlat!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const levels=[{type:'number',min:1,max:5},{type:'number',min:2,max:7},{type:'number',min:3,max:9},{type:'number',min:4,max:11},{type:'number',min:5,max:13}];let L=0,Q=0,score=0,target=0,locked=false;const $=id=>document.getElementById(id);function rnd(n){return Math.floor(Math.random()*n)}function render(){locked=false;const d=levels[L];target=d.min+rnd(d.max-d.min+1);$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=((Q)/5*100)+'%';$('mission').innerHTML='<div class="targetPrompt">Patlatılacak sayı</div><div class="targetBig">'+target+'</div>';$('msg').textContent='Yukarı çıkan balonlardan doğru sayıyı bul!';$('choices').innerHTML='';let vals=[target];while(vals.length<Math.min(4+L,7)){let n=Math.max(1,target-3)+rnd(7);if(!vals.includes(n))vals.push(n)}vals.sort(()=>Math.random()-.5);vals.forEach((n,i)=>{let b=document.createElement('div');b.className='ball';b.dataset.n=n;b.style.left=(8+i*(82/(vals.length-1||1)))+'%';b.style.background=['#ef476f','#f8961e','#06d6a0','#118ab2','#8a5cf6','#f9c74f','#e76f51'][i%7];b.style.animationDuration=(6.2-L*.7+Math.random()*1.4)+'s';b.style.animationDelay=(-Math.random()*5)+'s';b.innerHTML='<span>'+n+'</span>';b.onclick=()=>{if(locked||b.classList.contains('pop'))return;if(n===target){locked=true;b.classList.add('pop');score+=10;$('msg').className='message success';$('msg').textContent='🎉 Aferin!';Q++;setTimeout(()=>Q>=5?done():render(),500)}else{$('msg').className='message wrong';$('msg').textContent='❌ Bu sayı değil, tekrar dene!';b.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],220)}};$('choices').appendChild(b)})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.5)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>{L=0;Q=0;score=0;$('celebrate').style.display='none';$('start').classList.remove('hidden')};</script></body></html>
