<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonla Uçuş</title><link rel="stylesheet" href="_common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(#73dcff 0 45%,#b9f1ff 45% 100%)}#sky{position:absolute;inset:115px 0 0;overflow:hidden}.cloud{position:absolute;font-size:70px;opacity:.7}.missionBox{position:absolute;z-index:5;top:118px;left:50%;transform:translateX(-50%);background:#ffffffed;padding:10px 22px;border-radius:20px;font-weight:1000;text-align:center}.targetBig{font-size:52px;color:#e65535}.ball{position:absolute;width:100px;height:125px;border-radius:50% 50% 45% 45%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:1000;font-size:20px;cursor:pointer;box-shadow:inset -10px -14px 18px #0002,0 8px 18px #0002;animation:rise linear infinite}.ball:after{content:'🎈';position:absolute;font-size:85px;z-index:-1;filter:drop-shadow(0 6px 3px #0002)}.ball span{position:relative;z-index:2;margin-top:0;color:#18324a;background:#ffffffd9;border-radius:12px;padding:3px 7px}.pop{transform:scale(1.5);opacity:0!important;transition:.2s}@keyframes rise{from{transform:translateY(120vh) rotate(-5deg)}to{transform:translateY(-150px) rotate(5deg)}}.content{inset:155px 0 55px;justify-content:flex-end;padding-bottom:15px}.message{background:#ffffffdd;padding:8px 15px;border-radius:15px}#choices{position:absolute;inset:0;pointer-events:none}.targetPrompt{font-size:24px}.</style></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonla Uçuş</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | ⭐ Soru: <b id="round">1</b>/5</div></div><div id="sky"><div class="cloud" style="left:8%;top:15px">☁️</div><div class="cloud" style="right:10%;top:70px">☁️</div><div class="missionBox" id="mission"></div><div id="choices"></div></div><div class="content"><div class="message" id="msg">Doğru balonu yakala!</div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎈</div><h1>Balonla Uçuş</h1><p>Doğru harfi veya sayıyı taşıyan balonu patlat!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🎈🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const levels=[{type:'letter',target:'B',items:['BALIK','BALON','KÖPEK']},{type:'letter',target:'K',items:['KEDİ','KÖPEK','KUŞ','GÜL']},{type:'letter',target:'M',items:['MUZ','MAYMUN','ELMA','PORTAKAL']},{type:'number',target:3,items:[1,3,5,7]},{type:'number',target:5,items:[2,5,6,8,10]}];let L=0,Q=0,score=0,needHits=1,hits=0;const $=id=>document.getElementById(id);function render(){let d=levels[L];hits=0;needHits=Math.min(1+Math.floor(L/2),3);$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('mission').innerHTML=d.type==='letter'?`<div class="targetPrompt">Bu harfle başlayanları yakala:</div><div class="targetBig">${d.target}</div>`:`<div class="targetPrompt">Bu sayıyı taşıyan balonları yakala:</div><div class="targetBig">${d.target}</div>`;$('choices').innerHTML='';d.items.forEach((item,i)=>{let b=document.createElement('div');b.className='ball';b.style.left=(8+Math.random()*78)+'%';b.style.background=`hsl(${i*65+15} 80% 68%)`;b.style.animationDuration=(6+Math.random()*3)+'s';b.style.animationDelay=(-Math.random()*7)+'s';b.innerHTML=`<span>${item}</span>`;b.onclick=()=>{if(b.classList.contains('pop'))return;let val=d.type==='letter'?item.startsWith(d.target):Number(item)===d.target;if(val){b.classList.add('pop');hits++;score+=10;$('msg').className='message success';$('msg').textContent='Aferin! Doğru balon!';if(hits>=needHits){Q++;setTimeout(()=>Q>=5?done():render(),500)}}else{$('msg').className='message wrong';$('msg').textContent='Bu balon değil!'}};$('choices').appendChild(b)})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<65;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
