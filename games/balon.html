<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Balonla Uçuş</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#14263d}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:rgba(255,255,255,.94);border-radius:24px;padding:10px 14px;text-align:center;box-shadow:0 10px 30px rgba(20,40,60,.18);border:2px solid rgba(255,255,255,.9)}.title{font-size:clamp(25px,5vw,38px);font-weight:1000}.mission{font-size:clamp(16px,3.2vw,23px);font-weight:900;margin-top:2px}.stats{font-size:clamp(13px,2.5vw,17px);font-weight:900;margin-top:5px}.btn{border:0;border-radius:18px;padding:13px 20px;background:#1677d2;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home,.restart{position:absolute;z-index:200;bottom:14px}.home{left:20px}.restart{right:20px;background:#f59b23;box-shadow:0 5px 0 #c9760e}.feedback{position:absolute;z-index:150;top:120px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff;font-size:20px;font-weight:1000;box-shadow:0 8px 24px #0002;display:none}.success{color:#0b9f6a}.error{color:#d62828}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,39,62,.38);z-index:300}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:28px;border-radius:30px;text-align:center;box-shadow:0 25px 60px #0005}.big{font-size:76px}.hidden{display:none!important}.shadow3d{filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
body{background:linear-gradient(#83ddff 0 18%,#c8f3ff 18% 100%)}.sky{position:absolute;inset:110px 0 84px;overflow:hidden}.cloud{position:absolute;width:150px;height:55px;background:#fff;border-radius:50px;filter:blur(.2px);box-shadow:0 8px 20px #0001}.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%}.cloud:before{width:75px;height:75px;left:25px;top:-35px}.cloud:after{width:62px;height:62px;right:20px;top:-25px}.flyBalloon{position:absolute;width:92px;height:118px;border-radius:50%;border:6px solid #fff;box-shadow:0 12px 22px #0003;cursor:pointer;font-size:34px;font-weight:1000;color:#fff;text-shadow:0 2px 3px #0005;animation:rise linear forwards}.flyBalloon:after{content:'';position:absolute;left:50%;bottom:-70px;width:2px;height:70px;background:#777}.flyBalloon:before{content:'';position:absolute;left:18px;top:12px;width:28px;height:18px;background:#fff7;border-radius:50%}.pop{animation:pop2 .3s ease forwards!important}@keyframes rise{to{transform:translateY(-120vh)}}@keyframes pop2{to{transform:scale(1.4);opacity:0}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🎈 Balonla Uçuş</div><div class="mission" id="mission"></div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="sky"><div class="cloud" style="left:8%;top:9%"></div><div class="cloud" style="right:9%;top:22%;transform:scale(.8)"></div><div id="balls"></div></div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🎈🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const nums=[5,6,7,8,9],cols=['#ef476f','#ff9f1c','#06d6a0','#118ab2','#8b5cf6'];let L=0,Q=0,score=0,target;const $=id=>document.getElementById(id);function render(){target=nums[L]+((Q+L)%3);$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('mission').textContent=target+' numaralı balonu patlat!';$('msg').style.display='none';let box=$('balls');box.innerHTML='';let arr=[];for(let i=0;i<5;i++){let b=document.createElement('button');b.className='flyBalloon';b.textContent=target-2+i;b.style.background=cols[(i+Q)%cols.length];let x=8+i*18+(Math.random()*6-3);b.style.left=x+'%';b.style.bottom='-140px';b.style.animationDuration=(6.2-L*.6+Math.random()*1.2)+'s';b.onclick=()=>{if(b.classList.contains('pop'))return;if(Number(b.textContent)===target){b.classList.add('pop');score+=10;$('score').textContent=score;$('msg').style.display='block';$('msg').className='feedback success';$('msg').textContent='🎉 Doğru balon!';setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},650)}else{$('msg').style.display='block';$('msg').className='feedback error';$('msg').textContent='❌ Bu balon değil!'}};box.appendChild(b)}}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
