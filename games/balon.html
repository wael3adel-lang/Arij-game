<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balonla Uçuş</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e9f8ff,#fff8e9);color:#26364a;overflow:hidden}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94%,700px);display:flex;justify-content:space-between;z-index:10;font-weight:900}.pill{background:#fff;padding:9px 14px;border-radius:14px;box-shadow:0 5px 18px #0001}
#watermark{position:fixed;top:57px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#8da1b4;opacity:.55;z-index:9}
main{width:min(94%,680px);margin:auto;padding:105px 0 25px;text-align:center}h1{font-size:clamp(28px,7vw,43px);margin:0 0 7px;color:#2874c6}.instruction{font-size:clamp(18px,5vw,25px);font-weight:900;margin-bottom:16px}#message{height:35px;margin-top:14px;font-size:21px;font-weight:900}
#startScreen{position:fixed;inset:0;background:linear-gradient(180deg,#e9f8ff,#fff8e9);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.startBox{width:min(92%,440px);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 55px #0002}.startLogo{font-size:42px;font-weight:900;color:#2874c6}.startBox h2{margin:5px 0 10px;font-size:30px;color:#e48728}.startBox p{font-size:18px;line-height:1.5}#startButton{border:0;border-radius:18px;background:#2874c6;color:#fff;padding:16px 30px;font-size:21px;font-weight:900;cursor:pointer}
@media(max-height:700px){#hud{top:30px}main{padding-top:85px}}
#sky{height:min(58vh,430px);position:relative;overflow:hidden;background:linear-gradient(#91dcff,#e9fbff);border-radius:28px}.balloon{position:absolute;font-size:70px;z-index:5}.item{position:absolute;font-size:44px;cursor:pointer}.controls{display:flex;justify-content:center;gap:18px;margin-top:8px}.ctrl{border:0;background:#fff;border-radius:18px;padding:10px 25px;font-size:25px;box-shadow:0 5px 18px #0001}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body>
<div id="startScreen"><div class="startBox"><div class="startLogo">ARİJ</div><h2>🎈 Balonla Uçuş</h2><p>Balonu hareket ettir ve istenen nesneleri topla!</p><button id="startButton">Başla</button></div></div>
<div id="hud"><div class="pill">🎯 <span id="target">B</span></div><div class="pill">⭐ <span id="score">0</span>/5</div><div class="pill">⏱️ <span id="time">60</span></div></div><div id="watermark">ARİJ OYUNU</div>
<main><h1>🎈 Balonla Uçuş</h1><div class="instruction" id="mission">B ile başlayanları topla!</div><div id="sky"><div id="balloon" class="balloon">🎈</div></div><div class="controls"><button class="ctrl" id="left">⬅️</button><button class="ctrl" id="right">➡️</button></div><div id="message"></div></main>
<script>const sounds={click:new Audio("../sounds/click.wav"),correct:new Audio("../sounds/correct.wav"),wrong:new Audio("../sounds/wrong.wav")};function play(n){try{sounds[n].currentTime=0;sounds[n].play().catch(()=>{});}catch(e){}}
const sky=document.getElementById("sky"),balloon=document.getElementById("balloon");let x=50,s=0,t=60,timer,target,items=[];
const pools={B:[["🐟","BALIK"],["🍌","BANAN"],["🦋","KELEBEK"],["🍎","ELMA"],["⚽","TOP"]],K:[["🐱","KEDİ"],["🐶","KÖPEK"],["🐢","KAPLUMBAĞA"],["🍎","ELMA"],["🌞","GÜNEŞ"]]};
function spawn(){items.forEach(e=>e.remove());items=[];target=Math.random()<.5?"B":"K";document.getElementById("target").textContent=target;mission.textContent=target+" ile başlayan nesneleri topla!";let p=pools[target];for(let i=0;i<8;i++){let d=p[Math.floor(Math.random()*p.length)],e=document.createElement("div");e.className="item";e.textContent=d[0];e.dataset.word=d[1];e.style.left=(5+Math.random()*85)+"%";e.style.top=(5+Math.random()*80)+"%";sky.appendChild(e);items.push(e);e.onclick=()=>collect(e)}}
function collect(e){if(e.dataset.word.startsWith(target)){s++;score.textContent=s;play("correct");e.remove();if(s>=5){message.textContent="🎉 Harika!";s=0;score.textContent=0;setTimeout(spawn,500)}}else{message.textContent="Bu değil!";play("wrong")}}
function move(d){x=Math.max(8,Math.min(92,x+d));balloon.style.left=x+"%";play("click")}left.onclick=()=>move(-7);right.onclick=()=>move(7);document.onkeydown=e=>{if(e.key==="ArrowLeft")move(-7);if(e.key==="ArrowRight")move(7)}
function finish(){clearInterval(timer);message.textContent="🏆 Bitti!"}function start(){startScreen.style.display="none";spawn();timer=setInterval(()=>{t--;time.textContent=t;if(t<=0)finish()},1000)}startButton.onclick=start;
</script></body></html>
