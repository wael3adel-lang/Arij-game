<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kelime Kur</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:linear-gradient(135deg,#e7f8ff,#fff5df)}.content{position:absolute;inset:135px 0 65px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}.picture{width:min(240px,55vw);height:170px;display:grid;place-items:center}.picture svg{width:100%;height:100%;filter:drop-shadow(0 12px 7px #0002)}.prompt{font-size:22px;font-weight:1000;margin:3px 0 10px}.answer{width:min(620px,88%);min-height:78px;border-radius:22px;background:#fff;box-shadow:0 8px 20px #0002;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-size:38px;font-weight:1000;letter-spacing:4px;color:#0876a8}.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:700px;margin-top:12px}.choice{min-width:64px;height:64px;border:0;border-radius:18px;background:#fff;box-shadow:0 8px 18px #0002;font-size:28px;font-weight:1000;color:#0876d1;cursor:pointer}.listen{border:0;border-radius:50%;width:58px;height:58px;background:#23a86b;color:#fff;font-size:27px;box-shadow:0 7px 15px #0003;cursor:pointer;margin:4px}.actions{display:flex;align-items:center;justify-content:center;gap:10px}.message{min-height:30px}.used{opacity:.35;pointer-events:none}@media(max-width:600px){.content{inset:125px 0 72px}.picture{height:135px}.answer{min-height:66px;font-size:31px}.choice{min-width:57px;height:57px;font-size:24px}.prompt{font-size:18px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🧩 Kelime Kur</div><div class="mission">Harfleri doğru sırayla seçerek kelimeyi oluştur.</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="pic"></div><div class="prompt">Kelimeyi oluştur.</div><div class="actions"><button class="listen" id="listen">🔊</button></div><div class="answer" id="answer">—</div><div class="choices" id="choices"></div><div class="message" id="msg"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🧩</div><h1>Kelime Kur</h1><p>Önce kelimeyi dinle, sonra harflerini sırayla seç.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>const words=[[['apple','ELMA'],['dog','KÖPEK'],['cat','KEDİ'],['sun','GÜNEŞ'],['fish','BALIK']],[['banana','MUZ'],['butterfly','KELEBEK'],['tree','AĞAÇ'],['bus','OTOBÜS'],['house','EV']],[['rabbit','TAVŞAN'],['strawberry','ÇİLEK'],['rose','GÜL'],['turtle','KAPLUMBAĞA'],['lion','ASLAN']],[['watermelon','KARPUZ'],['bicycle','BİSİKLET'],['giraffe','ZÜRAFA'],['rainbow','GÖKKUŞAĞI'],['elephant','FİL']],[['plane','UÇAK'],['squirrel','SİNCAP'],['crocodile','TİMSAH'],['orange','PORTAKAL'],['bus','OTOBÜSLER']]];let L=0,Q=0,score=0,answer='',item;const $=id=>document.getElementById(id);function svgFor(k){const common='<defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#ddd" stop-opacity=".2"/></linearGradient></defs>';if(k==='apple')return `<svg viewBox="0 0 220 170">${common}<path d="M110 42 Q118 15 138 8" stroke="#6b3b20" stroke-width="9" fill="none"/><ellipse cx="145" cy="25" rx="28" ry="13" fill="#35a853" transform="rotate(-25 145 25)"/><path d="M55 72 Q72 40 110 55 Q148 40 165 72 Q188 126 142 153 Q110 168 78 153 Q32 126 55 72Z" fill="#ef3d45" stroke="#b51f2a" stroke-width="4"/><ellipse cx="92" cy="82" rx="25" ry="12" fill="#fff8" transform="rotate(-25 92 82)"/></svg>`;if(k==='dog')return `<svg viewBox="0 0 220 170">${common}<path d="M62 65 Q35 35 25 58 Q27 92 55 91" fill="#c98a55" stroke="#633d24" stroke-width="4"/><path d="M158 65 Q185 35 195 58 Q193 92 165 91" fill="#c98a55" stroke="#633d24" stroke-width="4"/><circle cx="110" cy="90" r="62" fill="#dba06a" stroke="#633d24" stroke-width="4"/><circle cx="88" cy="83" r="7"/><circle cx="132" cy="83" r="7"/><ellipse cx="110" cy="106" rx="16" ry="11" fill="#3a2418"/><path d="M110 116 Q100 130 90 121 M110 116 Q120 130 130 121" stroke="#633d24" stroke-width="4" fill="none"/></svg>`;if(k==='cat')return `<svg viewBox="0 0 220 170">${common}<path d="M58 60 L48 20 L82 42 Q110 30 138 42 L172 20 L162 60 Q176 120 110 145 Q44 120 58 60Z" fill="#f0b82f" stroke="#704b18" stroke-width="4"/><ellipse cx="88" cy="80" rx="6" ry="10"/><ellipse cx="132" cy="80" rx="6" ry="10"/><path d="M110 96 l-9 7 9 7 9-7Z" fill="#d37b7b"/><path d="M104 110 Q110 117 116 110" stroke="#704b18" stroke-width="3" fill="none"/></svg>`;return `<svg viewBox="0 0 220 170"><circle cx="110" cy="85" r="62" fill="#7fc9e8" stroke="#26769a" stroke-width="5"/><circle cx="88" cy="72" r="7" fill="#18324a"/><circle cx="132" cy="72" r="7" fill="#18324a"/><path d="M80 108 Q110 126 140 108" stroke="#26769a" stroke-width="5" fill="none"/></svg>`}function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';const v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){item=words[L][Q];answer='';$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('pic').innerHTML=svgFor(item[0]);$('answer').textContent='—';$('msg').className='message';$('msg').textContent='Dinle ve harfleri sırayla seç.';const letters=[...item[1]];let pool=[...new Set(letters.concat(['A','E','K','L','M','N','R','S','T','B','Ç','İ','Ö','Ü','G','U']))];pool=pool.slice(0,Math.min(letters.length+4,10)).sort(()=>Math.random()-.5);$('choices').innerHTML=pool.map(x=>`<button class="choice">${x}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>{const expected=letters[answer.length];if(b.textContent===expected){answer+=expected;$('answer').textContent=answer;$('msg').className='message success';$('msg').textContent=answer.length<letters.length?'✓ Doğru, devam et!':'🎉 Kelime tamamlandı!';b.classList.add('used');if(answer.length===letters.length){score+=10;setTimeout(()=>{speak(item[1]);Q++;setTimeout(()=>Q>=5?done():render(),350)},300)}}else{$('msg').className='message wrong';$('msg').textContent='❌ Bu harf değil. Sıradaki harfi bul.'}})}$('listen').onclick=()=>speak(item[1]);function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render();setTimeout(()=>speak(item[1]),250)};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render();setTimeout(()=>speak(item[1]),250)}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
