<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kelime Kur</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#14263d}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:rgba(255,255,255,.94);border-radius:24px;padding:10px 14px;text-align:center;box-shadow:0 10px 30px rgba(20,40,60,.18);border:2px solid rgba(255,255,255,.9)}.title{font-size:clamp(25px,5vw,38px);font-weight:1000}.mission{font-size:clamp(16px,3.2vw,23px);font-weight:900;margin-top:2px}.stats{font-size:clamp(13px,2.5vw,17px);font-weight:900;margin-top:5px}.btn{border:0;border-radius:18px;padding:13px 20px;background:#1677d2;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home,.restart{position:absolute;z-index:200;bottom:14px}.home{left:20px}.restart{right:20px;background:#f59b23;box-shadow:0 5px 0 #c9760e}.feedback{position:absolute;z-index:150;top:120px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff;font-size:20px;font-weight:1000;box-shadow:0 8px 24px #0002;display:none}.success{color:#0b9f6a}.error{color:#d62828}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,39,62,.38);z-index:300}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:28px;border-radius:30px;text-align:center;box-shadow:0 25px 60px #0005}.big{font-size:76px}.hidden{display:none!important}.shadow3d{filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
body{background:linear-gradient(135deg,#e9f9ff,#fff6df)}.content{position:absolute;inset:110px 0 80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.objectArt{width:min(310px,58vw);height:min(260px,34vh)}.wordPrompt{font-size:clamp(22px,4vw,30px);font-weight:1000}.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{border:0;border-radius:22px;background:#fff;padding:18px 22px;font-size:clamp(19px,4vw,29px);font-weight:1000;box-shadow:0 10px 20px #0002;touch-action:manipulation}.correct{outline:6px solid #28c77a}.wrong{animation:wrong .3s}@keyframes wrong{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🧩 Kelime Kur</div><div class="mission">Resme bak, doğru kelimeyi seç!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="content"><div id="art" class="objectArt"></div><div id="prompt" class="wordPrompt">Doğru kelimeyi seç:</div><div id="choices" class="choices"></div></div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🧩🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const data=[['dog','KÖPEK'],['cat','KEDİ'],['apple','ELMA'],['dog','KÖPEK'],['cat','KEDİ'],['apple','ELMA'],['dog','KÖPEK'],['cat','KEDİ'],['apple','ELMA'],['dog','KÖPEK']];let L=0,Q=0,score=0;const $=id=>document.getElementById(id);function render(){let d=data[(L*2+Q)%data.length];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;$('art').innerHTML={dog:'<svg viewBox="0 0 300 260" class="objectArt shadow3d"><defs><linearGradient id="dogg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#ead7bd"/><stop offset="1" stop-color="#b9824d"/></linearGradient></defs><ellipse cx="150" cy="145" rx="102" ry="92" fill="url(#dogg)" stroke="#9a6338" stroke-width="6"/><ellipse cx="70" cy="115" rx="42" ry="72" fill="#a96b38"/><ellipse cx="230" cy="115" rx="42" ry="72" fill="#a96b38"/><circle cx="112" cy="128" r="13"/><circle cx="188" cy="128" r="13"/><circle cx="112" cy="126" r="5" fill="#fff"/><circle cx="188" cy="126" r="5" fill="#fff"/><ellipse cx="150" cy="163" rx="34" ry="26" fill="#fff"/><ellipse cx="150" cy="158" rx="16" ry="11" fill="#252525"/><path d="M138 181Q150 195 162 181" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/></svg>',cat:'<svg viewBox="0 0 300 260" class="objectArt shadow3d"><defs><linearGradient id="catg"><stop stop-color="#ffe8bf"/><stop offset="1" stop-color="#d79b5b"/></linearGradient></defs><path d="M65 98L70 30L125 67Q150 55 175 67L230 30L235 98Q250 140 225 185Q190 230 150 230Q110 230 75 185Q50 140 65 98Z" fill="url(#catg)" stroke="#9b6a39" stroke-width="6"/><circle cx="112" cy="125" r="13"/><circle cx="188" cy="125" r="13"/><circle cx="112" cy="123" r="5" fill="#fff"/><circle cx="188" cy="123" r="5" fill="#fff"/><path d="M150 145l-13 10h26z" fill="#e85b73"/><path d="M150 155Q135 174 116 168M150 155Q165 174 184 168" fill="none" stroke="#444" stroke-width="5"/></svg>',apple:'<svg viewBox="0 0 300 260" class="objectArt shadow3d"><defs><linearGradient id="ap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6b7c"/><stop offset=".5" stop-color="#e91e4d"/><stop offset="1" stop-color="#a80f36"/></linearGradient></defs><path d="M150 62C125 28 84 30 72 66C52 126 70 210 150 230C230 210 248 126 228 66C216 30 175 28 150 62Z" fill="url(#ap)" stroke="#8c1634" stroke-width="6"/><path d="M150 62Q151 22 174 8" fill="none" stroke="#5a371e" stroke-width="10" stroke-linecap="round"/><path d="M171 20Q205 4 219 27Q191 40 171 20Z" fill="#45a33b" stroke="#2e7529" stroke-width="4"/></svg>'}[d[0]];$('msg').style.display='none';let opts=[d[1],d[1]==='KÖPEK'?'KEDİ':d[1]==='KEDİ'?'ELMA':'KÖPEK'].sort(()=>Math.random()-.5);$('choices').innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(b,x===d[1]);$('choices').appendChild(b)})}function answer(b,ok){if(ok){b.classList.add('correct');score+=10;$('score').textContent=score;$('msg').style.display='block';$('msg').className='feedback success';$('msg').textContent='✅ Aferin!';setTimeout(()=>{Q++;if(Q>=2){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},800)}else{b.classList.add('wrong');$('msg').style.display='block';$('msg').className='feedback error';$('msg').textContent='❌ Tekrar dene!'}}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
