<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Harf Yarışı</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:200;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:24px;padding:10px 14px;box-shadow:0 10px 30px #16425b30;text-align:center;backdrop-filter:blur(8px)}.title{font-size:clamp(25px,5vw,40px);font-weight:1000;color:#172f49}.mission{font-size:clamp(17px,3.4vw,25px);font-weight:900;margin-top:2px}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:clamp(15px,3vw,20px);flex-wrap:wrap;margin-top:6px}.btn{border:0;border-radius:22px;padding:14px 25px;color:#fff;font-size:clamp(17px,3vw,23px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #0002}.home{position:absolute;z-index:500;left:24px;bottom:14px;background:#1680d8}.restart{position:absolute;z-index:500;right:24px;bottom:14px;background:#f5a020}.feedback{position:absolute;z-index:450;left:50%;transform:translateX(-50%);top:130px;background:#fff;border-radius:24px;padding:13px 25px;font-size:clamp(18px,4vw,28px);font-weight:1000;box-shadow:0 12px 30px #0002;display:none;text-align:center}.success{color:#119a62}.error{color:#d62828}.celebrate{position:absolute;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(4px)}.panel{width:min(460px,90%);background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 70px #0005}.panel h1{margin:8px 0;font-size:38px}.panel p{font-size:20px;font-weight:800}.big{font-size:78px;filter:drop-shadow(0 12px 8px #0003)}.hidden{display:none!important}.confetti{position:absolute;width:11px;height:20px;top:42%;z-index:900;animation:conf 1s ease-out forwards;pointer-events:none}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}@media(max-width:600px){.hud{top:6px;padding:8px 10px}.home{left:20px;bottom:12px}.restart{right:20px;bottom:12px}.btn{padding:13px 19px;border-radius:20px}.feedback{top:118px;max-width:90%}}body{background:#71c96b}.game{background:linear-gradient(#7ed9ff 0 22%,#70c768 22% 100%)}.road{position:absolute;left:8%;right:8%;top:225px;bottom:88px;background:linear-gradient(90deg,#4a4e53,#34383c 48%,#3c4045);border-left:10px solid #eee;border-right:10px solid #eee;border-radius:8px;overflow:hidden}.road:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,#ffffff13 0 3px,transparent 3px 82px);animation:road .45s linear infinite}.laneLine{position:absolute;top:0;bottom:0;width:5px;background:repeating-linear-gradient(to bottom,#fff9 0 30px,transparent 30px 60px);z-index:2}.l1{left:33.333%}.l2{left:66.666%}.target{position:absolute;top:-105px;width:clamp(78px,14vw,112px);height:clamp(78px,14vw,112px);border-radius:26px;background:linear-gradient(145deg,#fff,#eaf2fa);border:8px solid #ffd166;display:grid;place-items:center;font-size:clamp(38px,8vw,62px);font-weight:1000;box-shadow:inset 0 3px 0 #fff,0 13px 22px #0006;z-index:40;animation:fall linear forwards}.target b{pointer-events:none}.car{position:absolute;bottom:26px;width:112px;height:178px;z-index:80;transition:left .16s ease;transform:translateX(-50%);filter:drop-shadow(0 15px 8px #0007)}.car svg{width:100%;height:100%}.controls{position:absolute;z-index:510;bottom:93px;left:50%;transform:translateX(-50%);display:flex;gap:20px}.ctrl{width:74px;height:62px;border:0;border-radius:20px;background:#fff;box-shadow:0 7px 18px #0004;font-size:32px;font-weight:1000;touch-action:manipulation}.question{position:absolute;z-index:210;top:188px;left:50%;transform:translateX(-50%);background:#fff;border-radius:24px;padding:10px 26px;min-width:260px;text-align:center;font-weight:1000;font-size:clamp(20px,4vw,30px);box-shadow:0 8px 20px #0002}.question b{font-size:1.35em;color:#0878d1}.impact{animation:shake .38s ease}.damaged{filter:grayscale(.15) brightness(.62) drop-shadow(0 0 12px #f00)}.smoke{position:absolute;z-index:100;bottom:170px;left:50%;font-size:48px;opacity:0;animation:smoke .8s ease forwards;pointer-events:none}@keyframes road{to{transform:translateY(80px)}}@keyframes fall{to{transform:translateY(115vh)}}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}@keyframes smoke{20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🚗 Harf Yarışı</div><div class="mission">Doğru harfe çarp, arabayı şeritte hareket ettir!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="question" id="question"></div><div class="feedback" id="msg"></div><div class="road"><div class="laneLine l1"></div><div class="laneLine l2"></div><div id="targets"></div><div class="car" id="car"><svg viewBox="0 0 120 190"><defs><linearGradient id="carred" x1="0" x2="1"><stop stop-color="#ff6258"/><stop offset=".48" stop-color="#df1f2a"/><stop offset="1" stop-color="#980d17"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8fbff"/><stop offset=".5" stop-color="#6dd5f7"/><stop offset="1" stop-color="#2584b6"/></linearGradient></defs><rect x="16" y="4" width="88" height="182" rx="40" fill="url(#carred)" stroke="#7b0b13" stroke-width="5"/><rect x="26" y="24" width="68" height="60" rx="18" fill="url(#glass)" stroke="#174f69" stroke-width="5"/><rect x="30" y="93" width="60" height="45" rx="13" fill="#fff09a" stroke="#b27b00" stroke-width="4"/><rect x="4" y="38" width="17" height="39" rx="8" fill="#17191d"/><rect x="99" y="38" width="17" height="39" rx="8" fill="#17191d"/><rect x="4" y="122" width="17" height="39" rx="8" fill="#17191d"/><rect x="99" y="122" width="17" height="39" rx="8" fill="#17191d"/><path d="M43 14h34" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="60" cy="163" r="9" fill="#fff"/></svg></div></div><div class="controls"><button class="ctrl" id="left">⬅️</button><button class="ctrl" id="right">➡️</button></div><div class="smoke" id="smoke">💨</div><div id="confetti"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🏆🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next" style="background:#1680d8">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[['A','B','C'],'A'],[['D','E','F'],'E'],[['G','H','I'],'H'],[['J','K','L'],'L'],[['M','N','O'],'N'],[['P','R','S'],'R'],[['T','U','Ü'],'Ü'],[['Ç','Ş','Z'],'Ç'],[['B','D','G'],'G'],[['K','L','M'],'M'],[['A','E','İ'],'İ'],[['O','Ö','U'],'Ö'],[['C','Ç','S'],'Ç'],[['Ğ','G','H'],'Ğ'],[['I','İ','J'],'I'],[['K','N','R'],'N'],[['L','O','P'],'P'],[['M','Ş','T'],'Ş'],[['R','S','V'],'S'],[['U','Ü','Y'],'Y'],[['A','Ö','Z'],'Z'],[['B','İ','K'],'İ'],[['Ç','D','E'],'D'],[['F','Ğ','H'],'Ğ'],[['J','M','N'],'J']];let L=0,Q=0,score=0,lane=1,locked=false,timer;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function move(d){if(locked)return;lane=Math.max(0,Math.min(2,lane+d));$('car').style.left=((lane+.5)*33.333)+'%'}function confetti(){const c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<45;i++){const p=document.createElement('i');p.className='confetti';p.style.left='50%';p.style.setProperty('--x',(Math.random()*380-190)+'px');p.style.setProperty('--y',(Math.random()*330-230)+'px');p.style.background=['#ff4d6d','#ffd166','#06d6a0','#4dabf7','#9b5de5'][i%5];c.appendChild(p)}}function render(){locked=false;lane=1;move(0);$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;const d=qs[L*5+Q];$('question').innerHTML='Hangi harfi yakala? <b>'+d[1]+'</b>';const holder=$('targets');holder.innerHTML='';const dur=Math.max(3.2,5-L*.4);d[0].forEach((x,i)=>{const t=document.createElement('div');t.className='target';t.innerHTML='<b>'+x+'</b>';t.style.left=(i*33.333+16.666)+'%';t.style.marginLeft='-56px';t.style.animationDuration=dur+'s';t.dataset.lane=i;t.dataset.value=x;holder.appendChild(t)});clearTimeout(timer);timer=setTimeout(()=>collision(d[1]),dur*1000-150)}function collision(target){if(locked)return;const hit=[...document.querySelectorAll('.target')].find(t=>+t.dataset.lane===lane);locked=true;if(hit&&hit.dataset.value===target){hit.style.animationPlayState='paused';$('car').classList.add('impact');$('msg').className='feedback success';$('msg').textContent='🎉 💥 Harika! Doğru harf!';$('msg').style.display='block';score+=10;$('score').textContent=score;confetti();speak('Aferin! Doğru!');setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else{$('msg').style.display='none';$('car').classList.remove('impact');render()}},900)}else{$('car').classList.add('damaged','impact');$('smoke').style.opacity='1';$('msg').className='feedback error';$('msg').textContent='💥 Yanlış harf! Araba zarar gördü!';$('msg').style.display='block';speak('Yanlış.');setTimeout(()=>{$('car').classList.remove('damaged','impact');$('smoke').style.opacity='0';render()},1100)}}$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();render();</script></body></html>
