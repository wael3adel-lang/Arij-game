<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Harf Yarışı</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#14263d}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:rgba(255,255,255,.94);border-radius:24px;padding:10px 14px;text-align:center;box-shadow:0 10px 30px rgba(20,40,60,.18);border:2px solid rgba(255,255,255,.9)}.title{font-size:clamp(25px,5vw,38px);font-weight:1000}.mission{font-size:clamp(16px,3.2vw,23px);font-weight:900;margin-top:2px}.stats{font-size:clamp(13px,2.5vw,17px);font-weight:900;margin-top:5px}.btn{border:0;border-radius:18px;padding:13px 20px;background:#1677d2;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #0b5da9}.home,.restart{position:absolute;z-index:200;bottom:14px}.home{left:20px}.restart{right:20px;background:#f59b23;box-shadow:0 5px 0 #c9760e}.feedback{position:absolute;z-index:150;top:120px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff;font-size:20px;font-weight:1000;box-shadow:0 8px 24px #0002;display:none}.success{color:#0b9f6a}.error{color:#d62828}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,39,62,.38);z-index:300}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:28px;border-radius:30px;text-align:center;box-shadow:0 25px 60px #0005}.big{font-size:76px}.hidden{display:none!important}.shadow3d{filter:drop-shadow(0 12px 8px rgba(0,0,0,.22))}
body{background:#74c96a}.game{background:linear-gradient(#8bdcff 0 20%,#72c96b 20% 100%)}.road{position:absolute;left:8%;right:8%;top:158px;bottom:86px;background:#35383c;border-left:12px solid #e9e9e9;border-right:12px solid #e9e9e9;overflow:hidden;border-radius:4px}.laneLine{position:absolute;top:0;bottom:0;width:5px;background:repeating-linear-gradient(to bottom,#fff9 0 30px,transparent 30px 58px)}.l1{left:33.333%}.l2{left:66.666%}.roadmove{position:absolute;inset:-100% 0;background:repeating-linear-gradient(to bottom,transparent 0 48px,#ffffff24 48px 76px);animation:road .55s linear infinite}.target{position:absolute;top:-100px;width:clamp(72px,13vw,100px);height:clamp(72px,13vw,100px);border-radius:25px;background:linear-gradient(#fff,#eef5fb);border:7px solid #ffd166;display:grid;place-items:center;font-size:clamp(32px,7vw,55px);font-weight:1000;box-shadow:0 10px 20px #0005;z-index:40;animation:fall linear forwards}.target b{pointer-events:none}.car{position:absolute;bottom:20px;width:100px;height:160px;z-index:60;transition:left .16s ease;transform:translateX(-50%)}.controls{position:absolute;z-index:210;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:18px}.ctrl{width:66px;height:66px;border:0;border-radius:50%;background:#fff;box-shadow:0 7px 18px #0004;font-size:32px;touch-action:manipulation}.impact{animation:shake .38s ease}.broken{filter:grayscale(.2) brightness(.7) drop-shadow(0 0 10px #f00)}.confetti{position:absolute;z-index:120;inset:0;pointer-events:none}.piece{position:absolute;width:10px;height:18px;animation:conf 900ms ease-out forwards}@keyframes road{to{transform:translateY(124px)}}@keyframes fall{to{transform:translateY(120vh)}}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🚗 Harf Yarışı</div><div class="mission">Doğru harfe çarp, arabayı şeritte hareket ettir!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="question" id="question"></div><div class="feedback" id="msg"></div><div class="road"><div class="laneLine l1"></div><div class="laneLine l2"></div><div class="roadmove"></div><div id="targets"></div><div class="car" id="car"><svg viewBox="0 0 120 190" class="shadow3d" aria-label="Araba"><defs><linearGradient id="cg" x1="0" x2="1"><stop stop-color="#ff4a45"/><stop offset=".5" stop-color="#d71920"/><stop offset="1" stop-color="#a90d15"/></linearGradient><linearGradient id="wg"><stop stop-color="#b9f1ff"/><stop offset="1" stop-color="#399ac7"/></linearGradient></defs><rect x="17" y="4" width="86" height="182" rx="38" fill="url(#cg)" stroke="#7e0b12" stroke-width="5"/><rect x="26" y="25" width="68" height="56" rx="18" fill="url(#wg)" stroke="#13516c" stroke-width="5"/><rect x="31" y="91" width="58" height="43" rx="13" fill="#ffe98a" stroke="#b57b00" stroke-width="4"/><rect x="5" y="36" width="16" height="39" rx="8" fill="#1b1d21"/><rect x="99" y="36" width="16" height="39" rx="8" fill="#1b1d21"/><rect x="5" y="119" width="16" height="39" rx="8" fill="#1b1d21"/><rect x="99" y="119" width="16" height="39" rx="8" fill="#1b1d21"/><path d="M43 13h34" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="60" cy="160" r="9" fill="#fff"/></svg></div></div><div class="controls"><button class="ctrl" id="left">⬅️</button><button class="ctrl" id="right">➡️</button></div><div class="confetti" id="confetti"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="big">🚗💨</div><h1>Harf Yarışı</h1><p>Arabayı üç şerit arasında hareket ettir ve doğru harfe çarp.</p><button class="btn" id="startBtn">Yarışa Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🏆🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[['A','B','C'],'A'],[['D','E','F'],'E'],[['G','H','I'],'H'],[['J','K','L'],'L'],[['M','N','O'],'N'],[['P','R','S'],'R'],[['T','U','Ü'],'Ü'],[['Ç','Ş','Z'],'Ç'],[['B','D','G'],'G'],[['K','L','M'],'M'],[['A','E','İ'],'İ'],[['O','Ö','U'],'Ö'],[['C','Ç','S'],'Ç'],[['Ğ','G','H'],'Ğ'],[['I','İ','J'],'I'],[['K','N','R'],'N'],[['L','O','P'],'P'],[['M','Ş','T'],'Ş'],[['R','S','V'],'S'],[['U','Ü','Y'],'Y'],[['A','Ö','Z'],'Z'],[['B','İ','K'],'İ'],[['Ç','D','E'],'D'],[['F','Ğ','H'],'Ğ'],[['J','M','N'],'J']];let L=0,Q=0,score=0,lane=1,locked=false,timer;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function move(d){if(locked)return;lane=Math.max(0,Math.min(2,lane+d));$('car').style.left=((lane+.5)*33.333)+'%'}function confetti(){let c=$('confetti');c.innerHTML='';for(let i=0;i<35;i++){let p=document.createElement('i');p.className='piece';p.style.left='50%';p.style.top='45%';p.style.setProperty('--x',(Math.random()*320-160)+'px');p.style.setProperty('--y',(Math.random()*320-220)+'px');p.style.transform='rotate('+Math.random()*360+'deg)';p.style.background=['#ff4d6d','#ffd166','#06d6a0','#4dabf7','#9b5de5'][i%5];c.appendChild(p)}}function render(){locked=false;lane=1;move(0);$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;let d=qs[L*5+Q];$('question').textContent='Hangi harfi yakala? '+d[1];$('msg').style.display='block';$('msg').textContent='Doğru harfin olduğu şeride git!';let holder=$('targets');holder.innerHTML='';let dur=Math.max(3.1,5-L*.45);d[0].forEach((x,i)=>{let t=document.createElement('div');t.className='target';t.innerHTML='<b>'+x+'</b>';t.style.left=(i*33.333+16.666)+'%';t.style.marginLeft='-50px';t.style.animationDuration=dur+'s';t.dataset.lane=i;t.dataset.value=x;holder.appendChild(t)});clearTimeout(timer);timer=setTimeout(()=>collision(d[1]),dur*1000-180)}function collision(target){if(locked)return;let hit=[...document.querySelectorAll('.target')].find(t=>Number(t.dataset.lane)===lane);if(hit&&hit.dataset.value===target){locked=true;hit.style.animationPlayState='paused';$('car').classList.add('impact');$('msg').className='feedback success';$('msg').textContent='💥 🎉 Harika!';score+=10;$('score').textContent=score;confetti();speak('Aferin! Doğru!');setTimeout(()=>{$('car').classList.remove('impact');Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},850)}else{locked=true;$('car').classList.add('broken','impact');$('msg').className='feedback error';$('msg').textContent='💥 Çarpışma! Tekrar dene!';speak('Yanlış. Tekrar dene.');setTimeout(()=>{$('car').classList.remove('broken','impact');render()},900)}}$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
