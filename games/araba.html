<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Harf Yarışı</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.btn{border:0;border-radius:16px;padding:12px 20px;background:#1677d2;color:#fff;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation}.home{position:absolute;z-index:90;bottom:12px;left:12px}.restart{position:absolute;z-index:90;bottom:12px;right:12px;background:#f39a28}.hud{position:absolute;z-index:70;top:8px;left:50%;transform:translateX(-50%);width:min(920px,94%);background:#fffffff2;border-radius:22px;padding:9px 14px;text-align:center;box-shadow:0 8px 25px #0002}.title{font-size:clamp(26px,4vw,36px);font-weight:1000}.mission{font-size:clamp(17px,3vw,23px);font-weight:900}.stats{font-weight:900;font-size:14px}.screen,.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#173c5c99;z-index:100}.celebrate{display:none}.panel{background:#fff;width:min(470px,90%);padding:30px;border-radius:30px;text-align:center;box-shadow:0 20px 55px #0005}.big{font-size:70px}.hidden{display:none!important}body{background:#82c8ff}.game{height:100%;position:relative;background:linear-gradient(#8ed7ff 0 22%,#69b75f 22% 100%);overflow:hidden}.road{position:absolute;left:7%;right:7%;top:150px;bottom:58px;background:#454545;border-left:12px solid #ddd;border-right:12px solid #ddd;overflow:hidden}.lane{position:absolute;top:0;bottom:0;width:33.333%;border-right:6px dashed #ffffff66}.lane:nth-child(1){left:0}.lane:nth-child(2){left:33.333%}.lane:nth-child(3){left:66.666%;border:0}.roadline{position:absolute;inset:-100% 0;background:repeating-linear-gradient(to bottom,transparent 0 55px,#fff6 55px 85px);animation:road .8s linear infinite}.car{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:65px;z-index:50;transition:left .16s ease;filter:drop-shadow(0 7px 4px #0006)}.target{position:absolute;top:-100px;width:94px;height:80px;border-radius:22px;background:#fff;border:5px solid #ffd166;display:grid;place-items:center;font-size:32px;font-weight:1000;box-shadow:0 8px 16px #0004;z-index:30;animation:down linear forwards;cursor:pointer;touch-action:manipulation}.target.correct{border-color:#06d6a0}.question{position:absolute;z-index:70;top:112px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:8px 18px;font-size:21px;font-weight:1000}.message{position:absolute;z-index:70;top:196px;left:50%;transform:translateX(-50%);background:#ffffffdd;border-radius:15px;padding:7px 14px;font-weight:1000;white-space:nowrap}.controls{position:absolute;z-index:80;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px}.ctrl{border:0;border-radius:50%;width:58px;height:58px;background:#fff;font-size:28px;box-shadow:0 6px 14px #0003;cursor:pointer;touch-action:manipulation}@keyframes road{to{transform:translateY(140px)}}@keyframes down{to{transform:translateY(115vh)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🚗 Harf Yarışı</div><div class="mission">Doğru harfe çarp, arabayı şeritte hareket ettir!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="question" id="question"></div><div class="message" id="msg">⬅️ ➡️ Arabayı hareket ettir!</div><div class="road"><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="roadline"></div><div class="car" id="car">🚗</div><div id="targets"></div></div><div class="controls"><button class="ctrl" id="left">⬅️</button><button class="ctrl" id="right">➡️</button></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="big">🚗💨</div><h1>Harf Yarışı</h1><p>Arabayı üç şerit arasında hareket ettir ve doğru harfi yakala.</p><button class="btn" id="startBtn">Yarışa Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🏆🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[['A','B','C'],'A'],[['D','E','F'],'E'],[['G','H','I'],'H'],[['J','K','L'],'L'],[['M','N','O'],'N'],[['P','R','S'],'R'],[['T','U','Ü'],'Ü'],[['Ç','Ş','Z'],'Ç'],[['B','D','G'],'G'],[['K','L','M'],'M'],[['A','E','İ'],'İ'],[['O','Ö','U'],'Ö'],[['C','Ç','S'],'Ç'],[['Ğ','G','H'],'Ğ'],[['I','İ','J'],'I'],[['K','N','R'],'N'],[['L','O','P'],'P'],[['M','Ş','T'],'Ş'],[['R','S','V'],'S'],[['U','Ü','Y'],'Y'],[['A','Ö','Z'],'Z'],[['B','İ','K'],'İ'],[['Ç','D','E'],'D'],[['F','Ğ','H'],'Ğ'],[['J','M','N'],'J']];let L=0,Q=0,score=0,lane=1,locked=false,timer=null;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function move(d){if(locked)return;lane=Math.max(0,Math.min(2,lane+d));$('car').style.left=((lane+.5)*33.333)+'%'}function render(){locked=false;lane=1;move(0);$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;let d=qs[L*5+Q];$('question').textContent='Hangi harfi yakala? '+d[1];$('msg').textContent='Doğru harfin olduğu şeride git!';speak('Hangi harfi yakala? '+d[1]);let holder=$('targets');holder.innerHTML='';d[0].forEach((x,i)=>{let t=document.createElement('div');t.className='target '+(x===d[1]?'correct':'');t.textContent=x;t.style.left=(i*33.333+16.666-8)+'%';t.style.animationDuration=(4.8-L*.5)+'s';t.dataset.lane=i;t.onclick=()=>{lane=i;move(0)};holder.appendChild(t)});clearTimeout(timer);timer=setTimeout(()=>collision(d[1]),(4.8-L*.5)*1000-450)}function collision(target){if(locked)return;let ts=[...document.querySelectorAll('.target')];let hit=ts.find(t=>t.dataset.lane==lane);if(hit&&hit.textContent===target){locked=true;score+=10;$('score').textContent=score;$('msg').textContent='💥 Aferin! Doğru harf!';speak('Aferin! Doğru!');hit.style.transform='translateY(80vh) scale(1.2)';setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı! Hız arttı.';$('celebrate').style.display='flex'}else render()},500)}else{locked=true;$('msg').textContent='❌ Yanlış harfe çarptın!';speak('Yanlış!');setTimeout(()=>render(),650)}}$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
