<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Harf Yarışı</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:linear-gradient(#8edcff,#7bc96d)}.race{position:absolute;inset:142px 0 95px;display:flex;justify-content:center}.road{position:relative;width:min(700px,88vw);height:100%;background:repeating-linear-gradient(to bottom,#363a3e 0 78px,#50555b 78px 156px);border-left:10px solid #f5f5f5;border-right:10px solid #f5f5f5;border-radius:12px;overflow:hidden;box-shadow:0 12px 35px #0003}.laneLine{position:absolute;top:0;bottom:0;width:7px;background:repeating-linear-gradient(to bottom,#ffffffaa 0 34px,transparent 34px 70px);z-index:2}.l1{left:33.33%}.l2{left:66.66%}.targetBox{position:absolute;z-index:30;top:8px;left:50%;transform:translateX(-50%);background:#fff;border-radius:0 0 22px 22px;padding:8px 25px 11px;text-align:center;font-size:20px;font-weight:1000;box-shadow:0 8px 18px #0003;min-width:190px}.targetBox b{display:block;font-size:58px;line-height:1;color:#e33}.letterCard{position:absolute;top:-95px;width:100px;height:82px;border:7px solid #ffd15c;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:1000;z-index:6;box-shadow:0 8px 18px #0004}.fall{animation:fallDown var(--speed) linear forwards}.car{position:absolute;z-index:12;bottom:18px;width:33.33%;transition:left .18s ease}.car svg{width:min(170px,80%);height:auto;filter:drop-shadow(0 10px 6px #0007)}.car.hit{animation:carHit .55s}.car.damage{animation:carDamage .65s}.smoke{position:absolute;z-index:14;bottom:95px;left:15%;font-size:32px;opacity:0}.damageSmoke{animation:smoke .8s forwards}.message{position:absolute;z-index:35;top:152px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 18px;font-weight:1000}.controls{position:absolute;z-index:50;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:25px}.controls button{width:76px;height:60px;border:0;border-radius:50%;background:#fff;box-shadow:0 8px 20px #0003;font-size:33px;cursor:pointer;touch-action:manipulation}.success{color:#15945d}.wrong{color:#d34848}@keyframes fallDown{to{top:calc(100% + 110px)}}@keyframes carHit{45%{transform:scale(1.12) translateY(-7px)}to{transform:scale(1)}}@keyframes carDamage{15%{transform:translateX(-10px) rotate(-4deg)}35%{transform:translateX(12px) rotate(4deg)}55%{transform:translateX(-9px)}75%{transform:translateX(7px)}100%{transform:none;filter:grayscale(.55) drop-shadow(0 0 12px #e33)}}@keyframes smoke{to{transform:translate(-20px,-65px) scale(1.8);opacity:0}}@media(max-width:600px){.race{inset:150px 0 94px}.road{width:88vw}.targetBox{font-size:16px;min-width:170px}.targetBox b{font-size:49px}.letterCard{width:82px;height:68px;font-size:39px}.car svg{width:135px}.message{top:160px;font-size:15px}.controls button{width:68px;height:55px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🚗 Harf Yarışı</div><div class="mission">Doğru harfe çarp, arabayı şeritte hareket ettir!</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="race"><div class="targetBox" id="targetBox"></div><div class="road" id="road"><div class="laneLine l1"></div><div class="laneLine l2"></div><div id="cards"></div><div class="car" id="car"><svg viewBox="0 0 220 130"><defs><linearGradient id="carRed" x1="0" x2="1"><stop stop-color="#ff4b4b"/><stop offset=".5" stop-color="#d71920"/><stop offset="1" stop-color="#8b0e12"/></linearGradient><linearGradient id="glass" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#bdefff"/><stop offset="1" stop-color="#3987aa"/></linearGradient></defs><ellipse cx="112" cy="112" rx="88" ry="10" fill="#0005"/><path d="M34 87 Q42 55 72 50 L92 26 Q102 17 120 17 L158 17 Q171 20 181 43 L193 54 Q204 62 206 88 L196 100 L26 100 Q23 91 34 87Z" fill="url(#carRed)" stroke="#7d0d11" stroke-width="4"/><path d="M82 50 L98 29 Q103 24 114 24 L137 24 L153 50Z" fill="url(#glass)" stroke="#6b8794" stroke-width="3"/><path d="M60 53 L78 51" stroke="#ff8b8b" stroke-width="5"/><circle cx="64" cy="100" r="23" fill="#222"/><circle cx="64" cy="100" r="12" fill="#aeb8c0"/><circle cx="170" cy="100" r="23" fill="#222"/><circle cx="170" cy="100" r="12" fill="#aeb8c0"/><rect x="182" y="65" width="12" height="9" rx="3" fill="#ffe77a"/></svg></div><div class="smoke" id="smoke">💨</div></div></div><div class="message" id="msg"></div><div class="controls"><button id="left">⬅️</button><button id="right">➡️</button></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🚗</div><h1>Harf Yarışı</h1><p>Doğru harfin bulunduğu şeride geç!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>const questions=['K','A','B','G','E','T','M','Ç','Z','F','S','D'];let L=0,Q=0,score=0,lane=1,target='',active=false,locked=false;const $=id=>document.getElementById(id);function render(){active=true;locked=false;lane=Math.floor(Math.random()*3);target=questions[(L*2+Q)%questions.length];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('targetBox').innerHTML='Hangi harfi yakala?<b>'+target+'</b>';$('msg').className='message';$('msg').textContent='Doğru harfin olduğu şeride geç!';$('cards').innerHTML='';const vals=[target];while(vals.length<3){const x=questions[Math.floor(Math.random()*questions.length)];if(!vals.includes(x))vals.push(x)}vals.sort(()=>Math.random()-.5);vals.forEach((x,i)=>{const c=document.createElement('div');c.className='letterCard fall';c.textContent=x;c.style.left=(i*33.333+16.666)+'%';c.style.transform='translateX(-50%)';c.style.setProperty('--speed',(5.5-L*.55)+'s');c.addEventListener('animationend',()=>{if(!active||locked)return;if(i===lane&&x===target)hit(c);else if(i===lane&&x!==target)wrong(c);else if(i!==lane&&x===target)miss()});$('cards').appendChild(c)});moveCar()}function moveCar(){$('car').style.left=(lane*33.333)+'%'}function choose(d){if(!active||locked)return;lane=Math.max(0,Math.min(2,lane+d));moveCar()}function hit(c){locked=true;active=false;score+=10;$('car').classList.add('hit');$('msg').className='message success';$('msg').textContent='🎉 Doğru! Harika!';c.style.borderColor='#35c98a';confetti();setTimeout(()=>{Q++;$('car').classList.remove('hit');Q>=5?done():render()},700)}function wrong(c){locked=true;active=false;$('car').classList.add('damage');$('smoke').classList.add('damageSmoke');$('msg').className='message wrong';$('msg').textContent='💥 Yanlış harf! Araba zarar gördü.';setTimeout(()=>{$('car').classList.remove('damage');$('smoke').classList.remove('damageSmoke');render()},900)}function miss(){locked=true;active=false;$('car').classList.add('damage');$('smoke').classList.add('damageSmoke');$('msg').className='message wrong';$('msg').textContent='💨 Doğru harfi kaçırdın!';setTimeout(()=>{$('car').classList.remove('damage');$('smoke').classList.remove('damageSmoke');render()},900)}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('left').onclick=()=>choose(-1);$('right').onclick=()=>choose(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose(-1);if(e.key==='ArrowRight')choose(1)});$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
