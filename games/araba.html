<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Harf Yarışı</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#fff4dc);color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.target{font-size:1.5em;color:#e95c38}.stats{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:#35c98a}.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:white;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.red{background:#db5353}.content{position:absolute;inset:130px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{min-width:90px;min-height:72px;border:0;border-radius:20px;background:white;box-shadow:0 8px 18px #0002;font-size:26px;font-weight:1000;cursor:pointer;padding:12px;touch-action:manipulation}.choice:hover{transform:translateY(-2px)}.picture{font-size:110px;filter:drop-shadow(0 8px 5px #0002)}.message{min-height:35px;font-weight:1000;font-size:20px;margin:8px}.success{color:#15945d}.wrong{color:#d34848}.celebrate{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.confetti{position:absolute;width:11px;height:20px;top:-30px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}.home{position:absolute;z-index:30;left:12px;bottom:12px}.restart{position:absolute;z-index:30;right:12px;bottom:12px}.small{font-size:14px;color:#668}.hidden{display:none!important}@media(max-width:600px){.hud{top:5px}.content{inset:125px 0 60px}.choice{min-width:78px;min-height:64px;font-size:22px}.picture{font-size:82px}.panel{padding:22px}.btn{font-size:16px}}
*{user-select:none}.race{position:absolute;inset:145px 0 90px;display:flex;justify-content:center}.road{position:relative;width:min(700px,88vw);height:100%;min-height:520px;background:repeating-linear-gradient(to bottom,#3b3e42 0 75px,#50545a 75px 150px);border-left:10px solid #f1f1f1;border-right:10px solid #f1f1f1;border-radius:12px;overflow:hidden;box-shadow:0 12px 35px #0003}.laneLine{position:absolute;top:0;bottom:0;width:7px;background:repeating-linear-gradient(to bottom,#ffffffaa 0 34px,transparent 34px 70px);z-index:2}.l1{left:33.33%}.l2{left:66.66%}.targetBox{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:20;background:#fff;border-radius:0 0 22px 22px;padding:9px 26px 12px;font-size:23px;font-weight:1000;box-shadow:0 8px 18px #0003}.targetBox b{display:inline-block;font-size:48px;color:#e34c4c;margin-left:8px}.letterCard{position:absolute;top:-95px;width:92px;height:76px;border:7px solid #ffd15c;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:1000;z-index:5;box-shadow:0 8px 18px #0004}.fall{animation:fallDown var(--speed) linear forwards}.car{position:absolute}.race #car{position:absolute;bottom:30px;left:0;width:33.33%;text-align:center;font-size:78px;z-index:10;filter:drop-shadow(0 9px 5px #0006);transition:left .18s ease}.damage{animation:damage .45s}.hit{animation:hit .4s}@keyframes fallDown{to{top:calc(100% + 100px)}}@keyframes damage{25%{transform:translateX(-10px) rotate(-5deg);filter:grayscale(.6) drop-shadow(0 0 10px #e33)}50%{transform:translateX(10px) rotate(5deg)}to{transform:none}}@keyframes hit{50%{transform:scale(1.2)}to{transform:none}}.message{position:absolute;top:130px;left:50%;transform:translateX(-50%);z-index:25;background:#fff;padding:9px 22px;border-radius:18px;font-size:19px;font-weight:1000}.controls{position:absolute;z-index:35;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:28px}.controls button{width:78px;height:64px;border:0;border-radius:50%;background:#fff;box-shadow:0 8px 20px #0003;font-size:34px;touch-action:manipulation}.success{color:#15945d}.wrong{color:#d34848}@media(max-width:600px){.race{inset:155px 0 92px}.road{min-height:450px}.letterCard{width:78px;height:66px;font-size:36px}.race #car{font-size:68px}.targetBox{font-size:18px}.targetBox b{font-size:40px}.message{top:142px;font-size:16px;max-width:85%;text-align:center}.controls button{width:70px;height:58px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game" style="background:linear-gradient(#8ddcff,#78c65f)"><div class="hud"><div class="title">🚗 Harf Yarışı</div><div class="mission">Doğru harfe çarp, arabayı şeritte hareket ettir!</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="race"><div class="targetBox" id="targetBox"></div><div class="road" id="road"><div class="laneLine l1"></div><div class="laneLine l2"></div><div id="cards"></div><div id="car">🚗</div></div></div><div class="message" id="msg"></div><div class="controls"><button id="left">⬅️</button><button id="right">➡️</button></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🚗</div><h1>Harf Yarışı</h1><p>Doğru harfin bulunduğu şeride geç!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const questions=[['K','KEDİ'],['A','ARABA'],['B','BALIK'],['G','GÜNEŞ'],['E','ELMA'],['T','TAVŞAN'],['M','MUZ'],['Ç','ÇİLEK'],['Z','ZÜRAFA'],['F','FİL']];let L=0,Q=0,score=0,lane=1,active=false,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;active=true;lane=Math.min(2,Math.floor(Math.random()*3));let q=questions[(L*2+Q)%questions.length],target=q[0];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('targetBox').innerHTML='Yakalanacak harf: <b>'+target+'</b>';$('msg').textContent='Doğru harfin olduğu şeride geç!';$('cards').innerHTML='';let letters=[target];while(letters.length<3){let x=String.fromCharCode(65+Math.floor(Math.random()*26));if(!letters.includes(x))letters.push(x)}letters.sort(()=>Math.random()-.5);letters.forEach((x,i)=>{let c=document.createElement('div');c.className='letterCard';c.textContent=x;c.style.left=(i*33.333+16.666)+'%';c.style.transform='translateX(-50%)';c.style.setProperty('--speed',(4.8-L*.55)+'s');c.classList.add('fall');c.addEventListener('animationend',()=>{if(!locked&&active){if(x===target){handleHit(c,i)}else if(i===lane){handleWrong(c)}}});$('cards').appendChild(c)});moveCar()}function moveCar(){ $('car').style.left=(lane*33.333)+'%'}function choose(dir){if(!active||locked)return;lane=Math.max(0,Math.min(2,lane+dir));moveCar()}function handleHit(c,i){locked=true;active=false;score+=10;$('car').classList.add('hit');$('msg').className='message success';$('msg').textContent='🎉 İsabet! Harika!';c.style.background='#baf5d5';setTimeout(()=>{Q++;$('car').classList.remove('hit');Q>=5?done():render()},650)}function handleWrong(c){locked=true;active=false;$('car').classList.add('damage');$('msg').className='message wrong';$('msg').textContent='💥 Yanlış harf! Araba zarar gördü.';setTimeout(()=>{ $('car').classList.remove('damage');render()},900)}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.5)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('left').onclick=()=>choose(-1);$('right').onclick=()=>choose(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose(-1);if(e.key==='ArrowRight')choose(1)});$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>{L=0;Q=0;score=0;active=false;$('celebrate').style.display='none';$('start').classList.remove('hidden')};</script></body></html>
