<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Harf Yarışı</title><link rel="stylesheet" href="_common.css"><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(#bce8ff,#e6f8d6)}</style></head><body><div class="game"><div class="hud"><div class="title">🚗 Harf Yarışı</div><div class="mission">Doğru harfi seç, araba yarışta ilerlesin.</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div id="track" style="position:relative;width:min(900px,95%);height:250px;background:#75b95a;border:12px solid #555;border-radius:30px;overflow:hidden"><div style="position:absolute;inset:45% 0 0;background:#444;border-top:5px dashed #fff"></div><div id="car" style="position:absolute;left:20px;bottom:25px;font-size:70px;transition:left .45s">🚗</div></div><div class="message" id="msg">Doğru harfi seç ve arabayı ilerlet!</div><div class="choices" id="choices"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🚗</div><h1>Harf Yarışı</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const qs=[[['🐱 KEDİ','K'],['🚗 ARABA','A'],['🐟 BALIK','B']],[['🌞 GÜNEŞ','G'],['🐶 KÖPEK','K'],['🍎 ELMA','E']],[['🐰 TAVŞAN','T'],['🦋 KELEBEK','K'],['🍓 ÇİLEK','Ç']],[['🦁 ASLAN','A'],['🍉 KARPUZ','K'],['🚲 BİSİKLET','B']],[['🦒 ZÜRAFA','Z'],['🐘 FİL','F'],['🌈 GÖKKUŞAĞI','G']]];let L=0,Q=0,score=0;const $=id=>document.getElementById(id);function render(){let a=qs[L][Q%qs[L].length],correct=a[1];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('msg').innerHTML=`${a[0]}<br><b style="font-size:32px">Doğru ilk harfi seç!</b>`;let pool=[correct];while(pool.length<Math.min(3+L,6)){let x='ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ'[Math.floor(Math.random()*29)];if(!pool.includes(x))pool.push(x)}pool.sort(()=>Math.random()-.5);$('choices').innerHTML=pool.map(x=>`<button class="choice">${x}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>{if(b.textContent===correct){score+=10;Q++;$('car').style.left=Math.min(78,20+Q*12)+'%';$('msg').className='message success';$('msg').textContent='Harika! Araba ilerledi!';setTimeout(()=>Q>=5?done():render(),450)}else{$('msg').className='message wrong';$('msg').textContent='Yanlış harf. Tekrar dene!'}})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;$('car').style.left='20px';render()}else{L=0;Q=0;score=0;$('car').style.left='20px';render()}};$('restart').onclick=()=>location.reload();</script></body></html>
