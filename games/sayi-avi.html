<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sayı Avı</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#fff4dc);color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.target{font-size:1.5em;color:#e95c38}.stats{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:#35c98a}.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:white;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.red{background:#db5353}.content{position:absolute;inset:130px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{min-width:90px;min-height:72px;border:0;border-radius:20px;background:white;box-shadow:0 8px 18px #0002;font-size:26px;font-weight:1000;cursor:pointer;padding:12px;touch-action:manipulation}.choice:hover{transform:translateY(-2px)}.picture{font-size:110px;filter:drop-shadow(0 8px 5px #0002)}.message{min-height:35px;font-weight:1000;font-size:20px;margin:8px}.success{color:#15945d}.wrong{color:#d34848}.celebrate{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.confetti{position:absolute;width:11px;height:20px;top:-30px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}.home{position:absolute;z-index:30;left:12px;bottom:12px}.restart{position:absolute;z-index:30;right:12px;bottom:12px}.small{font-size:14px;color:#668}.hidden{display:none!important}@media(max-width:600px){.hud{top:5px}.content{inset:125px 0 60px}.choice{min-width:78px;min-height:64px;font-size:22px}.picture{font-size:82px}.panel{padding:22px}.btn{font-size:16px}}

</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(#74dcff,#0785b5)}</style></head><body><div class="game"><div class="hud"><div class="title">🎣 Sayı Avı</div><div class="mission">Doğru balığı yakala!</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="pic">🐠</div><div class="message" id="msg">Şu sayıyı yakala!</div><div class="choices" id="choices"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎣</div><h1>Sayı Avı</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const levels=[[1,2,3],[1,2,3,4],[2,3,4,5],[3,4,5,6,7],[5,6,7,8,9,10]];let L=0,Q=0,score=0,target;const els=id=>document.getElementById(id);function rnd(a){return a[Math.floor(Math.random()*a.length)]}function speak(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}function render(){let nums=levels[L];target=rnd(nums);els('level').textContent=L+1;els('round').textContent=Q+1;els('score').textContent=score;els('bar').style.width=((Q)/5*100)+'%';els('msg').textContent='Şu sayıyı yakala: '+target;speak('Şu sayıyı yakala '+target);let arr=[target];while(arr.length<Math.min(3+L,6)){let n=rnd(nums);if(!arr.includes(n))arr.push(n)}arr.sort(()=>Math.random()-.5);els('choices').innerHTML=arr.map((n,i)=>`<button class="choice fish">${['🐟','🐠','🐡','🦈','🐙','🪼'][i%6]}<br>${n}</button>`).join('');[...els('choices').children].forEach(b=>b.onclick=()=>{let n=+b.textContent.match(/\d+/)[0];if(n===target){score+=10;Q++;els('msg').className='message success';els('msg').textContent='Aferin! Doğru balığı yakaladın!';speak('Aferin');setTimeout(()=>Q>=5?levelDone():render(),550)}else{score=Math.max(0,score-1);els('msg').className='message wrong';els('msg').textContent='Tekrar dene!'}})}function levelDone(){els('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();els('celebrate').style.display='flex';}function confetti(){for(let i=0;i<70;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1.2+Math.random()*1.8)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3200)}}els('startBtn').onclick=()=>{els('start').classList.add('hidden');render()};els('next').onclick=()=>{els('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};els('restart').onclick=()=>{L=0;Q=0;score=0;els('start').classList.remove('hidden');els('celebrate').style.display='none'};</script></body></html>
