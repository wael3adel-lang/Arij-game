<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sayı Avı</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;background:#63d9ff}.game{height:100%;position:relative;overflow:hidden;background:linear-gradient(#6edfff 0%,#32b8e8 42%,#0878a9 43%,#04527b 100%)}
.hud{position:absolute;z-index:40;top:8px;left:50%;transform:translateX(-50%);width:min(900px,94%);background:#ffffffef;border-radius:22px;padding:8px 14px;text-align:center;box-shadow:0 8px 25px #003b5c55}.title{font-size:clamp(24px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(17px,3vw,24px);font-weight:900}.target{color:#e95c38}.stats{font-weight:900;font-size:14px}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#35c98a;width:0}
.water{position:absolute;inset:43% 0 0;overflow:hidden}.wave{position:absolute;top:-18px;left:-5%;width:110%;height:38px;background:#ffffff66;border-radius:50%;animation:wave 3s linear infinite}.wave.w2{top:5px;opacity:.45;animation-duration:4s;animation-direction:reverse}@keyframes wave{to{transform:translateX(70px)}}
.bubble{position:absolute;bottom:-30px;border:2px solid #ffffff66;border-radius:50%;animation:bubble linear infinite}.fish{position:absolute;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;touch-action:manipulation;filter:drop-shadow(0 5px 3px #003b5c55);animation:swim linear forwards}.fish .body{font-size:58px}.fish .num{font-size:24px;font-weight:1000;color:white;background:#0876a8;border:3px solid white;border-radius:50%;min-width:44px;height:44px;display:grid;place-items:center}.fish.left{animation-name:swimL}.fish.right{animation-name:swimR}@keyframes swimL{from{transform:translateX(105vw) scaleX(1)}to{transform:translateX(-180px) scaleX(1)}}@keyframes swimR{from{transform:translateX(-180px) scaleX(-1)}to{transform:translateX(105vw) scaleX(-1)}}@keyframes bubble{to{transform:translateY(-110vh);opacity:0}}
.net{position:absolute;z-index:35;pointer-events:none;font-size:76px;left:50%;top:60%;transform:translate(-50%,-50%);display:none;transition:transform .25s}.net.show{display:block}.net.catch{animation:catch .45s ease}@keyframes catch{50%{transform:translate(-50%,-80%) rotate(-12deg)}}
.message{position:absolute;z-index:45;top:46%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:1000;color:white;text-shadow:0 2px 4px #003b5c;white-space:nowrap}.success{color:#aaffd5}.wrong{color:#ffd0d0}
.btn{border:0;border-radius:16px;padding:12px 20px;background:#0876d1;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.home{position:absolute;z-index:60;left:12px;bottom:12px}.restart{position:absolute;z-index:60;right:12px;bottom:12px;background:#f39b28}
.screen,.celebrate{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.celebrate{display:none}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{font-size:34px;margin:8px}.bigicon{font-size:70px}.hidden{display:none!important}@media(max-width:600px){.fish .body{font-size:46px}.fish .num{font-size:20px;min-width:38px;height:38px}.message{top:48%;font-size:18px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head>
<body><div class="game"><div class="hud"><div class="title">🎣 Sayı Avı</div><div class="mission" id="mission">Doğru balığı yakala!</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div>
<div class="water" id="water"><div class="wave"></div><div class="wave w2"></div></div><div class="net" id="net">🕸️</div><div class="message" id="msg">Şu sayıyı yakala!</div>
<button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button>
<div class="screen" id="start"><div class="panel"><div class="bigicon">🎣🐟</div><h1>Sayı Avı</h1><p>Balıklar hareket ediyor! Doğru sayılı balığı yakala.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div>
<div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn" id="next">Sonraki Seviye ➡️</button></div></div></div>
<script>
const levels=[[1,2,3],[1,2,3,4],[2,3,4,5],[3,4,5,6,7],[5,6,7,8,9,10]];let L=0,Q=0,score=0,target,active=true,timer;
const $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)];
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function makeFish(n,i){let f=document.createElement('div');f.className='fish '+(Math.random()<.5?'left':'right');f.style.top=(10+Math.random()*70)+'%';f.style.animationDuration=(4.5+Math.random()*2.5-Math.min(L*.55,2))+'s';f.innerHTML='<span class="body">'+['🐟','🐠','🐡','🐟'][i%4]+'</span><span class="num">'+n+'</span>';f.onclick=()=>catchFish(f,n);$('water').appendChild(f)}
function render(){active=true;target=rnd(levels[L]);$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('msg').className='message';$('msg').textContent='Şu sayıyı yakala: '+target;speak('Şu sayıyı yakala '+target);
[...document.querySelectorAll('.fish')].forEach(x=>x.remove());let nums=[target];let pool=levels[L];while(nums.length<Math.min(3+L,6)){let n=rnd(pool);if(!nums.includes(n))nums.push(n)}nums.sort(()=>Math.random()-.5);nums.forEach((n,i)=>makeFish(n,i))}
function catchFish(f,n){if(!active)return;active=false;let net=$('net');net.style.left=f.offsetLeft+f.offsetWidth/2+'px';net.style.top=f.offsetTop+f.offsetHeight/2+'px';net.classList.add('show','catch');if(n===target){score+=10;Q++;$('msg').className='message success';$('msg').textContent='Aferin! Doğru balığı yakaladın!';speak('Aferin! Doğru!');f.style.opacity='.25';setTimeout(()=>{net.className='net';if(Q>=5)done();else render()},650)}else{score=Math.max(0,score-1);$('msg').className='message wrong';$('msg').textContent='Yanlış balık! Tekrar dene.';speak('Tekrar dene');setTimeout(()=>{net.className='net';active=true},700)}}
function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}
function confetti(){for(let i=0;i<50;i++){let c=document.createElement('i');c.style.cssText='position:absolute;width:10px;height:18px;top:-20px;left:'+Math.random()*100+'%;background:hsl('+Math.random()*360+' 90% 60%);animation:fall 1.5s linear forwards;z-index:110';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),1800)}}
const st=document.createElement('style');st.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}';document.head.appendChild(st);
$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();
</script></body></html>
