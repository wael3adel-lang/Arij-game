<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sayı Avı</title><link rel="stylesheet" href="_common.css"><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(#74dcff,#0785b5)}</style></head><body><div class="game"><div class="hud"><div class="title">🎣 Sayı Avı</div><div class="mission">Doğru balığı yakala!</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="pic">🐠</div><div class="message" id="msg">Şu sayıyı yakala!</div><div class="choices" id="choices"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎣</div><h1>Sayı Avı</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const levels=[[1,2,3],[1,2,3,4],[2,3,4,5],[3,4,5,6,7],[5,6,7,8,9,10]];let L=0,Q=0,score=0,target;const els=id=>document.getElementById(id);function rnd(a){return a[Math.floor(Math.random()*a.length)]}function speak(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}function render(){let nums=levels[L];target=rnd(nums);els('level').textContent=L+1;els('round').textContent=Q+1;els('score').textContent=score;els('bar').style.width=((Q)/5*100)+'%';els('msg').textContent='Şu sayıyı yakala: '+target;speak('Şu sayıyı yakala '+target);let arr=[target];while(arr.length<Math.min(3+L,6)){let n=rnd(nums);if(!arr.includes(n))arr.push(n)}arr.sort(()=>Math.random()-.5);els('choices').innerHTML=arr.map((n,i)=>`<button class="choice fish">${['🐟','🐠','🐡','🦈','🐙','🪼'][i%6]}<br>${n}</button>`).join('');[...els('choices').children].forEach(b=>b.onclick=()=>{let n=+b.textContent.match(/\d+/)[0];if(n===target){score+=10;Q++;els('msg').className='message success';els('msg').textContent='Aferin! Doğru balığı yakaladın!';speak('Aferin');setTimeout(()=>Q>=5?levelDone():render(),550)}else{score=Math.max(0,score-1);els('msg').className='message wrong';els('msg').textContent='Tekrar dene!'}})}function levelDone(){els('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();els('celebrate').style.display='flex';}function confetti(){for(let i=0;i<70;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1.2+Math.random()*1.8)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3200)}}els('startBtn').onclick=()=>{els('start').classList.add('hidden');render()};els('next').onclick=()=>{els('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};els('restart').onclick=()=>{L=0;Q=0;score=0;els('start').classList.remove('hidden');els('celebrate').style.display='none'};</script></body></html>
