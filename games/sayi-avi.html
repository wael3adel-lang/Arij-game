<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sayı Avı</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
#sea{position:absolute;inset:128px 0 68px;overflow:hidden;background:radial-gradient(circle at 50% 12%,#38c2f0,#087eae 55%,#045476);border-top:5px solid #62d7f5}.targetBox{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:25;background:#fff;border-radius:22px;padding:7px 28px 10px;text-align:center;box-shadow:0 8px 22px #0003;font-size:20px;font-weight:1000;min-width:170px}.targetBox b{display:block;font-size:54px;line-height:1;color:#e95c38}.listen{position:absolute;right:-45px;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:46px;height:46px;background:#fff;font-size:23px;box-shadow:0 5px 12px #0003;cursor:pointer}.fish{position:absolute;width:105px;height:64px;z-index:12;cursor:pointer;touch-action:manipulation;transition:filter .2s}.fish svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 9px 5px #003c5555)}.fish .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:39px;height:39px;border-radius:50%;background:#fff;color:#18324a;display:grid;place-items:center;font-size:25px;font-weight:1000;box-shadow:0 2px 5px #0003}.fish.caught{animation:fishCatch .45s forwards}.net{position:absolute;right:5%;bottom:7%;z-index:20;font-size:0;width:105px;height:105px;opacity:.82}.net svg{width:100%;height:100%}.bubble{position:absolute;border:3px solid #fff8;border-radius:50%;animation:bubble 5s linear infinite;bottom:-40px}.game>.message{position:absolute;top:177px;left:50%;transform:translateX(-50%);z-index:30;background:#ffffffea;padding:8px 18px;border-radius:18px;white-space:nowrap}.success{color:#0b9c68}.wrong{color:#e04b4b}@keyframes fishCatch{0%{transform:scale(1)}45%{transform:scale(1.18) rotate(-8deg)}100%{transform:scale(0);opacity:0}}@keyframes bubble{to{transform:translateY(-85vh);opacity:0}}@media(max-width:600px){#sea{inset:122px 0 70px}.fish{width:86px;height:54px}.targetBox{font-size:17px;padding:6px 23px 8px}.targetBox b{font-size:48px}.listen{right:-42px;width:42px;height:42px}.game>.message{top:170px;font-size:15px}.net{width:82px;height:82px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game" style="background:linear-gradient(#4ec5ee,#045477)"><div class="hud"><div class="title">🎣 Sayı Avı</div><div class="mission">Doğru balığı yakala!</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div id="sea"><div class="targetBox" id="targetBox"></div><div id="fishArea"></div><div id="bubbleArea"></div><div class="net"><svg viewBox="0 0 100 100"><path d="M12 12 Q50 28 88 12 L78 78 Q50 98 22 78Z" fill="none" stroke="#fff" stroke-width="4"/><path d="M20 25 L80 25 M18 40 L82 40 M17 55 L83 55 M20 70 L80 70 M25 15 L35 88 M40 19 L45 93 M60 19 L55 93 M75 15 L65 88" stroke="#fff" stroke-width="2" fill="none" opacity=".8"/></svg></div></div><div class="message" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🎣</div><h1>Sayı Avı</h1><p>Doğru numaralı balığı yakala!</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>const levels=[[1,2,3],[1,2,3,4],[2,3,4,5],[3,4,5,6,7],[5,6,7,8,9,10]];let L=0,Q=0,score=0,target=0,locked=false,running=false,fish=[];const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang='tr-TR';const v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function fishSVG(i){const c=['#ffcc21','#35a9e8','#ff6b4a','#42d392','#8a6cff'][i%5];return `<svg viewBox="0 0 120 70"><defs><linearGradient id="g${i}" x1="0" x2="1"><stop stop-color="${c}"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient></defs><ellipse cx="55" cy="35" rx="39" ry="25" fill="url(#g${i})" stroke="#fff" stroke-width="2"/><path d="M18 35 L2 18 L7 35 L2 52Z" fill="${c}" stroke="#fff" stroke-width="2"/><path d="M62 13 Q72 2 80 17" fill="${c}"/><circle cx="76" cy="28" r="5" fill="#fff"/><circle cx="77" cy="28" r="2.5" fill="#18324a"/></svg>`}function render(){running=true;locked=false;target=levels[L][Math.floor(Math.random()*levels[L].length)];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('targetBox').innerHTML='Balığı yakala!<b>'+target+'</b><button class="listen" id="listen" aria-label="Dinle">🔊</button>';$('listen').onclick=()=>speak(target);$('msg').className='message';$('msg').textContent='Doğru numaralı balığa dokun!';$('fishArea').innerHTML='';fish=[];const vals=[target];while(vals.length<Math.min(4+L,7)){const n=1+Math.floor(Math.random()*10);if(!vals.includes(n))vals.push(n)}vals.sort(()=>Math.random()-.5);vals.forEach((n,i)=>{const el=document.createElement('div');el.className='fish';el.innerHTML=fishSVG(i)+'<span class="num">'+n+'</span>';el.dataset.n=n;el.x=10+Math.random()*Math.max(10,document.getElementById('sea').clientWidth-125);el.y=90+Math.random()*Math.max(20,document.getElementById('sea').clientHeight-180);el.v=(1.15+L*.25)*(Math.random()<.5?1:-1);el.style.left=el.x+'px';el.style.top=el.y+'px';el.style.transform=el.v<0?'scaleX(-1)':'none';el.onclick=()=>catchFish(el,n);$('fishArea').append(el);fish.push(el)});for(let i=0;i<16;i++){const b=document.createElement('i');b.className='bubble';const s=7+Math.random()*16;b.style.width=s+'px';b.style.height=s+'px';b.style.left=Math.random()*100+'%';b.style.animationDelay=(-Math.random()*5)+'s';$('bubbleArea').append(b)};speak(target)}function loop(){if(running){fish.forEach(f=>{if(f.classList.contains('caught'))return;f.x+=f.v;const maxX=Math.max(8,document.getElementById('sea').clientWidth-f.offsetWidth-8);if(f.x<8){f.x=8;f.v=Math.abs(f.v);f.style.transform='scaleX(1)'}if(f.x>maxX){f.x=maxX;f.v=-Math.abs(f.v);f.style.transform='scaleX(-1)'}f.style.left=f.x+'px';f.style.top=f.y+Math.sin(performance.now()/700+Number(f.dataset.n))*1.2+'px'});}requestAnimationFrame(loop)}function catchFish(el,n){if(locked||!running)return;if(n!==target){$('msg').className='message wrong';$('msg').textContent='❌ Yanlış balık! Tekrar dene.';el.animate([{transform:'scaleX('+ (el.v<0?'-1':'1') +') translateX(0)'},{transform:'scaleX('+ (el.v<0?'-1':'1') +') translateX(-12px)'},{transform:'scaleX('+ (el.v<0?'-1':'1') +') translateX(12px)'},{transform:'scaleX('+ (el.v<0?'-1':'1') +') translateX(0)'}],260);return}locked=true;running=false;score+=10;$('msg').className='message success';$('msg').textContent='🎉 Yakaladın!';el.classList.add('caught');Q++;setTimeout(()=>Q>=5?done():render(),550)}function done(){running=false;$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();speechSynthesis.onvoiceschanged=()=>{};loop();</script></html>
