<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kelime Kartları</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:200;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:24px;padding:10px 14px;box-shadow:0 10px 30px #16425b30;text-align:center;backdrop-filter:blur(8px)}.title{font-size:clamp(25px,5vw,40px);font-weight:1000;color:#172f49}.mission{font-size:clamp(17px,3.4vw,25px);font-weight:900;margin-top:2px}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:clamp(15px,3vw,20px);flex-wrap:wrap;margin-top:6px}.btn{border:0;border-radius:22px;padding:14px 25px;color:#fff;font-size:clamp(17px,3vw,23px);font-weight:1000;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #0002}.home{position:absolute;z-index:500;left:24px;bottom:14px;background:#1680d8}.restart{position:absolute;z-index:500;right:24px;bottom:14px;background:#f5a020}.feedback{position:absolute;z-index:450;left:50%;transform:translateX(-50%);top:130px;background:#fff;border-radius:24px;padding:13px 25px;font-size:clamp(18px,4vw,28px);font-weight:1000;box-shadow:0 12px 30px #0002;display:none;text-align:center}.success{color:#119a62}.error{color:#d62828}.celebrate{position:absolute;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(4px)}.panel{width:min(460px,90%);background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 70px #0005}.panel h1{margin:8px 0;font-size:38px}.panel p{font-size:20px;font-weight:800}.big{font-size:78px;filter:drop-shadow(0 12px 8px #0003)}.hidden{display:none!important}.confetti{position:absolute;width:11px;height:20px;top:42%;z-index:900;animation:conf 1s ease-out forwards;pointer-events:none}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}@media(max-width:600px){.hud{top:6px;padding:8px 10px}.home{left:20px;bottom:12px}.restart{right:20px;bottom:12px}.btn{padding:13px 19px;border-radius:20px}.feedback{top:118px;max-width:90%}}body{background:linear-gradient(135deg,#e0f7ff,#fff5dc)}.content{position:absolute;inset:135px 0 80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.visual{width:min(330px,58vw);height:min(280px,35vh);display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 18px 10px #0003)}.visual svg{width:100%;height:100%}.prompt{font-size:clamp(22px,4vw,30px);font-weight:1000;color:#168f64}.choices{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}.choice{min-width:110px;min-height:75px;border:0;border-radius:22px;background:linear-gradient(#fff,#edf5fb);box-shadow:0 11px 22px #0002,inset 0 2px 0 #fff;font-size:clamp(22px,4vw,29px);font-weight:1000;color:#087bd1;cursor:pointer;touch-action:manipulation}.choice:active{transform:scale(.97)}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🃏 Kelime Kartları</div><div class="mission">Resmi gör, doğru kelimeyi seç.</div><div class="stats">⭐ Puan: <b id="score">0</b>　|　🏆 Seviye: <b id="level">1</b>/5　|　🎯 Soru: <b id="q">1</b>/5</div></div><div class="content"><div class="visual" id="visual"></div><div class="prompt">Doğru kelimeyi seç:</div><div class="choices" id="choices"></div></div><div class="feedback" id="msg"></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn restart" id="restart">🔄 Yeniden Başlat</button><div class="celebrate" id="celebrate"><div class="panel"><div class="big">🃏🎉</div><h1>Aferin!</h1><p id="done"></p><button class="btn" id="next" style="background:#1680d8">Sonraki Seviye ➡️</button></div></div></div><script>const cards=[[('ELMA', 'ELMA'), ('KÖPEK', 'KÖPEK'), ('BALIK', 'BALIK'), ('ARABA', 'ARABA')], [('GÜNEŞ', 'GÜNEŞ'), ('AĞAÇ', 'AĞAÇ'), ('MUZ', 'MUZ'), ('KELEBEK', 'KELEBEK')], [('TAVŞAN', 'TAVŞAN'), ('GÜL', 'GÜL'), ('ÇİLEK', 'ÇİLEK'), ('OTOBÜS', 'OTOBÜS')], [('ASLAN', 'ASLAN'), ('KARPUZ', 'KARPUZ'), ('BİSİKLET', 'BİSİKLET'), ('ZÜRAFA', 'ZÜRAFA')], [('FİL', 'FİL'), ('UÇAK', 'UÇAK'), ('SİNCAP', 'SİNCAP'), ('PORTAKAL', 'PORTAKAL')]];const arts={'ELMA': '<svg viewBox="0 0 220 220"><defs><radialGradient id="a"><stop stop-color="#ff6a62"/><stop offset="1" stop-color="#b70d1d"/></radialGradient></defs><path d="M112 65C82 35 38 55 40 108C43 163 78 190 112 198C146 190 180 163 183 108C185 55 142 35 112 65Z" fill="url(#a)" stroke="#8b1420" stroke-width="5"/><path d="M112 65Q108 25 132 12" fill="none" stroke="#5a321d" stroke-width="7" stroke-linecap="round"/><path d="M130 28Q163 8 176 36Q150 52 130 28Z" fill="#35b94a" stroke="#177f30" stroke-width="4"/></svg>', 'KÖPEK': '<svg viewBox="0 0 220 220"><circle cx="110" cy="118" r="67" fill="#f2c58c" stroke="#9c622d" stroke-width="5"/><ellipse cx="55" cy="85" rx="34" ry="50" fill="#a86a2c"/><ellipse cx="165" cy="85" rx="34" ry="50" fill="#a86a2c"/><ellipse cx="110" cy="130" rx="43" ry="38" fill="#fff1d4"/><circle cx="85" cy="112" r="9"/><circle cx="135" cy="112" r="9"/><ellipse cx="110" cy="137" rx="15" ry="11" fill="#222"/><path d="M100 151Q110 165 120 151" stroke="#e45a75" stroke-width="7" fill="none" stroke-linecap="round"/></svg>', 'BALIK': '<svg viewBox="0 0 260 150"><defs><linearGradient id="fg" x1="0" x2="1"><stop stop-color="#ffe96a"/><stop offset=".45" stop-color="#35c9e8"/><stop offset="1" stop-color="#0874ad"/></linearGradient><radialGradient id="fh"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><ellipse cx="133" cy="73" rx="92" ry="51" fill="url(#fg)" stroke="#075b85" stroke-width="6"/><path d="M45 74L8 42L17 74L8 106Z" fill="#16a5d1" stroke="#075b85" stroke-width="6"/><path d="M115 32Q138 8 155 34L142 64Z" fill="#6de8ff" stroke="#0874ad" stroke-width="4"/><ellipse cx="170" cy="47" rx="38" ry="20" fill="url(#fh)"/><circle cx="190" cy="62" r="11" fill="#fff"/><circle cx="193" cy="62" r="6" fill="#142b3d"/><path d="M183 86Q200 95 215 86" fill="none" stroke="#075b85" stroke-width="4" stroke-linecap="round"/></svg>', 'ARABA': '<svg viewBox="0 0 240 200"><defs><linearGradient id="c" x1="0" x2="1"><stop stop-color="#ff7064"/><stop offset="1" stop-color="#bd1220"/></linearGradient></defs><path d="M35 128L54 78Q63 56 91 53H155Q179 55 190 78L207 128V155H35Z" fill="url(#c)" stroke="#86101a" stroke-width="6"/><rect x="75" y="63" width="79" height="45" rx="12" fill="#6ed4f4" stroke="#1c5770" stroke-width="5"/><circle cx="68" cy="151" r="23" fill="#1d2025"/><circle cx="177" cy="151" r="23" fill="#1d2025"/></svg>', 'GÜNEŞ': '☀️', 'AĞAÇ': '🌳', 'MUZ': '🍌', 'KELEBEK': '🦋', 'TAVŞAN': '🐰', 'GÜL': '🌹', 'ÇİLEK': '🍓', 'OTOBÜS': '🚌', 'ASLAN': '🦁', 'KARPUZ': '🍉', 'BİSİKLET': '🚲', 'ZÜRAFA': '🦒', 'FİL': '🐘', 'UÇAK': '✈️', 'SİNCAP': '🐿️', 'PORTAKAL': '🍊'};let L=0,Q=0,score=0,item;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function render(){item=cards[L][Q%cards[L].length];$('level').textContent=L+1;$('q').textContent=Q+1;$('score').textContent=score;const a=arts[item[0]];$('visual').innerHTML=a&&a.startsWith('<')?a:'<div style="font-size:145px;filter:drop-shadow(0 15px 8px #0003)">'+(a||'❓')+'</div>';const all=cards[L].map(x=>x[1]);let opts=[item[1]];while(opts.length<3){const x=all[Math.floor(Math.random()*all.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);$('choices').innerHTML='';opts.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(x)});$('msg').style.display='none'}function answer(x){if(x===item[1]){score+=10;$('score').textContent=score;$('msg').className='feedback success';$('msg').textContent='🎉 Aferin!';$('msg').style.display='block';speak(item[1]);setTimeout(()=>{Q++;if(Q>=5){$('done').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex'}else render()},800)}else{$('msg').className='feedback error';$('msg').textContent='❌ Tekrar dene!';$('msg').style.display='block'}}$('restart').onclick=()=>location.reload();$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};render();</script></body></html>
