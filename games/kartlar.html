<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelime Kartları</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e9f8ff,#fff8e9);color:#26364a;overflow:hidden}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94%,700px);display:flex;justify-content:space-between;z-index:10;font-weight:900}.pill{background:#fff;padding:9px 14px;border-radius:14px;box-shadow:0 5px 18px #0001}
#watermark{position:fixed;top:57px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#8da1b4;opacity:.55;z-index:9}
main{width:min(94%,680px);margin:auto;padding:105px 0 25px;text-align:center}h1{font-size:clamp(28px,7vw,43px);margin:0 0 7px;color:#2874c6}.instruction{font-size:clamp(18px,5vw,25px);font-weight:900;margin-bottom:16px}#message{height:35px;margin-top:14px;font-size:21px;font-weight:900}
#startScreen{position:fixed;inset:0;background:linear-gradient(180deg,#e9f8ff,#fff8e9);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.startBox{width:min(92%,440px);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 55px #0002}.startLogo{font-size:42px;font-weight:900;color:#2874c6}.startBox h2{margin:5px 0 10px;font-size:30px;color:#e48728}.startBox p{font-size:18px;line-height:1.5}#startButton{border:0;border-radius:18px;background:#2874c6;color:#fff;padding:16px 30px;font-size:21px;font-weight:900;cursor:pointer}
@media(max-height:700px){#hud{top:30px}main{padding-top:85px}}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:12px}.tab{border:0;padding:10px 16px;border-radius:14px;background:#fff;font-weight:900;cursor:pointer}.tab.active{background:#2874c6;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:540px;margin:auto}.card{min-height:125px;border:0;border-radius:24px;background:#fff;box-shadow:0 10px 25px #0001;font-size:24px;font-weight:900;color:#2874c6;cursor:pointer}</style></head><body>
<div id="startScreen"><div class="startBox"><div class="startLogo">ARİJ</div><h2>🃏 Kelime Kartları</h2><p>Zıt ve eş anlamlı kelimeleri öğren!</p><button id="startButton">Başla</button></div></div>
<div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">60</span></div><div class="pill">🎯 <span id="round">1</span>/10</div></div><div id="watermark">ARİJ OYUNU</div>
<main><h1>🃏 Kelime Kartları</h1><div class="tabs"><button class="tab active" id="zıt">Zıt Anlamlı</button><button class="tab" id="es">Eş Anlamlı</button></div><div class="instruction" id="inst"></div><div class="grid" id="grid"></div><div id="message"></div></main>
<script>const sounds={click:new Audio("../sounds/click.wav"),correct:new Audio("../sounds/correct.wav"),wrong:new Audio("../sounds/wrong.wav")};function play(n){try{sounds[n].currentTime=0;sounds[n].play().catch(()=>{});}catch(e){}}
const sets={zıt:[["Büyük","Küçük"],["Uzun","Kısa"],["Sıcak","Soğuk"],["Gece","Gündüz"],["Hızlı","Yavaş"],["Yeni","Eski"],["Açık","Kapalı"],["Mutlu","Üzgün"]],es:[["Büyük","İri"],["Cevap","Yanıt"],["Doktor","Hekim"],["Yürek","Kalp"],["Misafir","Konuk"],["Öykü","Hikâye"],["Siyah","Kara"],["Fakir","Yoksul"]]};
let mode="zıt",r=0,s=0,t=60,timer,cur;
function next(){if(r>=10)return finish();r++;round.textContent=r;cur=sets[mode][Math.floor(Math.random()*sets[mode].length)];inst.textContent="“"+cur[0]+"” kelimesinin "+(mode==="zıt"?"zıt":"eş")+" anlamlısını bul.";let opts=[cur[1]],all=sets[mode].flat();while(opts.length<4){let v=all[Math.floor(Math.random()*all.length)];if(!opts.includes(v)&&v!==cur[0])opts.push(v)}opts.sort(()=>Math.random()-.5);grid.innerHTML="";opts.forEach(v=>{let b=document.createElement("button");b.className="card";b.textContent=v;b.onclick=()=>choose(v);grid.appendChild(b)})}
function choose(v){play("click");if(v===cur[1]){s++;score.textContent=s;message.textContent="🎉 Doğru!";play("correct");setTimeout(next,650)}else{message.textContent="Tekrar düşün!";play("wrong")}}
function change(m){mode=m;r=0;document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));document.getElementById(m==="zıt"?"zıt":"es").classList.add("active");next()}
function finish(){clearInterval(timer);message.textContent="🏆 Bitti! "+s+" / 10"}function start(){startScreen.style.display="none";next();timer=setInterval(()=>{t--;time.textContent=t;if(t<=0)finish()},1000)}startButton.onclick=start;zıt.onclick=()=>change("zıt");es.onclick=()=>change("es");
</script></body></html>
