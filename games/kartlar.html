<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kelime Kartları</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#18324a}body{overflow:hidden}.game{height:100%;position:relative;overflow:hidden}.hud{position:absolute;z-index:40;top:10px;left:50%;transform:translateX(-50%);width:min(940px,94%);background:#ffffffee;border:2px solid #fff;border-radius:22px;padding:9px 14px;box-shadow:0 8px 28px #16425b33;text-align:center}.title{font-size:clamp(23px,4vw,36px);font-weight:1000;color:#0876a8}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.stats{display:flex;justify-content:center;gap:12px;font-weight:900;font-size:14px;flex-wrap:wrap}.bar{height:7px;background:#dcebf2;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#35c98a;transition:width .25s}.btn{border:0;border-radius:16px;padding:14px 24px;background:#0876d1;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin:5px;touch-action:manipulation}.btn.alt{background:#f39b28}.btn.green{background:#23a86b}.btn.secondary{background:#eef6fb;color:#0876a8}.home{position:absolute;z-index:45;left:12px;bottom:12px}.restart{position:absolute;z-index:45;right:12px;bottom:12px}.message{font-weight:1000;font-size:20px;margin:8px;text-align:center}.success{color:#15945d}.wrong{color:#d34848}.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#073b57aa;backdrop-filter:blur(2px)}.panel{width:min(470px,90%);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 55px #0005}.panel h1{margin:8px 0;font-size:34px}.bigicon{font-size:70px}.celebrate{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#0a4366aa}.celebrate .panel{animation:pop .35s ease}.hidden{display:none!important}.confetti{position:absolute;width:10px;height:18px;top:-25px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.95}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}button{font-family:inherit}@media(max-width:600px){.hud{top:5px;padding:8px 10px}.btn{font-size:16px}.home,.restart{bottom:10px}.panel{padding:22px}}
body{background:linear-gradient(135deg,#e8f9ff,#fff6e2)}.content{position:absolute;inset:130px 0 68px;display:flex;flex-direction:column;align-items:center;justify-content:center}.picture{width:min(360px,70vw);height:300px;display:grid;place-items:center}.picture svg{width:100%;height:100%;filter:drop-shadow(0 14px 8px #0002)}.prompt{font-size:22px;font-weight:1000;margin:3px}.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}.choice{min-width:130px;min-height:70px;border:0;border-radius:20px;background:#fff;box-shadow:0 9px 20px #0002;font-size:25px;font-weight:1000;color:#0876d1;cursor:pointer}.message{min-height:30px}@media(max-width:600px){.content{inset:122px 0 70px}.picture{height:240px}.choice{min-width:100px;min-height:62px;font-size:22px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script></head><body><div class="game"><div class="hud"><div class="title">🃏 Kelime Kartları</div><div class="mission">Resmi gör, doğru kelimeyi seç.</div><div class="stats">⭐ Puan: <b id="score">0</b> | 🏆 Seviye: <b id="level">1</b>/5 | 🎯 Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="picture" id="pic"></div><div class="prompt">Doğru kelimeyi seç:</div><div class="choices" id="grid"></div><div class="message" id="msg"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🃏</div><h1>Kelime Kartları</h1><p>Resme bak ve doğru kelimeyi seç.</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText"></p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div></body><script>const cards=[[['apple','ELMA'],['dog','KÖPEK'],['cat','KEDİ'],['fish','BALIK'],['car','ARABA']],[['sun','GÜNEŞ'],['tree','AĞAÇ'],['banana','MUZ'],['butterfly','KELEBEK'],['house','EV']],[['rabbit','TAVŞAN'],['rose','GÜL'],['strawberry','ÇİLEK'],['bus','OTOBÜS'],['turtle','KAPLUMBAĞA']],[['lion','ASLAN'],['watermelon','KARPUZ'],['bicycle','BİSİKLET'],['giraffe','ZÜRAFA'],['rainbow','GÖKKUŞAĞI']],[['elephant','FİL'],['plane','UÇAK'],['squirrel','SİNCAP'],['crocodile','TİMSAH'],['orange','PORTAKAL']]];let L=0,Q=0,score=0,item;const $=id=>document.getElementById(id);function svg(k){if(k==='apple')return `<svg viewBox="0 0 260 260"><path d="M130 68 Q132 30 160 18" stroke="#5a321d" stroke-width="10" fill="none"/><ellipse cx="169" cy="33" rx="35" ry="17" fill="#35a853" transform="rotate(-25 169 33)"/><path d="M65 100 Q85 58 130 74 Q175 58 195 100 Q220 168 160 212 Q130 232 100 212 Q40 168 65 100Z" fill="#ef3d45" stroke="#9d1c25" stroke-width="5"/><ellipse cx="100" cy="104" rx="32" ry="15" fill="#fff8" transform="rotate(-25 100 104)"/></svg>`;if(k==='dog')return `<svg viewBox="0 0 260 260"><path d="M76 92 Q35 48 25 82 Q30 130 72 127" fill="#c98a55" stroke="#633d24" stroke-width="6"/><path d="M184 92 Q225 48 235 82 Q230 130 188 127" fill="#c98a55" stroke="#633d24" stroke-width="6"/><circle cx="130" cy="135" r="84" fill="#dba06a" stroke="#633d24" stroke-width="6"/><circle cx="98" cy="124" r="9"/><circle cx="162" cy="124" r="9"/><ellipse cx="130" cy="157" rx="22" ry="15" fill="#3a2418"/><path d="M130 172 Q116 191 102 178 M130 172 Q144 191 158 178" stroke="#633d24" stroke-width="5" fill="none"/></svg>`;if(k==='cat')return `<svg viewBox="0 0 260 260"><path d="M75 92 L60 38 L105 68 Q130 55 155 68 L200 38 L185 92 Q204 178 130 212 Q56 178 75 92Z" fill="#f0b82f" stroke="#704b18" stroke-width="6"/><ellipse cx="101" cy="120" rx="8" ry="13"/><ellipse cx="159" cy="120" rx="8" ry="13"/><path d="M130 140 l-12 10 12 10 12-10Z" fill="#d37b7b"/><path d="M121 158 Q130 170 139 158" stroke="#704b18" stroke-width="4" fill="none"/></svg>`;return `<svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="88" fill="#8fd2ee" stroke="#277b9f" stroke-width="7"/><circle cx="98" cy="112" r="9"/><circle cx="162" cy="112" r="9"/><path d="M96 166 Q130 188 164 166" stroke="#277b9f" stroke-width="6" fill="none"/></svg>`}function render(){item=cards[L][Q];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('bar').style.width=(Q/5*100)+'%';$('pic').innerHTML=svg(item[0]);$('msg').className='message';$('msg').textContent='Doğru kelimeyi seç.';const opts=[item[1]];const all=cards[L].map(x=>x[1]);while(opts.length<3){const x=all[Math.floor(Math.random()*all.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);$('grid').innerHTML=opts.map(x=>`<button class="choice">${x}</button>`).join('');[...$('grid').children].forEach(b=>b.onclick=()=>{if(b.textContent===item[1]){score+=10;$('msg').className='message success';$('msg').textContent='🎉 Aferin!';speak(item[1]);setTimeout(()=>{Q++;Q>=5?done():render()},550)}else{$('msg').className='message wrong';$('msg').textContent='❌ Tekrar dene!'}})}function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';const v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('tr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';$('celebrate').style.display='flex';confetti()}function confetti(){for(let i=0;i<45;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.background=`hsl(${Math.random()*360} 90% 60%)`;c.style.animationDuration=(1+Math.random()*1.4)+'s';document.querySelector('.game').append(c);setTimeout(()=>c.remove(),2600)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></html>
