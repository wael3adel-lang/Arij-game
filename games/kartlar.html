<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kelime Kartları</title><link rel="stylesheet" href="_common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../student-access.js"></script><style>.game{background:linear-gradient(135deg,#dff7ff,#fff4dc)}</style></head><body><div class="game"><div class="hud"><div class="title">🃏 Kelime Kartları</div><div class="mission">Resmi gör, doğru kelimeyi seç.</div><div class="stats">⭐ Puan: <b id="score">0</b> &nbsp; | &nbsp; 🏆 Seviye: <b id="level">1</b>/5 &nbsp; | &nbsp; ⭐ Soru: <b id="round">1</b>/5</div><div class="bar"><i id="bar"></i></div></div><div class="content"><div class="message" id="msg">Resmi doğru kelimeyle eşleştir.</div><div class="choices" id="grid"></div></div><button class="btn home" onclick="location.href='../index.html'">🏠 Ana Menü</button><button class="btn alt restart" id="restart">🔄 Yeniden Başlat</button><div class="screen" id="start"><div class="panel"><div class="bigicon">🃏</div><h1>Kelime Kartları</h1><p>5 seviye • Kolaydan zora</p><button class="btn" id="startBtn">Oyuna Başla 🚀</button></div></div><div class="celebrate" id="celebrate"><div class="panel"><div class="bigicon">🎉🏆🎊</div><h1>Aferin!</h1><p id="celebrateText">Seviyeyi tamamladın!</p><button class="btn green" id="next">Sonraki Seviye ➡️</button></div></div></div><script>const cards=[[['🐱','KEDİ'],['🐶','KÖPEK'],['🐟','BALIK'],['🍎','ELMA'],['🚗','ARABA']],[['🌞','GÜNEŞ'],['🌳','AĞAÇ'],['🍌','MUZ'],['🦋','KELEBEK'],['🏠','EV']],[['🐰','TAVŞAN'],['🌹','GÜL'],['🍓','ÇİLEK'],['🚌','OTOBÜS'],['🐢','KAPLUMBAĞA']],[['🦁','ASLAN'],['🍉','KARPUZ'],['🚲','BİSİKLET'],['🦒','ZÜRAFA'],['🌈','GÖKKUŞAĞI']],[['🐘','FİL'],['✈️','UÇAK'],['🐿️','SİNCAP'],['🐊','TİMSAH'],['🍊','PORTAKAL']]];let L=0,Q=0,score=0,item;const $=id=>document.getElementById(id);function speak(t){try{speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}function render(){item=cards[L][Q];$('level').textContent=L+1;$('round').textContent=Q+1;$('score').textContent=score;$('msg').innerHTML=`<span style="font-size:70px">${item[0]}</span><br>Doğru kelimeyi seç:`;let opts=[item[1]];let all=cards[L].map(x=>x[1]);while(opts.length<3){let x=all[Math.floor(Math.random()*all.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);$('grid').innerHTML=opts.map(x=>`<button class="choice">${x}</button>`).join('');[...$('grid').children].forEach(b=>b.onclick=()=>{if(b.textContent===item[1]){score+=10;Q++;$('msg').className='message success';$('msg').textContent='Aferin!';speak(item[1]);setTimeout(()=>Q>=5?done():render(),500)}else{$('msg').className='message wrong';$('msg').textContent='Tekrar dene!'}})}function done(){$('celebrateText').textContent='Seviye '+(L+1)+' tamamlandı!';confetti();$('celebrate').style.display='flex'}function confetti(){for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1+Math.random()*2)+'s';c.style.background=`hsl(${Math.random()*360} 90% 60%)`;document.querySelector('.game').append(c);setTimeout(()=>c.remove(),3000)}}$('startBtn').onclick=()=>{$('start').classList.add('hidden');render()};$('next').onclick=()=>{$('celebrate').style.display='none';if(L<4){L++;Q=0;render()}else{L=0;Q=0;score=0;render()}};$('restart').onclick=()=>location.reload();</script></body></html>
