<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🎣 Sayı Avı</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{background:#071d3a;color:#fff}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#79e0ff 0 16%,#24b9e8 16% 45%,#087eb5 45% 100%)}
.sky{position:absolute;inset:0 0 84%}.sun{position:absolute;width:82px;height:82px;border-radius:50%;right:7%;top:20px;background:#ffe88c;box-shadow:0 0 40px #fff8}
.cloud{position:absolute;width:140px;height:34px;border-radius:40px;background:#fff9;left:7%;top:45px}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fff9}.cloud:before{width:55px;height:55px;left:20px;top:-27px}.cloud:after{width:65px;height:65px;left:65px;top:-34px}
.hud{position:absolute;z-index:50;top:10px;left:50%;transform:translateX(-50%);width:min(820px,94%);padding:9px 15px;border-radius:22px;background:#fffffff2;color:#103650;box-shadow:0 7px 25px #003b5b44;text-align:center}
.logo{font-size:clamp(22px,4vw,34px);font-weight:1000;color:#0876a8;position:relative}.logo #soundBtn{border:0;background:#e8f8ff;color:#0876a8;border-radius:50%;width:38px;height:38px;padding:0;font-size:21px;box-shadow:none;vertical-align:middle;margin-left:8px;cursor:pointer}.mission{font-size:clamp(16px,3vw,23px);font-weight:900}.mission b{font-size:1.35em;color:#ef6338}
.stats{display:flex;justify-content:center;gap:22px;font-weight:900;font-size:14px}.bar{height:6px;background:#d9edf5;border-radius:10px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#ff8738;transition:width .25s}
.sea{position:absolute;inset:16% 0 0;overflow:hidden}.wave{position:absolute;width:120%;left:-10%;height:70px;border-radius:50%;background:#ffffff16;top:5%}.wave:nth-child(2){top:28%;opacity:.5}.wave:nth-child(3){top:53%;opacity:.3}
.sunken{position:absolute;bottom:-20px;left:6%;font-size:80px;opacity:.45}.plant{position:absolute;bottom:-8px;font-size:65px;opacity:.7}.p1{left:18%}.p2{right:18%}.p3{right:4%}
.bubble{position:absolute;border:2px solid #fff7;border-radius:50%;opacity:.6;animation:rise 9s linear infinite}@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
.fish{position:absolute;width:108px;height:68px;border-radius:55% 48% 48% 55%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:1000;color:#183448;cursor:pointer;touch-action:manipulation;user-select:none;z-index:10;box-shadow:0 7px 10px #003c5c55;transition:filter .15s}
.fish:after{content:"";position:absolute;right:-31px;border-top:23px solid transparent;border-bottom:23px solid transparent;border-left:38px solid var(--c)}
.fish:before{content:"";position:absolute;left:13px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff}.eye{position:absolute;left:17px;top:18px;width:6px;height:6px;border-radius:50%;background:#17232d;z-index:2}
.fish:hover{filter:brightness(1.1) scale(1.06)}.fish.good{animation:good .45s forwards}@keyframes good{50%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(0);opacity:0}}
.fish.bad{animation:bad .3s}@keyframes bad{25%{transform:translateX(-15px)}75%{transform:translateX(15px)}}
.net{position:absolute;z-index:30;width:104px;height:104px;border:6px solid #fff;border-radius:50%;pointer-events:none;display:none;box-shadow:0 0 0 3px #07526e99,0 8px 18px #0004}.net:after{content:"";position:absolute;inset:11px;border:3px dashed #fff;border-radius:50%}
.center{position:absolute;z-index:80;left:50%;top:52%;transform:translate(-50%,-50%);width:min(430px,90%);background:#fffffff5;color:#153b52;border-radius:30px;padding:30px;text-align:center;box-shadow:0 18px 55px #001e3d66}.center .emoji{font-size:70px}.center h1{margin:3px 0 8px;color:#0876a8;font-size:36px}.center p{font-size:18px;line-height:1.5}.center small{display:block;margin:10px 0;color:#527082}
button{border:0;border-radius:17px;padding:14px 26px;background:#ff8136;color:#fff;font-size:19px;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 #c95b18;touch-action:manipulation}
#feedback{position:absolute;z-index:70;left:50%;top:48%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;background:#fff;color:#126c91;padding:20px 28px;border-radius:25px;text-align:center;box-shadow:0 15px 45px #00294d66;transition:.2s}.show{opacity:1!important;transform:translate(-50%,-50%) scale(1)!important}.feedbackIcon{font-size:48px}.feedbackTitle{font-size:29px;font-weight:1000}
.choice{display:inline-block;margin-top:5px}
@media(max-width:600px){.fish{width:78px;height:53px;font-size:25px}.fish:after{right:-23px;border-top-width:18px;border-bottom-width:18px;border-left-width:28px}.net{width:88px;height:88px}.hud{top:5px}.stats{gap:12px;font-size:12px}.center{padding:24px}.sun{width:60px;height:60px}}
</style>
</head>
<body>
<div id="game">
<div class="sky"><div class="sun"></div><div class="cloud"></div></div>
<div class="hud">
 <div class="logo">🎣 SAYI AVI <button id="soundBtn" aria-label="Ses">🔊</button></div>
 <div class="mission" id="mission">Şu sayıyı yakala: <b id="target">5</b></div>
 <div class="stats"><span>⭐ Puan: <b id="score">0</b></span><span>🏆 Tur: <b id="round">1</b>/10</span><span>🔥 Seri: <b id="streak">0</b></span></div>
 <div class="bar"><i id="timebar"></i></div>
</div>
<div id="sea" class="sea"><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="sunken">⚓</div><div class="plant p1">🌿</div><div class="plant p2">🌿</div><div class="plant p3">🪸</div></div>
<div id="net" class="net"></div>
<div id="feedback"><div id="ficon" class="feedbackIcon">🎉</div><div id="ftitle" class="feedbackTitle">AFERİN!</div><div id="ftext"></div></div>
<div id="menu" class="center">
 <div class="emoji">🌊🐠🎣</div><h1>Sayı Avı</h1>
 <p><b>Doğru balığı yakala!</b><br>Hedef sayıyı bul, ağınla yakala ve yıldızları topla.</p>
 <small>10 tur • Her turda 1 doğru cevap • Hızlı ol!</small>
 <button id="startBtn">Oyuna Başla 🚀</button>
</div>
</div>
<script>
(function(){
var sea=document.getElementById("sea"), menu=document.getElementById("menu"), startBtn=document.getElementById("startBtn");
var targetEl=document.getElementById("target"),scoreEl=document.getElementById("score"),roundEl=document.getElementById("round"),streakEl=document.getElementById("streak"),bar=document.getElementById("timebar"),net=document.getElementById("net");
var feedback=document.getElementById("feedback"),ficon=document.getElementById("ficon"),ftitle=document.getElementById("ftitle"),ftext=document.getElementById("ftext");
var score=0,round=1,streak=0,target=1,playing=false,locked=false,timer=null,timeLeft=0;
var colors=["#ffd166","#ff8fab","#8ce99a","#a5d8ff","#cdb4db","#ffb86b","#f7aef8","#90dbf4"];
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clearFish(){var fs=sea.querySelectorAll(".fish");for(var i=0;i<fs.length;i++)fs[i].remove()}
function bubbles(){for(var i=0;i<18;i++){var x=document.createElement("i");x.className="bubble";var s=rand(7,22);x.style.width=s+"px";x.style.height=s+"px";x.style.left=rand(1,98)+"%";x.style.top=rand(45,105)+"%";x.style.animationDelay=(-rand(1,10))+"s";sea.appendChild(x)}}
function makeFish(){
 clearFish();var nums=[];for(var n=1;n<=10;n++)nums.push(n);
 // add a few duplicates so the target is not always obvious
 for(var j=0;j<4;j++)nums.push(rand(1,10));
 nums.sort(function(){return Math.random()-.5});
 for(var i=0;i<nums.length;i++){
  var f=document.createElement("div");f.className="fish";var c=colors[i%colors.length];
  f.style.setProperty("--c",c);f.style.background=c;f.style.left=rand(2,84)+"%";f.style.top=rand(7,86)+"%";
  f.dataset.num=nums[i];f.innerHTML='<span>'+nums[i]+'</span><i class="eye"></i>';
  f.addEventListener("click",function(){clickSound();catchFish(this)});sea.appendChild(f);swim(f);
 }
}
function swim(f){
 if(!playing||!f.parentNode)return;
 var ms=rand(2200,4800),toLeft=rand(0,1);
 f.style.transition="left "+ms+"ms linear,top "+ms+"ms ease-in-out";
 f.style.left=rand(2,86)+"%";f.style.top=rand(7,87)+"%";
 setTimeout(function(){swim(f)},ms);
}
function startRound(){
 locked=false;feedback.classList.remove("show");clearFish();
 target=rand(1,10);targetEl.textContent=target;makeFish();startTimer();
}
function startTimer(){
 clearInterval(timer);timeLeft=8;bar.style.width="100%";
 timer=setInterval(function(){timeLeft-=.1;bar.style.width=Math.max(0,timeLeft/8*100)+"%";if(timeLeft<=0){clearInterval(timer);if(!locked)wrongTimeout()}},100);
}
function wrongTimeout(){
 locked=true;streak=0;streakEl.textContent=0;wrongSound();speakTR("Süre doldu! Bir sonraki turda daha hızlı ol.");showFeedback("⏰","Geç kaldın!","Bir sonraki turda daha hızlı ol.");setTimeout(nextRound,1000);
}
function catchFish(f){
 if(!playing||locked)return;
 if(Number(f.dataset.num)===target){
   fishSound(); winSound(); speakTR("Aferin! Doğru sayıyı yakaladın!");
  locked=true;clearInterval(timer);score+=10+streak*2;streak++;scoreEl.textContent=score;streakEl.textContent=streak;
  f.classList.add("good");showFeedback("🎉","AFERİN!","Doğru sayıyı yakaladın! +"+(10+(streak-1)*2)+" puan");
  setTimeout(nextRound,900);
 }else{
  f.classList.add("bad");streak=0;streakEl.textContent=0;
  showFeedback("🐟","Tekrar dene!","Bu balıkta "+f.dataset.num+" yazıyor.");
  setTimeout(function(){f.classList.remove("bad");feedback.classList.remove("show")},600);
 }
}
function showFeedback(ic,ti,tx){ficon.textContent=ic;ftitle.textContent=ti;ftext.textContent=tx;feedback.classList.add("show")}
function nextRound(){
 feedback.classList.remove("show");clearInterval(timer);
 if(round>=10){finish();return}round++;roundEl.textContent=round;startRound()
}
function finish(){
 playing=false;clearInterval(timer);stopAmbient();clearFish();bar.style.width="0%";winSound();speakTR("Harika! Oyun bitti!");
 var stars=score>=100?"⭐⭐⭐":score>=70?"⭐⭐":"⭐";
 menu.innerHTML='<div class="emoji">🏆✨</div><h1>Oyun Bitti!</h1><p><b>'+score+' puan</b> topladın.</p><div style="font-size:32px">'+stars+'</div><p>Harika iş çıkardın! Tekrar deneyerek rekorunu kır.</p><button id="again">Tekrar Oyna 🔄</button>';
 menu.style.display="block";document.getElementById("again").addEventListener("click",startGame)
}

var audioCtx=null, masterGain=null, ambientTimer=null, soundOn=true;

function initAudio(){
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=.22;
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){}
}

function tone(freq,duration,type,volume,when){
  if(!soundOn) return;
  initAudio();
  if(!audioCtx||!masterGain) return;
  try{
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,audioCtx.currentTime+(when||0));
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime+(when||0));
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume||.08),audioCtx.currentTime+(when||0)+.015);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+(when||0)+(duration||.1));
    o.connect(g);g.connect(masterGain);o.start(audioCtx.currentTime+(when||0));o.stop(audioCtx.currentTime+(when||0)+(duration||.1)+.03);
  }catch(e){}
}

function noiseBurst(duration,volume,filterFreq){
  if(!soundOn) return;
  initAudio();
  if(!audioCtx||!masterGain) return;
  try{
    var len=Math.floor(audioCtx.sampleRate*duration), buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var s=audioCtx.createBufferSource(), f=audioCtx.createBiquadFilter(), g=audioCtx.createGain();
    s.buffer=buf; f.type="lowpass"; f.frequency.value=filterFreq||900;
    g.gain.value=volume||.05; s.connect(f);f.connect(g);g.connect(masterGain);s.start();
  }catch(e){}
}

function clickSound(){ tone(720,.06,"square",.045); tone(980,.045,"sine",.035,.035); }
function fishSound(){ tone(420,.08,"sine",.055); tone(620,.12,"sine",.045,.055); }
function wrongSound(){ tone(190,.16,"sawtooth",.07); tone(135,.18,"sine",.05,.08); }
function winSound(){
  tone(523,.16,"sine",.08);
  tone(659,.16,"sine",.08,.11);
  tone(784,.22,"sine",.09,.22);
  tone(1047,.28,"sine",.08,.36);
}
function seaSound(){ noiseBurst(.45,.018,650); }

function speakTR(text){
  if(!soundOn || !("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="tr-TR"; u.rate=.9; u.pitch=1.08; u.volume=1;
    var voices=window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if((voices[i].lang||"").toLowerCase().indexOf("tr")===0){u.voice=voices[i];break;}
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function startAmbient(){
  if(ambientTimer || !soundOn) return;
  seaSound();
  ambientTimer=setInterval(function(){
    if(!playing || !soundOn){clearInterval(ambientTimer);ambientTimer=null;return;}
    noiseBurst(.35,.012,700);
    if(Math.random()<.7) tone(520+Math.random()*160,.08,"sine",.018);
  },2200);
}

function stopAmbient(){
  if(ambientTimer){clearInterval(ambientTimer);ambientTimer=null;}
}

function startGame(){
 menu.style.display="none";score=0;round=1;streak=0;playing=true;scoreEl.textContent=0;roundEl.textContent=1;streakEl.textContent=0;startRound()
}
startBtn.addEventListener("click",startGame);
document.addEventListener("pointermove",function(e){if(!playing)return;net.style.display="block";net.style.left=(e.clientX-52)+"px";net.style.top=(e.clientY-52)+"px"});
document.addEventListener("touchstart",function(){if(playing)net.style.display="block"},{passive:true});

var soundBtn=document.getElementById("soundBtn");
soundBtn.addEventListener("click",function(e){
  e.stopPropagation();
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?"🔊":"🔇";
  if(soundOn){initAudio();startAmbient();speakTR("Sesler açık.");}
  else{stopAmbient();try{window.speechSynthesis.cancel();}catch(e){}}
});

bubbles();
})();
</script>
</body>
</html>
